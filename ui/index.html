    <path d="${line}" fill="none" stroke="${col}" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>
    <div class="bt-axis"><span>${dateFmt(t0)}</span><span>high ${signed(hi, 3)} · low ${signed(lo, 3)} SOL</span><span>${dateFmt(t1)}</span></div>`;

const usdC = (n) => n == null ? '—' : n >= 1e9 ? `$${(n / 1e9).toFixed(2)}B` : n >= 1e6 ? `$${(n / 1e6).toFixed(2)}M` : n >= 1e3 ? `$${(n / 1e3).toFixed(1)}K` : `$${n.toFixed(0)}`;
function priceFmt(n) {
  if (n == null) return '—';
  if (n >= 1000) return '$' + n.toLocaleString(undefined, { maximumFractionDigits: 0 });
  if (n >= 1) return '$' + n.toFixed(2);
  if (n >= 0.001) return '$' + n.toPrecision(3);
  // Tiny prices: $0.0₅277 means four… five zeros after the point, then 277.
  const zeros = Math.floor(-Math.log10(n)) - 1;
  const sig = Math.round(n * 10 ** (zeros + 4)).toString().slice(0, 4).replace(/0+$/, '');
  return `$0.0${String(zeros).split('').map((d) => '₀₁₂₃₄₅₆₇₈₉'[d]).join('')}${sig}`;
}
const chg = (n) => n == null ? '<span class="muted">—</span>' : `<span class="${n >= 0 ? 'pos' : 'neg'}">${n >= 0 ? '▲' : '▼'} ${Math.abs(n).toFixed(1)}%</span>`;
const ageOf = (t) => (t ? ago(t) : '—');

/** Load a market resource once, then refresh it in the background. */
async function mload(key, path, ttl = 60_000) {
  const m = S.m, cur = m.data[key];
  if (m.loading[key] || (cur && Date.now() - cur.at < ttl)) return;
  m.loading[key] = true;
  try {
    const r = await fetch(path, { headers: { 'x-copybot-token': TOKEN || '' } });
    if (r.status === 401) return showLocked();
    const j = await r.json().catch(() => ({ error: 'Bad response' }));
    m.data[key] = { at: Date.now(), ...j };
  } catch (e) {
    m.data[key] = { at: Date.now(), error: 'Could not reach market data.' };
  } finally {
    m.loading[key] = false;
    if (S.page === 'markets') render();
  }
}
const mdata = (key) => S.m.data[key];
const loadingRow = (cols, msg = 'Loading…') => `<tr><td colspan="${cols}" class="empty"><span class="spinner" style="display:inline-block;vertical-align:middle;margin-right:8px"></span>${msg}</td></tr>`;
const errBox = (d) => `<div class="empty">${esc(d.error)}</div>`;

function candleChart(c) {
  if (!c.length) return '<div class="empty">No chart data for this pool yet.</div>';
  const W = 900, H = 300, pad = 74;
  const lo = Math.min(...c.map((k) => k.l)), hi = Math.max(...c.map((k) => k.h)), span = hi - lo || hi || 1;
  const y = (v) => 10 + (H - 40) * (1 - (v - lo) / span), step = (W - pad - 10) / c.length, bw = Math.max(2, step * 0.62);
  const grid = [0, 0.5, 1].map((f) => { const v = lo + span * f; return `<line x1="0" x2="${W - pad}" y1="${y(v)}" y2="${y(v)}" class="gl"/><text x="${W - pad + 6}" y="${y(v) + 4}" class="ax">${priceFmt(v)}</text>`; }).join('');
  const bars = c.map((k, i) => {
    const x = 5 + i * step + step / 2, up = k.c >= k.o, top = y(Math.max(k.o, k.c)), h = Math.max(1, Math.abs(y(k.o) - y(k.c)));
    return `<line x1="${x}" x2="${x}" y1="${y(k.h)}" y2="${y(k.l)}" class="${up ? 'cu' : 'cd'}"/><rect x="${x - bw / 2}" y="${top}" width="${bw}" height="${h}" rx="1" class="${up ? 'cu' : 'cd'}"/>`;
  }).join('');
  const lbl = [[0, 'start'], [Math.floor(c.length / 2), 'middle'], [c.length - 1, 'end']].map(([i, anchor]) => `<text x="${5 + i * step + step / 2}" y="${H - 8}" text-anchor="${anchor}" class="ax">${new Date(c[i].t).toLocaleString([], S.m.tf === '1d' ? { month: 'short', day: 'numeric' } : { hour: '2-digit', minute: '2-digit' })}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Price chart">${grid}${bars}${lbl}</svg>`;
}

const usd = (v) => (v < 0.01 && v > 0 ? '<$0.01' : '$' + v.toFixed(2));
function aiItem(d) {
  const kind = { buy: d.verdict === 'skip' ? ['skip', 'Skipped buy'] : ['buy', 'Bought'], review: ['ai', 'Position review'], wallets: ['ai', 'Wallet review'], scout: ['ai', 'Wallet scout'], test: ['ai', 'Test'] }[d.kind] || ['ai', d.kind];
  const token = d.mint ? ` ${tokenLink(d.mint)}${d.symbol ? ` <span class="muted">${esc(d.symbol)}</span>` : ''}` : '';
  let outcome = '';
  if (d.kind === 'buy' && d.verdict === 'skip') {
    outcome = d.outcomePct === undefined ? '<div>1h result: waiting…</div>'
      : d.outcomePct === null ? '<div>1h result: no price</div>'
      : `<div>1h later: <b class="${d.outcomePct < 0 ? 'pos' : 'neg'}">${d.outcomePct > 0 ? '+' : ''}${d.outcomePct.toFixed(0)}%</b> ${d.outcomePct < 0 ? '(good skip)' : '(missed gain)'}</div>`;
  }
  const applied = d.applied?.length ? `<ul style="margin:6px 0 0;padding-left:18px">${d.applied.map((a) => `<li>${esc(a)}</li>`).join('')}</ul>` : '';
  return `<li class="ai-item"><span class="t">${time(d.t)}</span>
    <div><span class="tag ${kind[0]}">${kind[1]}</span>${token} <span class="what">${d.kind === 'buy' ? '' : esc(d.verdict)}</span></div>
    <div class="meta">${usd(d.costUsd)}${outcome}</div>
    <div class="why">${esc(d.reason)}${applied}</div></li>`;
}

function learningCard() {

  const on = cfg.learn.enabled;
  const autoTxt = { paper: 'used automatically in paper mode and suggested to you in live mode', always: 'used automatically, also in live mode', off: 'only suggested to you' }[cfg.learn.autoTuneExits];
  const lessons = L.lessons.length
    ? `<ul class="stack" style="margin:0;padding-left:18px">${L.lessons.map((l) => `<li><b>Avoiding ${esc(l.label)}</b>: lost ${Math.abs(l.avgPct).toFixed(0)}% on average over your last ${l.n} (${l.pnlSol.toFixed(3)} SOL). Tries again ${new Date(l.expiresAt).toLocaleDateString([], { weekday: 'long' })}. <a href="#" data-forget="${esc(l.feature)}|${esc(l.bucket)}">Forget</a></li>`).join('')}</ul>`
    : `<div class="muted">${L.tradesLearnedFrom < L.needed ? `Learning from your results: ${L.tradesLearnedFrom} finished trade${L.tradesLearnedFrom === 1 ? '' : 's'} so far, lessons start after ${L.needed} of a kind.` : 'Nothing is clearly losing right now, so nothing is being avoided.'}</div>`;
  const row = (b) => `<span class="chip">${esc(b.label)}: <b class="${b.avgPct >= 0 ? 'pos' : 'neg'}">${b.avgPct >= 0 ? '+' : ''}${b.avgPct.toFixed(0)}%</b> avg over ${b.n}</span>`;
  const journal = L.journal.length ? `<div class="stack" style="font-size:12.5px">${L.journal.slice(0, 6).map((j) => `<div><span class="muted">${ago(j.at)} ago</span> · ${esc(j.text)}${j.undo || j.undoStrategy ? ` <a href="#" data-undo="${j.at}">Undo</a>` : ''}</div>`).join('')}</div>` : '';
  return `<div class="card" style="margin-bottom:16px"><div class="card-h"><div><h2>Learning</h2><div class="muted" style="font-size:12.5px">Remora keeps score of the conditions each trade was bought in (coin age, liquidity, size, market mood, time of day, chain) and avoids the kinds that have been losing <i>you</i> money over the last 2 weeks. Each lesson lasts a week, then gets a fresh test. Every day it also re-checks your exits and which strategy fits each wallet best; better ones are ${autoTxt}. Works without Claude.</div></div><span class="spacer"></span>
      <label class="switch" title="Learning on/off"><input type="checkbox" id="learn-on" ${on ? 'checked' : ''}><i></i></label></div>
    <div class="card-b stack" style="font-size:13px">${on ? lessons : '<div class="muted">Off: every trade is judged by your settings only.</div>'}
      ${on && (L.best.length || L.worst.length) ? `<div class="row" style="flex-wrap:wrap;gap:6px">${L.best.filter((b) => b.avgPct > 0).map(row).join('')}${L.worst.filter((b) => b.avgPct < 0).map(row).join('')}</div>` : ''}
      ${journal}
      <div class="row"><button class="btn sm" id="learn-now" ${on ? '' : 'disabled'}>Learn now</button><label class="row muted" style="gap:6px">Better exits: <select class="input" id="learn-auto" style="width:auto"><option value="paper" ${cfg.learn.autoTuneExits === 'paper' ? 'selected' : ''}>switch in paper, ask in live</option><option value="always" ${cfg.learn.autoTuneExits === 'always' ? 'selected' : ''}>always switch</option><option value="off" ${cfg.learn.autoTuneExits === 'off' ? 'selected' : ''}>only suggest</option></select></label>${L.lastAt ? `<span class="muted">Last learned ${ago(L.lastAt)} ago</span>` : ''}</div>
    </div></div>`;
}
function wireLearning(el) {
  const save = async (patch, msg) => { if (S.dirty) return toast('Save or discard your settings changes first', true); const r = await act(() => api('PUT', '/api/config', { ...S.config, learn: { ...S.config.learn, ...patch } }), msg); if (r) { S.config = r.config; if (S.learning) Object.assign(S.learning, { enabled: r.config.learn.enabled, autoTuneExits: r.config.learn.autoTuneExits }); render(); } };

  el.querySelectorAll('[data-forget]').forEach((a) => (a.onclick = async (e) => { e.preventDefault(); const [feature, bucket] = a.dataset.forget.split('|'); const r = await act(() => api('POST', '/api/learning/forget', { feature, bucket }), 'Forgotten: new results will decide'); if (r) { S.learning = r; render(); } }));

function wireAiChoice(el, cfg) {

    <td class="r num">$${Math.round(s.liquidityUsd).toLocaleString()}</td><td class="r muted">${s.ageHours < 48 ? `${s.ageHours} h` : `${Math.round(s.ageHours / 24)} d`}</td><td>${spark(x.sparks?.[s.mint], null, 'Price over the last 6 hours')}</td></tr>`;
  const scoutJ = scoutJob();
  const hunting = sc.findTraders && sc.tradeCoins;
  const sp = x.spotter || { solana: 0, base: 0, lastAt: null, nextAt: null, alternatesBase: false };
  const when = (t) => (!t ? '' : t <= Date.now() ? 'any moment now' : `in ${ago(Date.now() - (t - Date.now()))}`);
  const huntLine = !hunting ? 'Off. Turn it on to have Remora keep looking for coins and traders the whole time it runs.'
    : !running ? 'On. Starts when the bot starts.'
    : `Coins checked ${x.at ? `${ago(x.at)} ago` : 'every minute'} · <b>${sp.solana + sp.base}</b> trader${sp.solana + sp.base === 1 ? '' : 's'} spotted catching moves${sp.base ? ` (${sp.base} on Base)` : ''}${sp.nextAt ? `, next look ${when(sp.nextAt)}` : ''} · next full wallet search ${when(x.nextTraderSearch) || 'soon'}${sp.alternatesBase ? ', alternating Solana and Base' : ''}.`;
  el.innerHTML = `
    <div class="card" style="margin-bottom:16px"><div class="card-h"><div><h2>Always hunting</h2><div class="muted" style="font-size:12.5px">While the bot runs: checks coins every ${everyTxt(sc.coinsEverySec)} and buys strong ones, spots traders who just caught a move every ${sc.spotEveryMin} min, and runs a full wallet search every ${sc.traderEveryHours} h that backtests those traders before copying any.</div></div><span class="spacer"></span>
      <label class="switch" title="Find traders + Trade coins"><input type="checkbox" id="sc-hunt" ${hunting ? 'checked' : ''}><i></i></label></div>
      <div class="card-b muted" style="font-size:13px">${huntLine}</div></div>
    <div class="grid two" style="margin-bottom:16px">
      <div class="card"><div class="card-h"><div><h2>Find traders</h2><div class="muted" style="font-size:12.5px">Looks at new <i>and</i> older coins that are moving, finds traders who caught the move, backtests them with your settings, and adds the best on a trial (¼ size first).</div></div><span class="spacer"></span><label class="switch" title="Find traders on/off"><input type="checkbox" id="sc-traders" ${sc.findTraders ? 'checked' : ''}><i></i></label></div>
        <div class="card-b stack muted" style="font-size:13px">
          <div>${sc.findTraders ? `Every <b>${sc.traderEveryHours} h</b> while the bot runs, up to <b>${sc.picksPerRun}</b> new trader${sc.picksPerRun > 1 ? 's' : ''} at a time, until you copy <b>${sc.maxWallets}</b>.${running && x.nextTraderSearch ? ` Next search ${x.nextTraderSearch <= Date.now() ? 'soon' : `in ${ago(Date.now() - (x.nextTraderSearch - Date.now()))}`}.` : ''}` : 'Off.'} ${pending}</div>
          <div class="row"><button class="btn sm" id="sc-scout" ${scoutJ ? 'disabled' : ''}>${scoutJ ? 'Searching…' : 'Search now'}</button>${S.scout ? `<span>Last search ${ago(S.scout.at)} ago: ${(() => { const t = (S.scout.notes || []).find((n) => n.startsWith('This search ')); return t ? esc(t.replace(/^This search /, '')) : S.scout.added?.length ? `added ${S.scout.added.length}` : `${S.scout.picks.length} pick${S.scout.picks.length === 1 ? '' : 's'}.`; })()} <a href="#" onclick="go('research');return false">See results →</a></span>` : ''}</div>
        </div></div>
      <div class="card"><div class="card-h"><div><h2>Trade coins</h2><div class="muted" style="font-size:12.5px">Buys coins that are rising on strong buying, on its own. Every buy goes through your limits and every safety check (rug, honeypot, holders, liquidity).</div></div><span class="spacer"></span><label class="switch" title="Trade coins on/off"><input type="checkbox" id="sc-coins" ${sc.tradeCoins ? 'checked' : ''}><i></i></label></div>
        <div class="card-b stack muted" style="font-size:13px">
          <div>${sc.tradeCoins ? `<b>${sol(sc.buySol, 3)} SOL</b> per coin, up to <b>${sc.maxPositions}</b> coins and <b>${sol(sc.budgetSol, 2)} SOL</b> at once. Stop-loss −${sc.stopLossPct}%, ${sc.takeProfitPct ? `take profit +${sc.takeProfitPct}%, ` : ''}${sc.trailingStopPct ? `trailing stop ${sc.trailingStopPct}% after +${sc.trailingAfterPct}%, ` : ''}${sc.maxHoldHours ? `sells after ${sc.maxHoldHours} h` : 'no time limit'}. Looking at ${[sc.newCoins && 'new', sc.oldCoins && 'older'].filter(Boolean).join(' and ') || 'no'} coins.` : 'Off.'} ${sc.tradeCoins ? pending : ''}</div>
          ${cfg.mode === 'live' && sc.tradeCoins ? '<div class="neg"><b>Live mode: these are real trades.</b></div>' : ''}
          <div class="row"><button class="btn sm ghost" id="sc-settings">Scanner settings</button><a href="#" data-guide="scanner">How it works →</a></div>
        </div></div>
    </div>
    <div class="grid stats">
      <div class="card stat"><div class="k">${ICON.coin}Scanner profit</div><div class="v num ${cls(r.pnlSol)}">${signed(r.pnlSol, 3)} <small style="font-size:13px" class="muted">SOL</small></div><div class="s">${cfg.mode} mode · closed trades only</div></div>
      <div class="card stat"><div class="k">${ICON.star}Win rate</div><div class="v num">${r.closed ? Math.round((r.wins / r.closed) * 100) + '%' : '–'}</div><div class="s">${r.wins} of ${r.closed} sells in profit · ${r.trades} buy${r.trades === 1 ? '' : 's'}</div></div>
      <div class="card stat"><div class="k">${pixelSvg(HEART)}Holding now</div><div class="v num">${mine.length} <small style="font-size:13px" class="muted">of ${sc.maxPositions}</small></div><div class="s">${sol(used, 3)} of ${sol(sc.budgetSol, 2)} SOL budget</div><div class="bar"><i style="width:${Math.min(100, (used / sc.budgetSol) * 100)}%"></i></div></div>
    </div>
    ${proofCardHtml(x)}
    <div class="card"><div class="card-h"><h2>Coins rising right now</h2><span class="spacer"></span><span class="muted" style="font-size:12px">${x.at ? `checked ${ago(x.at)} ago` : sc.tradeCoins || sc.trackSignals ? (running ? 'first check within a minute' : 'starts with the bot') : 'turn on Trade coins or Track every signal'}</span></div>
      ${x.error ? `<div class="banner warn" style="margin:0 16px 12px"><div>${esc(x.error)}</div></div>` : ''}
      ${x.signals.length ? `<div class="tbl-wrap"><table><thead><tr><th>Coin</th><th class="r">Last hour</th><th class="r" title="Buys vs sells in the last hour">Buys vs sells</th><th class="r" title="Last hour's volume vs its usual hourly volume">Volume</th><th class="r">Liquidity</th><th class="r">Age</th><th>Last 6 h</th></tr></thead><tbody>${x.signals.map(sigRow).join('')}</tbody></table></div>
        <div class="muted" style="font-size:12px;padding:10px 16px 14px">Best first. A coin shows here when it's up over the last hour but hasn't already run, has more buyers than sellers, more volume than usual, and isn't falling right now. The scanner tries the best one each round (if it has room), and skips coins it tried in the last 6 hours or that fail a safety check.</div>`
        : `<div class="empty"><div class="deco">${ICON.rainbow}</div><h3>${x.at ? 'Nothing rising the right way right now' : 'No scan yet'}</h3>${x.at ? 'The scanner checks again every minute or so. Quiet markets often have no signals: that\'s the scanner being picky, not broken.' : 'Turn on Trade coins and start the bot.'}</div>`}
    </div>
    ${x.bought?.length ? `<div class="card"><div class="card-h"><h2>Bought by the scanner</h2></div><div class="card-b">${x.bought.map((b) => `<div class="row" style="justify-content:space-between"><a href="#" data-mint="${esc(b.mint)}">${esc(b.symbol || short(b.mint))}</a><span class="muted">${ago(b.at)} ago</span></div>`).join('')}<div class="muted" style="font-size:12px;margin-top:8px">Open scanner coins are on the Dashboard with "Market scanner" as their source.</div></div></div>` : ''}`;
  el.querySelectorAll('[data-mint]').forEach((a) => (a.onclick = (e) => { e.preventDefault(); go('markets').then(() => openToken(a.dataset.mint)); }));
  $('#sc-settings').onclick = () => { openSettings('#scanner-settings'); };
  $('#sc-scout').onclick = async () => { const j = await act(() => api('POST', '/api/jobs/scout')); if (j) { upsertJob(j); toast('Searching for traders…'); renderScanner(el); } };
  const toggle = async (e, key, on, off) => {
    if (S.dirty) { e.target.checked = !e.target.checked; return toast('Save or discard your settings changes first', true); }
    const v = e.target.checked;
    if (v && key === 'tradeCoins' && !(await confirmModal({ title: 'Let the scanner trade coins?', confirm: 'Turn on',
      body: `<p>Remora will buy coins that are rising on strong buying, on its own: <b>${sol(sc.buySol, 3)} SOL</b> each, up to <b>${sc.maxPositions}</b> at once and <b>${sol(sc.budgetSol, 2)} SOL</b> in total. Each coin has its own stop-loss (−${sc.stopLossPct}%) and goes through every safety check.</p><p>Momentum trading is risky: many coins that are rising fall back. It stops by itself after ${cfg.trial.pauseAfterLosses || 'several'} losing trades in a row.${cfg.mode === 'live' ? ' <b>You are in live mode: these are real trades.</b> Try it in paper mode first.' : ' You are in paper mode, so nothing real is spent.'}</p>` }))) { e.target.checked = false; return; }
    const res = await act(() => api('PUT', '/api/config', { ...cfg, scanner: { ...cfg.scanner, [key]: v } }), v ? on : off);
    if (res) { S.config = res.config; renderChrome(); renderScanner(el); } else e.target.checked = !v;
  };
  $('#sc-hunt').onchange = async (e) => {
    if (S.dirty) { e.target.checked = !e.target.checked; return toast('Save or discard your settings changes first', true); }
    const v = e.target.checked;
    if (v && !(await confirmModal({ title: 'Always hunt for opportunities?', confirm: 'Start hunting',
      body: `<p>While the bot runs, Remora will:</p><ul><li>check coins every ${everyTxt(sc.coinsEverySec)} and <b>buy strong ones on its own</b>: ${sol(sc.buySol, 3)} SOL each, up to ${sc.maxPositions} at once and ${sol(sc.budgetSol, 2)} SOL in total, with a −${sc.stopLossPct}% stop-loss;</li><li>spot traders who just caught a move every ${sc.spotEveryMin} minutes;</li><li>search for wallets to copy every ${Math.min(sc.traderEveryHours, 1)} h, backtest them with your settings, and add the best on a trial (¼ size first), up to ${sc.maxWallets} wallets. Losing ones are paused automatically.</li></ul><p>${cfg.mode === 'live' ? '<b>You are in live mode: these are real trades.</b> Try it in paper mode first.' : 'You are in paper mode, so nothing real is spent.'}</p>` }))) { e.target.checked = false; return; }
    const scanner = { ...cfg.scanner, findTraders: v, tradeCoins: v, ...(v ? { trackSignals: true, traderEveryHours: Math.min(cfg.scanner.traderEveryHours, 1) } : {}) };
    const res = await act(() => api('PUT', '/api/config', { ...cfg, scanner }), v ? 'Hunting for opportunities' : 'Stopped hunting');
    if (res) { S.config = res.config; renderChrome(); renderScanner(el); } else e.target.checked = !v;
  };
  const tb = $('#sc-test'); if (tb) tb.onclick = async () => { const j = await act(() => api('POST', '/api/jobs/scannertest', { days: Number($('#sc-days').value) })); if (j) { upsertJob(j); renderScanner(el); } };
  el.querySelectorAll('[data-use-test]').forEach((b) => (b.onclick = async () => {
    const [entry, exitId] = b.dataset.useTest.split('|');
    const row = x.test.rows.find((r) => r.entry === entry && r.exitId === exitId);
    if (!(await confirmModal({ title: 'Use these scanner settings?', confirm: 'Use them', body: `<p><b>${esc(row.entryName)}</b> with <b>${esc(row.name)}</b>${row.exits.maxHoldHours ? `, sell after ${row.exits.maxHoldHours} h` : ''}.</p><p class="muted">On the past ${x.test.days} day${x.test.days > 1 ? 's' : ''} this made ${signed(row.stats.totalSol, 3)} SOL over ${row.stats.signals} trades. Past results don't guarantee future ones; watch the live track record after switching.</p>` }))) return;
    const r = await act(() => api('POST', '/api/scanner/use-test', { entry, exitId }), 'Scanner settings updated');
    if (r) { S.config = r.config; renderScanner(el); }
  }));
  $('#sc-traders').onchange = (e) => toggle(e, 'findTraders', 'Finding traders is on', 'Finding traders is off');
  $('#sc-coins').onchange = (e) => toggle(e, 'tradeCoins', 'Coin trading is on', 'Coin trading is off');
}

function proofCardHtml(x) {
  const p = x.proof, t = x.test, sc = S.config.scanner;
  const job = S.jobs.find((j) => j.kind === 'scannertest' && (j.status === 'queued' || j.status === 'running'));
  const failed = S.jobs.find((j) => j.kind === 'scannertest' && j.status === 'error' && (!t || j.createdAt > t.at));
  const line = (st) => st.signals ? `<b class="${cls(st.totalSol)}">${signed(st.totalSol, 3)} SOL</b> · ${Math.round((st.wins / st.signals) * 100)}% won · avg ${pct(st.avgPnlPct)} per trade · ${st.signals} trade${st.signals === 1 ? '' : 's'}` : '<span class="muted">no finished signals yet</span>';
  const live = !p || !p.tracked
    ? `<div class="muted" style="font-size:13px">No signals yet. ${sc.trackSignals ? 'While the bot runs, every coin the scanner flags is written down and checked an hour or more later against the real price: what would its exits have made?' : 'Turn on <b>Track every signal</b> in Scanner settings to build a track record.'}</div>`
    : `<div class="stack" style="gap:6px;font-size:13.5px">
        <div><span class="muted">All signals:</span> ${line(p.all)}</div>
        ${p.bought.signals ? `<div><span class="muted">Ones it bought:</span> ${line(p.bought)}</div>` : ''}
        ${p.curve?.length > 1 ? lineChart([[p.curve[0][0] - 1, 0], ...p.curve], { base: 0, h: 130, unit: 'SOL', label: 'Signals profit so far', fmt: (v) => `${v >= 0 ? '+' : '−'}${Math.abs(v).toFixed(3)}` }) : ''}
        <div class="muted" style="font-size:12.5px">New coins: ${p.newCoins.signals ? `${signed(p.newCoins.totalSol, 3)} SOL over ${p.newCoins.signals}` : '–'} · Older coins: ${p.oldCoins.signals ? `${signed(p.oldCoins.totalSol, 3)} SOL over ${p.oldCoins.signals}` : '–'} · ${p.tracked} tracked since ${dateTime(p.since)}${p.waiting ? `, ${p.waiting} still playing out` : ''}. As if you'd put ${sol(sc.buySol, 3)} SOL in each, with 3% for fees and slippage.</div>
      </div>
      ${p.recent.length ? `<div class="tbl-wrap" style="margin-top:10px"><table><thead><tr><th>Signal</th><th>When</th><th>Bought?</th><th class="r">Result</th><th>How it ended</th></tr></thead><tbody>${p.recent.map((r) => `<tr><td><a href="#" data-mint="${esc(r.mint)}"><b>${esc(r.symbol || short(r.mint))}</b></a> <span class="chip">${r.kind === 'old' ? 'older' : 'new'}</span></td><td class="muted">${ago(r.at)} ago</td><td>${r.bought ? '<span class="pos">bought</span>' : `<span class="muted" title="${esc(r.skipped || '')}">no${r.skipped ? ': ' + esc(r.skipped.length > 40 ? r.skipped.slice(0, 40) + '…' : r.skipped) : ''}</span>`}</td><td class="r num ${r.outcome ? cls(r.outcome.pnlPct) : ''}">${r.outcome ? pct(r.outcome.pnlPct) : '–'}</td><td class="muted">${r.outcome ? `${esc(r.outcome.reason)}${r.outcome.done ? '' : ' (so far)'} · peak ${pct(r.outcome.peakPct)}` : Date.now() - r.at < 3600000 ? 'checked after 1 hour' : 'checking…'}</td></tr>`).join('')}</tbody></table></div>` : ''}`;
  const verdicts = {
    few: ['warn', 'Too few signals in this period to judge. Try 3 days, or check again later.'],
    'all-lose': ['danger', 'Every combination lost money on this period. The market may not suit momentum trading right now: keep Trade coins off, or in paper mode.'],
    'current-loses': ['warn', 'Your current scanner settings lost money on this period, but another combination made money (below). Past results can be luck: try it in paper mode first.'],
    works: ['info', 'Your current settings made money on this period, and another combination did even better (below).'],
    'current-best': ['info', 'Your current settings did best on this period.'],
  };
  const testHtml = !t ? '' : `
    <div class="banner ${verdicts[t.verdict][0]}" style="margin:10px 0"><div><b>${t.days}-day test on ${t.coins} coins:</b> ${verdicts[t.verdict][1]}</div></div>
    <div class="tbl-wrap"><table><thead><tr><th>Buying rules</th><th>Exits</th><th class="r">Trades</th><th class="r">Won</th><th class="r">Avg</th><th class="r">Profit (SOL)</th><th></th></tr></thead><tbody>
      ${t.rows.slice(0, 8).map((r, i) => { const cur = r.entry === sc.rules && JSON.stringify(r.exits) === JSON.stringify({ stopLossPct: sc.stopLossPct, takeProfitPct: sc.takeProfitPct, trailingAfterPct: sc.trailingAfterPct, trailingStopPct: sc.trailingStopPct, maxHoldHours: sc.maxHoldHours }); return `<tr><td>${i === 0 && r.stats.totalSol > 0 ? '🏆 ' : ''}${esc(r.entryName)}</td><td>${esc(r.name)}</td><td class="r num">${r.stats.signals}</td><td class="r num">${r.stats.signals ? Math.round((r.stats.wins / r.stats.signals) * 100) + '%' : '–'}</td><td class="r num ${cls(r.stats.avgPnlPct)}">${pct(r.stats.avgPnlPct)}</td><td class="r num ${cls(r.stats.totalSol)}">${signed(r.stats.totalSol, 3)}</td><td class="r">${cur ? '<span class="chip done">in use</span>' : r.stats.signals && r.stats.totalSol > 0 ? `<button class="btn sm" data-use-test="${r.entry}|${r.exitId}">Use</button>` : ''}</td></tr>`; }).join('')}
    </tbody></table></div>
    <div class="muted" style="font-size:12px;margin-top:8px">Tested ${ago(t.at)} ago, ${sol(sc.buySol, 3)} SOL per trade, with 3% for fees and slippage. <b>An approximation:</b> past buyer/seller counts aren't available, so only the price and volume rules are replayed, and only on coins that are popular now (which flatters the results). The live track record above is the real test.</div>`;
  return `<div class="card"><div class="card-h"><div><h2>Is the scanner working?</h2><div class="muted" style="font-size:12.5px">Real results of its signals, and a quick test on recent history.</div></div></div>
    <div class="card-b stack">
      <div><div style="font-weight:600;margin-bottom:6px">Live track record</div>${live}</div>
      <div style="border-top:1px solid var(--border);padding-top:12px">
        <div class="row" style="justify-content:space-between"><div style="font-weight:600">Test on the past</div>
          <div class="row"><select class="input" id="sc-days" style="width:auto;height:32px"><option value="1">Last 24 hours</option><option value="2">Last 2 days</option><option value="3" selected>Last 3 days</option></select><button class="btn primary sm" id="sc-test" ${job ? 'disabled' : ''}>${job ? esc(job.progress || 'Testing…') : 'Run test'}</button></div></div>
        ${failed ? `<div class="banner danger" style="margin:10px 0 0"><div>${esc(failed.error)}</div></div>` : ''}
        ${testHtml || (job ? '' : '<div class="muted" style="font-size:13px;margin-top:6px">Replays the scanner on the last few days of up to 24 popular coins, with 3 sets of buying rules × 5 exit setups, and shows what each would have made. Takes a minute or two.</div>')}
      </div>
    </div></div>`;
}

const SIZE_PRESETS = [
  { id: 'small', name: 'Small', note: 'for trying it out', v: { 'buy.fixedSol': 0.05, 'buy.minSol': 0.01, 'buy.maxSol': 0.2, 'risk.maxTotalExposureSol': 1, 'risk.dailyLossLimitSol': 0.3, 'scanner.buySol': 0.05, 'scanner.budgetSol': 0.3 } },

];
function sizePresetsHtml() {
  const cur = SIZE_PRESETS.find((p) => Object.entries(p.v).every(([k, v]) => Number(getP(S.config, k)) === v));
  const usd = (n) => (S.chain?.usd ? ` ≈ $${Math.round(n * S.chain.usd).toLocaleString()}` : '');
  return `<div class="field size-field"><div><label class="l">Trade size</label><div class="h">Sets the amount per buy and the limits that go with it (largest buy, max SOL in trades, daily loss limit, the scanner's amounts) in one go. ${cur ? `Now: <b>${cur.name}</b>.` : 'Now: your own mix.'} Bigger trades make fees matter less, and losses bigger too.</div></div>
    <div class="seg" id="size-seg">${SIZE_PRESETS.map((p) => `<button data-size="${p.id}" class="${cur?.id === p.id ? 'on' : ''}" title="${p.v['buy.fixedSol']} SOL per buy${usd(p.v['buy.fixedSol'])}, up to ${p.v['risk.maxTotalExposureSol']} SOL in trades, ${p.note}">${p.name} · ${p.v['buy.fixedSol']} SOL</button>`).join('')}</div></div>`;
}
const getP = (o, p) => p.split('.').reduce((a, k) => a?.[k], o);
const setP = (o, p, v) => { const ks = p.split('.'); const last = ks.pop(); ks.reduce((a, k) => (a[k] ??= {}), o)[last] = v; };

function fieldHtml(f) {
  let v = getP(S.config, f.k);
  if (f.toView) v = f.toView(v);
  const id = 'f-' + f.k.replace(/\./g, '-');
  let ctl;
  if (f.type === 'toggle') ctl = `<label class="switch"><input type="checkbox" id="${id}" data-k="${f.k}" ${v ? 'checked' : ''}><i></i></label>`;
  else if (f.type === 'select') ctl = `<select class="input" id="${id}" data-k="${f.k}">${f.options.map(([val, l]) => `<option value="${val}" ${String(val) === String(v) ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
  else if (f.type === 'text') ctl = `<textarea class="input" id="${id}" data-k="${f.k}" rows="3" maxlength="1000" placeholder="none">${esc(v || '')}</textarea>`;
  else if (f.type === 'list') ctl = `<textarea class="input" id="${id}" data-k="${f.k}" rows="3" placeholder="none">${esc((v || []).join('\n'))}</textarea>`;
  else ctl = `<div class="with-unit"><input type="number" inputmode="decimal" id="${id}" data-k="${f.k}" value="${esc(+Number(v).toFixed(9))}" step="${f.step || 'any'}" min="0"><span>${f.unit}</span></div>`;
  // Amounts in the chain's coin also show their dollar value, so limits read the same on any chain.
  const usd = f.unit === 'SOL' && S.chain?.usd && Number(v) > 0 ? `<div class="h" style="text-align:right;margin-top:2px">≈ $${(Number(v) * S.chain.usd).toLocaleString(undefined, { maximumFractionDigits: Number(v) * S.chain.usd < 10 ? 2 : 0 })}</div>` : '';
  if (usd) ctl = `<div>${ctl}${usd}</div>`;
  const when = f.when ? ` data-when="${f.when[0]}" data-when-v="${f.when[1] ?? 'on'}"` : '';
  const adv = f.adv ? ' data-adv="1"' : '';
  return `<div class="field"${when}${adv}><div><label class="l" for="${id}">${f.label}</label>${f.help ? `<div class="h">${typeof f.help === 'function' ? f.help() : f.help}</div>` : ''}</div>${ctl}</div>`;
}

// Settings are grouped in tabs; a search box finds any setting across all of them.
const SET_TABS = [['basics', 'Basics'], ['buying', 'Buying'], ['selling', 'Selling'], ['safety', 'Safety'], ['automation', 'Automation'], ['connections', 'Connections'], ['app', 'App']];
S.setTab = (() => { try { return localStorage.getItem('copybot.setTab') || 'basics'; } catch { return 'basics'; } })();
S.setQuery = '';
S.advOpen = new Set();
function applySettingsView() {
  const q = S.setQuery.trim().toLowerCase();
  let shown = 0;
  document.querySelectorAll('#settings-cards > .card[data-tab]').forEach((card) => {
    if (!q) {
      card.hidden = card.dataset.tab !== S.setTab;
      const open = S.advOpen.has(card.querySelector('h2')?.textContent);
      let more = 0;
      card.querySelectorAll('.field').forEach((f) => {
        // Settings that only matter when something is on appear when it's turned on.
        const w = f.dataset.when;
        const ctl = w && document.querySelector(`[data-k="${w}"]`);
        const val = !ctl ? null : ctl.type === 'checkbox' ? (ctl.checked ? 'on' : 'off') : ctl.value;
        const applies = val === null || val === f.dataset.whenV;
        // Rarely-changed settings wait behind "Show more".
        if (applies && f.dataset.adv && !open) more++;
        f.hidden = !applies || (!!f.dataset.adv && !open);
      });
      const link = card.querySelector('[data-more]');
      if (link) { link.parentElement.hidden = !more && !open; link.textContent = open ? 'Show fewer settings' : `Show ${more} more setting${more > 1 ? 's' : ''}`; }
      if (!card.hidden) shown++;
      return;
    }
    // Searching: every tab, only the settings that match (a matching card title shows the whole card).
    const titleHit = (card.querySelector('h2')?.textContent || '').toLowerCase().includes(q);
    let hits = 0;
    card.querySelectorAll('.field').forEach((f) => { const hit = titleHit || f.textContent.toLowerCase().includes(q); f.hidden = !hit; if (hit) hits++; });
    const link = card.querySelector('[data-more]'); if (link) link.parentElement.hidden = true;
    card.hidden = !(titleHit || hits || (!card.querySelector('.field') && card.textContent.toLowerCase().includes(q)));
    if (!card.hidden) shown++;
  });
  document.querySelectorAll('#set-tabs button').forEach((b) => b.classList.toggle('on', !q && b.dataset.tab === S.setTab));
  const none = $('#set-none'); if (none) none.hidden = shown > 0;
}

// ----- connection status -----
function netStatusHtml() {
  const st = S.netstatus;
  const dot = { ok: 'var(--green)', slow: 'var(--amber)', limited: 'var(--amber)', down: 'var(--red)', off: 'var(--border-strong)' };
  const word = { ok: 'Working', slow: 'Slow', limited: 'Busy / limiting', down: 'Not working', off: 'Not in use' };
  const rows = st ? st.results.map((r) => `<div class="row" style="align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid var(--border)">
      <span style="width:10px;height:10px;border-radius:50%;background:${dot[r.health]};margin-top:5px;flex:none" aria-hidden="true"></span>
      <div style="flex:1"><div><b>${esc(r.name)}</b> <span class="muted" style="font-size:12.5px">· ${esc(r.what)}</span></div>
        <div style="font-size:13px"><span class="${r.health === 'down' ? 'neg' : r.health === 'ok' ? '' : ''}">${word[r.health]}</span>${r.ms != null ? ` <span class="muted">(${r.ms} ms)</span>` : ''} <span class="muted">· ${esc(r.detail)}</span></div>
        ${r.fix ? `<div style="font-size:13px;margin-top:2px"><b>Fix:</b> ${esc(r.fix)}</div>` : ''}</div></div>`).join('') : '';
  return `<div class="card-h"><div><h2>Connection status</h2><div class="muted" style="font-size:12.5px">Remora depends on several outside services. ${st ? `Checked ${ago(st.at)} ago: <b class="${st.summary.level === 'bad' ? 'neg' : st.summary.level === 'warn' ? '' : 'pos'}">${esc(st.summary.text)}</b>.` : 'Check them all at once.'} Checked again every 15 minutes while the bot runs.</div></div><span class="spacer"></span><button class="btn sm" id="ns-check" ${S.nsBusy ? 'disabled' : ''}>${S.nsBusy ? 'Checking…' : 'Check now'}</button></div>
    ${rows ? `<div class="card-b" style="padding-top:0">${rows}</div>` : ''}`;
}

function bindBackup() {
  const save = $('#bk-save'); if (save) save.onclick = async () => {
    try {
      const r = await fetch('/api/backup', { headers: { 'x-copybot-token': TOKEN || '' } });
      if (!r.ok) throw new Error(`Backup failed (${r.status})`);
      const link = document.createElement('a');
      link.href = URL.createObjectURL(await r.blob());
      link.download = `copybot-backup-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(link); link.click(); document.body.removeChild(link);
      $('#bk-msg').textContent = 'Saved. Keep the file somewhere safe (it has your trade history).';
    } catch (e) { toast(e.message, true); }
  };
  const file = $('#bk-file'); if (file) file.onchange = async () => {
    const f = file.files[0]; file.value = '';
    if (!f) return;
    let b;
    try { b = JSON.parse(await f.text()); } catch { return toast("That file isn't a Remora backup.", true); }
    if (b?.format !== 'copybot-backup') return toast("That file isn't a Remora backup.", true);
    const n = Object.keys(b.files || {}).length;
    if (!(await confirmModal({ title: 'Restore this backup?', danger: true, confirm: 'Restore', body: `<p>From ${b.createdAt ? new Date(b.createdAt).toLocaleString() : 'an unknown date'}${b.appVersion ? ` (Remora v${esc(b.appVersion)})` : ''}: ${n} file${n === 1 ? '' : 's'}.</p><p>It <b>replaces</b> your current settings, wallets and history. A copy of what you have now is kept first, so this can be undone.</p>${S.status.running ? '<p class="neg"><b>Stop the bot first.</b></p>' : ''}` }))) return;
    const r = await act(() => fetch('/api/backup/restore', { method: 'POST', headers: { 'x-copybot-token': TOKEN || '', 'content-type': 'application/json' }, body: JSON.stringify(b) }).then(async (x) => { const j = await x.json(); if (!x.ok) throw new Error(j.error || `Error ${x.status}`); return j; }));
    if (r) await confirmModal({ title: 'Backup restored', confirm: 'OK', body: `<p>${r.files} files restored. <b>Close Remora and open it again</b> to finish.</p><p class="muted">Re-enter your private key and API keys in Settings → Connection if this is a new computer.</p>` });
  };
}

async function saveSettings() {
  const cfg = structuredClone(S.config);

  for (const f of all) {
    const el = document.querySelector(`[data-k="${f.k}"]`);
    let v;
    if (f.type === 'toggle') v = el.checked;
    else if (f.type === 'select') v = f.numeric ? Number(el.value) : el.value;
    else if (f.type === 'text') v = el.value;
    else if (f.type === 'list') v = el.value.split(/[\s,]+/).map((s) => s.trim()).filter(Boolean);
    else {
      v = Number(el.value);
      if (el.value === '' || isNaN(v) || v < 0) return toast(`"${f.label}" needs a positive number`, true);
      if (f.fromView) v = f.fromView(v);
    }
    setP(cfg, f.k, v);
  }
  const r = await act(() => api('PUT', '/api/config', cfg), 'Settings saved');

// ---------------- live updates ----------------
function connectEvents() {
  if (!TOKEN) return showLocked();
  const es = new EventSource('/api/events?token=' + encodeURIComponent(TOKEN));
  es.addEventListener('log', (e) => {
    const l = JSON.parse(e.data);
    S.logs.push(l); if (S.logs.length > 500) S.logs.shift();
    const feed = $('#feed');
    if (feed) { if (S.logs.length === 1) feed.innerHTML = ''; feed.insertAdjacentHTML('afterbegin', feedItem(l)); while (feed.children.length > 150) feed.lastChild.remove(); }
  });
  es.addEventListener('trade', (e) => {
    const t = JSON.parse(e.data);
    S.trades.unshift(t);
    if (S.page === 'trades') render();
  });
  es.addEventListener('status', (e) => {
    S.status = JSON.parse(e.data);
    renderChrome();
    if (S.page === 'dashboard') render();
    if (S.page === 'orders') paintOrderLists();
  });
  es.addEventListener('config', (e) => {
    if (S.page === 'settings' && S.dirty) return;
    S.config = JSON.parse(e.data);
    render();
  });
  es.addEventListener('ui', (e) => {
    S.ui = JSON.parse(e.data); applyMode(S.ui.mode);
    if (!(S.page === 'settings' && S.dirty)) render();
  });
  es.addEventListener('update', (e) => {
    S.app.update = JSON.parse(e.data);
    renderChrome();
    const t = $('#upd-text');
    // Re-render for state changes that add/remove buttons or banners; otherwise just update the text.
    if (['ready', 'rejected', 'installing'].includes(S.app.update.state) || !t) { if (!(S.page === 'settings' && S.dirty)) render(); }
    else t.innerHTML = updateText();
  });
  es.addEventListener('connection', (e) => { S.connection = JSON.parse(e.data); renderChrome(); });
  es.addEventListener('scout', (e) => { S.scout = JSON.parse(e.data); });
  es.addEventListener('remote', (e) => {
    const r = JSON.parse(e.data); S.remote = r; paintRemote();
    if (r.paired) { if (S.pairClose) S.pairClose(); toast(`Paired: ${r.paired}. You can control Remora from it now.`); }
  });
  es.addEventListener('point', (e) => {
    const { mode, p } = JSON.parse(e.data);
    if (!S.series || S.series.mode !== mode) return;
    const pts = S.series.points; if (!pts.length || p[0] > pts[pts.length - 1][0]) pts.push(p);
    const c = $('#pf-chart'); if (c && S.page === 'dashboard') { c.outerHTML = portfolioCard(); bindPortfolio(); }
  });
  es.addEventListener('netstatus', (e) => { S.netstatus = JSON.parse(e.data); paintNetStatus(); if (S.page === 'dashboard') render(); });
  es.addEventListener('learning', (e) => { S.learning = JSON.parse(e.data); if (S.page === 'autopilot' && !S.dirty) render(); });
  es.addEventListener('autotune', (e) => { S.tune = JSON.parse(e.data); if (S.page === 'dashboard' || S.page === 'settings') render(); });
  es.addEventListener('scanner', (e) => { S.scanner = JSON.parse(e.data); renderChrome(); if (S.page === 'scanner' && !S.dirty) render(); });
  es.addEventListener('trades-reset', () => load());
  es.addEventListener('health', (e) => { S.health = JSON.parse(e.data); if (S.page === 'wallets') render(); });
  es.addEventListener('ai', (e) => {
    const d = JSON.parse(e.data);
    if (!S.ai) return;
    const i = S.ai.decisions.findIndex((x) => x.id === d.id);
    if (i >= 0) S.ai.decisions[i] = d; else S.ai.decisions.unshift(d);
    if (S.page === 'autopilot') loadAi();
  });
  es.addEventListener('job', (e) => {
    const j = JSON.parse(e.data);
    upsertJob(j);
    if (j.kind === 'quickstart') quickStartUpdate(j);
    if (S.page === 'research') { if (j.kind === 'scout') render(); else renderJobs(); }
    if (S.page === 'backtest' && (j.kind === 'backtest' || j.kind === 'optimize' || j.kind === 'compare')) render();
    if (S.page === 'wallets' && j.kind === 'health') render();
    if (S.page === 'scanner' && (j.kind === 'scannertest' || j.kind === 'scout') && !S.dirty) render();
    if (S.page === 'autopilot' && j.kind === 'scout') renderAutopilot($('#content'), true);
  });
  es.onerror = () => { $('#run-pill').innerHTML = '<span class="pill"><span class="dot bad"></span>Disconnected</span>'; };
  es.onopen = () => load();
}
async function load() {
  try {
    const d = await api('GET', '/api/state');
    if (d.ui) { S.ui = d.ui; applyMode(d.ui.mode); }
    const firstLoad = !S.loadedOnce; S.loadedOnce = true;
    Object.assign(S, { app: d.app, status: d.status, config: S.dirty ? S.config : d.config, logs: d.logs, trades: d.trades, connection: d.connection, jobs: d.jobs, scout: d.scout, scanner: d.scanner || null, tune: d.tune || null, learning: d.learning || null, chain: d.chain || null, netstatus: d.netstatus || null, strategies: d.strategies || [], health: d.health || null });
    render();
    if (firstLoad && d.ui && !d.ui.setupDone) wizard(0);
  } catch (e) { toast('Could not reach the bot. Is it still running?', true); }
}
const h = location.hash.slice(1);
if (TITLES[h]) S.page = h;
connectEvents();
setInterval(() => { if (S.status?.running) renderChrome(); }, 15000);
</script>
