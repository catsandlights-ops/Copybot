<style>
/* ---------- color tokens: light (default) and dark ----------
   Appearance setting sets <html data-mode="light|dark|system">. "system" follows the computer. */
:root {
  --bg: #f6f5fb; --panel: #ffffff; --panel-2: #f2f0f9; --border: #e7e4f1; --border-strong: #d5d1e4;
  --text: #17142b; --muted: #5f5a78; --faint: #8b86a3;
  --accent: #7c3aed; --accent-hover: #6d28d9; --accent-bg: #f1eaff; --on-accent: #ffffff;
  --green: #0b9a57; --green-bg: #e2f6ec; --red: #dc2645; --red-bg: #fde8ec; --amber: #a86a00; --amber-bg: #fff2d6;
  --r-red: #ff3b5c; --r-orange: #ff8a1f; --r-yellow: #f2b705; --r-green: #12b866; --r-cyan: #0fb2e6; --r-blue: #3d6bff; --r-violet: #8b45ff; --r-pink: #ee3fb8;
  --glow-a: rgba(139, 69, 255, .07); --glow-b: rgba(15, 178, 230, .06);
  --shadow: 0 1px 2px rgba(23, 20, 43, .05), 0 2px 8px rgba(23, 20, 43, .05);
  --radius: 14px;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-mode="light"]) {
    --bg: #0d0a1c; --panel: #161229; --panel-2: #1e1937; --border: #2a2448; --border-strong: #3b3462;
    --text: #f3f1ff; --muted: #aaa4c9; --faint: #7c769e;
    --accent: #a78bfa; --accent-hover: #b9a1fb; --accent-bg: #2a2152; --on-accent: #0d0a1c;
    --green: #34d399; --green-bg: #0f2e24; --red: #fb7185; --red-bg: #3a1424; --amber: #fbbf24; --amber-bg: #33270d;
    --r-yellow: #ffd60a; --r-green: #22e07a; --r-cyan: #22d3ff;
    --glow-a: rgba(139, 69, 255, .16); --glow-b: rgba(34, 211, 255, .09);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-mode="dark"] {
  --bg: #0d0a1c; --panel: #161229; --panel-2: #1e1937; --border: #2a2448; --border-strong: #3b3462;
  --text: #f3f1ff; --muted: #aaa4c9; --faint: #7c769e;
  --accent: #a78bfa; --accent-hover: #b9a1fb; --accent-bg: #2a2152; --on-accent: #0d0a1c;
  --green: #34d399; --green-bg: #0f2e24; --red: #fb7185; --red-bg: #3a1424; --amber: #fbbf24; --amber-bg: #33270d;
  --r-yellow: #ffd60a; --r-green: #22e07a; --r-cyan: #22d3ff;
  --glow-a: rgba(139, 69, 255, .16); --glow-b: rgba(34, 211, 255, .09);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  color-scheme: dark;
}
:root { --rainbow: linear-gradient(90deg, var(--r-red), var(--r-orange), var(--r-yellow), var(--r-green), var(--r-cyan), var(--r-blue), var(--r-violet), var(--r-pink)); }
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.muted { color: var(--muted); }
.pos { color: var(--green); } .neg { color: var(--red); }
.num { font-variant-numeric: tabular-nums; }

/* layout */
.app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
.side { min-width: 0; border-right: 1px solid var(--border); background: var(--panel); padding: 20px 12px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 16px; padding: 0 10px 18px; }
.brand svg { flex: none; }
.nav { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--muted); cursor: pointer; border: 0; background: none; text-align: left; width: 100%; }
.nav:hover { background: var(--panel-2); color: var(--text); }
.nav.on { background: var(--accent-bg); color: var(--accent); font-weight: 560; }
.nav svg { width: 18px; height: 18px; flex: none; }
.nav .count { margin-left: auto; font-size: 12px; background: var(--panel-2); color: var(--muted); border-radius: 999px; padding: 0 7px; }
.side-foot { margin-top: auto; padding: 10px; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--faint); flex: none; }
.dot.ok { background: var(--green); } .dot.bad { background: var(--red); } .dot.warn { background: var(--amber); }

main { min-width: 0; }
.top { display: flex; align-items: center; gap: 12px; padding: 18px 28px; border-bottom: 1px solid var(--border); background: var(--panel); position: sticky; top: 0; z-index: 5; }
.top h1 { font-size: 18px; margin: 0; font-weight: 650; }
.top .spacer { flex: 1; }
.content { padding: 24px 28px 60px; max-width: 1240px; }

/* components */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--panel); cursor: pointer; font-weight: 520; white-space: nowrap; }
.btn:hover { background: var(--panel-2); }
.btn:disabled { opacity: .55; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-hover); }
.btn.go { background: var(--green); border-color: var(--green); color: #fff; }
.btn.stop { background: var(--red); border-color: var(--red); color: #fff; }
.btn.danger { color: var(--red); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 13px; }
.btn.ghost { border-color: transparent; background: none; }
.btn.ghost:hover { background: var(--panel-2); }
.btn svg { width: 15px; height: 15px; }

.pill { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12.5px; font-weight: 560; background: var(--panel-2); color: var(--muted); white-space: nowrap; }
.pill.run { background: var(--green-bg); color: var(--green); }
.pill.paper { background: var(--accent-bg); color: var(--accent); }
.pill.live { background: var(--red-bg); color: var(--red); }
.pill.run .dot { background: var(--green); animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.tag { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 7px; border-radius: 5px; text-transform: uppercase; letter-spacing: .02em; }
.tag.buy { background: var(--green-bg); color: var(--green); }
.tag.sell { background: var(--red-bg); color: var(--red); }
.tag.paper { background: var(--panel-2); color: var(--muted); }
.tag.live { background: var(--amber-bg); color: var(--amber); }

.card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-h { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.card-h h2 { font-size: 14.5px; margin: 0; font-weight: 620; }
.card-h .spacer { flex: 1; }
.card-b { padding: 18px; }
.grid { display: grid; gap: 16px; }
.grid > * { min-width: 0; }
.stats { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); margin-bottom: 16px; }
.stat { padding: 16px 18px; }
.stat .k { color: var(--muted); font-size: 12.5px; }
.stat .v { font-size: 22px; font-weight: 650; margin-top: 4px; letter-spacing: -.01em; }
.stat .s { color: var(--faint); font-size: 12px; margin-top: 2px; }
.bar { height: 4px; background: var(--panel-2); border-radius: 4px; margin-top: 10px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.two { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); align-items: start; }

.banner { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-radius: 10px; margin-bottom: 16px; font-size: 13.5px; border: 1px solid transparent; }
.banner.info { background: var(--accent-bg); color: var(--text); }
.banner.warn { background: var(--amber-bg); }
.banner.danger { background: var(--red-bg); }
.banner b { font-weight: 620; }
.banner .btn { margin-left: auto; }

table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; font-weight: 560; color: var(--muted); padding: 10px 18px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 11px 18px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
.tbl-wrap { overflow-x: auto; }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); }
.empty h3 { color: var(--text); margin: 0 0 6px; font-size: 15px; font-weight: 600; }
.empty .btn { margin-top: 14px; }

.feed { max-height: 560px; overflow-y: auto; }
.feed-item { display: flex; gap: 10px; padding: 9px 18px; border-bottom: 1px solid var(--border); font-size: 13px; }
.feed-item:last-child { border-bottom: 0; }
.feed-item .t { color: var(--faint); font-family: var(--mono); font-size: 11.5px; padding-top: 2px; flex: none; }
.feed-item .dot { margin-top: 6px; }
.feed-item.skip { color: var(--muted); }
.feed-item > span:last-child { min-width: 0; overflow-wrap: anywhere; }
.lv-buy .dot { background: var(--green); } .lv-sell .dot { background: var(--red); } .lv-signal .dot { background: var(--accent); }
.lv-error .dot { background: var(--red); } .lv-warn .dot { background: var(--amber); } .lv-system .dot { background: var(--muted); }
.lv-error { color: var(--red); }
.lv-ai .dot { background: var(--r-violet); }
.ai-hero { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; padding: 20px 22px; }
.ai-hero .orb { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: var(--rainbow); color: #fff; flex: none; }
.ai-hero .orb svg { width: 28px; height: 28px; }
.ai-hero h2 { margin: 0 0 4px; font-size: 18px; }
.ai-list { list-style: none; margin: 0; padding: 0; }
.ai-item { display: grid; grid-template-columns: 74px 1fr auto; gap: 4px 14px; padding: 12px 18px; border-top: 1px solid var(--border); align-items: start; }
.ai-item:first-child { border-top: 0; }
.ai-item .t { color: var(--faint); font-size: 12px; padding-top: 2px; }
.ai-item .what { font-weight: 600; }
.ai-item .why { color: var(--muted); font-size: 13px; margin-top: 2px; grid-column: 2 / 4; }
.ai-item .why li { margin: 2px 0; }
.ai-item .meta { color: var(--faint); font-size: 12px; text-align: right; white-space: nowrap; }
.tag.ai { background: var(--panel-2); color: var(--accent); }
.tag.skip { background: var(--amber-bg); color: var(--amber); }
#ai-settings { scroll-margin-top: 110px; }
.modal .with-unit span { min-width: 86px; text-align: center; }
.modal.wizard { max-width: 620px; width: calc(100% - 32px); padding: 22px 26px; }
.wz-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.wz-dots { display: flex; gap: 6px; }
.wz-dot { width: 26px; height: 6px; border-radius: 6px; background: var(--panel-2); }
.wz-dot.done { background: var(--accent); opacity: .5; }
.wz-dot.on { background: var(--rainbow); }
.wz-body h2 { margin: 10px 0 8px; font-size: 20px; }
.wz-body p { line-height: 1.55; }
.wz-hero svg { width: 64px; height: 64px; }
.wz-nav { margin-top: 18px; }
.wz-choices { display: grid; gap: 10px; }
.wz-choice { display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--panel); color: var(--text); font: inherit; }
button.wz-choice { cursor: pointer; }
button.wz-choice:hover { border-color: var(--accent); }
.wz-choice span { color: var(--muted); font-size: 13px; }
.wz-check { list-style: none; padding: 0; line-height: 2; }
.scout-hero { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; padding: 20px 22px; }
.scout-steps { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.scout-steps span { font-size: 12px; padding: 3px 9px; border-radius: 99px; background: var(--panel-2); color: var(--muted); }
.picks { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; padding: 0 18px 16px; }
.pick { border: 1px solid var(--border); border-radius: 12px; padding: 14px; position: relative; overflow: hidden; }
.pick::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--rainbow); }
.pick .why { color: var(--muted); font-size: 13px; margin: 8px 0 10px; }
.pick .nums { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.pick .nums b { color: var(--text); }
.strat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.strat { display: flex; flex-direction: column; position: relative; overflow: hidden; padding: 18px 20px; }
.strat::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--c); }
.strat.on { box-shadow: 0 0 0 2px var(--c); }
.strat h3 { margin: 0; font-size: 17px; }
.strat .tag-risk { font-size: 11px; font-weight: 650; padding: 2px 8px; border-radius: 99px; background: var(--panel-2); color: var(--muted); }
.strat .tag-risk.Higher { background: var(--red-bg); color: var(--red); }
.strat .tag-risk.Lower { background: var(--green-bg); color: var(--green); }
.strat .tag-risk.Medium { background: var(--amber-bg); color: var(--amber); }
.strat dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; margin: 12px 0 16px; }
.strat dt { color: var(--muted); }
.strat dd { margin: 0; text-align: right; font-weight: 560; }
.strat .acts { margin-top: auto; display: flex; gap: 8px; }
.strat .acts .btn { flex: 1; }
.chg { width: 100%; border-collapse: collapse; font-size: 13px; }
.chg td { padding: 5px 4px; border-top: 1px solid var(--border); }
.chg td:nth-child(2), .chg td:nth-child(3) { text-align: right; white-space: nowrap; }
.bt-curve { padding: 8px 18px 16px; }
.lc { position: relative; margin: 6px 0 0 0; outline: none; }
.lc svg, .bt-curve .lc svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.lc .lc-base { stroke: var(--border); stroke-width: 1; vector-effect: non-scaling-stroke; }
.lc-empty { padding: 30px 0; text-align: center; font-size: 13px; }
.lc-axis { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); margin-top: 4px; }
.lc-y { position: absolute; left: 4px; font-size: 11px; color: var(--muted); background: color-mix(in srgb, var(--panel) 80%, transparent); padding: 0 3px; border-radius: 4px; pointer-events: none; }
.lc-yt { top: 4%; transform: translateY(-50%); } .lc-yb { top: 96%; transform: translateY(-50%); }
.lc-ref { position: absolute; left: 0; right: 0; height: 0; border-top: 1px solid var(--muted); opacity: .75; pointer-events: none; }
.lc-ref.neg { border-color: var(--red); } .lc-ref.pos { border-color: var(--green); } .lc-ref.warn { border-color: var(--amber); }
.lc-ref span { position: absolute; right: 4px; top: -16px; font-size: 11px; color: var(--muted); background: var(--panel); padding: 0 4px; border-radius: 4px; white-space: nowrap; }
.lc-end, .lc-dot, .lc-mark { position: absolute; width: 10px; height: 10px; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 0 2px var(--panel); pointer-events: none; }
.lc-mark { width: 12px; height: 12px; background: var(--accent); pointer-events: auto; cursor: default; }
.lc-mark.sell { background: var(--text); }
.lc-x { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--muted); opacity: .5; pointer-events: none; }
.lc-tip { position: absolute; z-index: 3; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 6px 9px; font-size: 12.5px; box-shadow: 0 6px 18px rgba(0,0,0,.12); pointer-events: none; white-space: nowrap; }
.lc-tip b { font-variant-numeric: tabular-nums; }
.spark { width: 84px; height: 24px; display: inline-block; vertical-align: middle; overflow: visible; }
.live-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--green); margin-left: 4px; vertical-align: middle; animation: livepulse 2s infinite; }
@keyframes livepulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .live-dot { animation: none; } }
.bt-curve svg { width: 100%; height: 220px; display: block; }
.bt-axis { display: flex; justify-content: space-between; color: var(--faint); font-size: 12px; margin-top: 6px; }
.bt-form { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
@media (max-width: 900px) { .bt-form { grid-template-columns: 1fr; } }
.bt-hist { display: flex; gap: 6px; flex-wrap: wrap; }
.tokchips { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 18px 12px; }
.ai-actions { display: flex; gap: 8px; flex-wrap: wrap; }
@media (max-width: 640px) { .ai-item { grid-template-columns: 1fr; } .ai-item .why { grid-column: 1; } .ai-item .meta { text-align: left; } }

/* exit-plan chips */
.plan { white-space: normal; min-width: 170px; max-width: 300px; line-height: 1.9; }
.note.bad { white-space: nowrap; }
.chip { display: inline-block; white-space: nowrap; font-size: 11.5px; padding: 1px 7px; border-radius: 999px; background: var(--panel-2); color: var(--muted); margin: 1px 0; }
.chip.done { background: var(--green-bg); color: var(--green); }
.chip.trail { background: var(--amber-bg); color: var(--amber); }
.input.wallet-num { width: 68px; min-width: 60px; height: 30px; text-align: right; flex: none; padding: 0 8px; }
.wallets-tbl th, .wallets-tbl td { padding-left: 8px; padding-right: 8px; }
.wallets-tbl th:first-child, .wallets-tbl td:first-child { padding-left: 18px; }
.wallets-tbl .note { font-size: 11px; }
.wallet-row .note { white-space: nowrap; }
.wallet-row .label-input { min-width: 104px; }

/* forms */
.field { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 16px; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.field:last-child { border-bottom: 0; }
.field .l { font-weight: 540; }
.field .h { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.size-field { grid-template-columns: 1fr; }
.size-field .seg { justify-self: start; flex-wrap: wrap; }
.size-field .seg button { white-space: nowrap; }
.input { height: 34px; padding: 0 10px; border: 1px solid var(--border-strong); background: var(--panel); border-radius: 8px; width: 100%; min-width: 0; }
textarea.input { height: auto; padding: 8px 10px; resize: vertical; font-family: var(--mono); font-size: 12.5px; }
.input:focus, .btn:focus-visible, .nav:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.with-unit { display: flex; align-items: center; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--panel); overflow: hidden; }
.with-unit:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
.with-unit input { border: 0; height: 32px; padding: 0 10px; background: none; width: 100%; min-width: 0; outline: none; text-align: right; }
.with-unit span { padding: 0 10px; color: var(--muted); font-size: 12.5px; background: var(--panel-2); align-self: stretch; display: flex; align-items: center; border-left: 1px solid var(--border); white-space: nowrap; }
.switch { display: inline-block; position: relative; width: 38px; height: 22px; flex: none; justify-self: end; }
.switch input { opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; position: absolute; z-index: 1; }
.switch i { position: absolute; inset: 0; background: var(--border-strong); border-radius: 999px; transition: .15s; }
.switch i::after { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.switch input:checked + i { background: var(--accent); }
.switch input:checked + i::after { transform: translateX(16px); }
.switch input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display: inline-flex; background: var(--panel-2); border-radius: 9px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; height: 30px; padding: 0 16px; border-radius: 7px; cursor: pointer; color: var(--muted); font-weight: 540; }
.seg button.on { background: var(--panel); color: var(--text); box-shadow: var(--shadow); }
.seg button.on.live { color: var(--red); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.act-row { display: grid; grid-template-columns: 36px 120px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.act-n { text-align: right; font-weight: 600; }
.act-bar { height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; }
.act-bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
@media (max-width: 700px) { .act-row { grid-template-columns: 30px minmax(0, 1fr); } .act-bar { display: none; } .act-row a { grid-column: 2; } }
.set-top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 8px 0; }
.set-tabs { flex-wrap: wrap; }
#set-q { flex: 1; min-width: 200px; }
#set-none { margin-bottom: 16px; }
.card[hidden], .field[hidden], .more-set[hidden], .banner[hidden] { display: none !important; }
.pa-opt { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.pa-opt input { flex: none; margin-top: 3px; }
.more-set { padding: 12px 20px; border-top: 1px solid var(--border); font-size: 13px; }
.savebar { position: sticky; bottom: 16px; display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--text); color: var(--bg); border-radius: 12px; margin-top: 16px; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
.savebar .spacer { flex: 1; }
.savebar .btn:not(.primary) { background: transparent; color: var(--bg); border-color: rgba(127,127,127,.5); }

.wallet-row td:first-child { width: 52px; }
.addr { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.copy { border: 0; background: none; padding: 2px; cursor: pointer; color: var(--faint); border-radius: 4px; display: inline-flex; }
.copy:hover { color: var(--text); background: var(--panel-2); }
.copy svg { width: 13px; height: 13px; }
.label-input { border: 1px solid transparent; background: none; padding: 3px 6px; margin-left: -7px; border-radius: 6px; font-weight: 560; width: 100%; max-width: 220px; }
.label-input:hover { border-color: var(--border); }
.label-input:focus { border-color: var(--accent); outline: none; background: var(--panel); }

.job { border-top: 1px solid var(--border); }
.job:first-child { border-top: 0; }
.job-h { display: flex; align-items: center; gap: 10px; padding: 12px 18px; }
.spinner { width: 14px; height: 14px; border: 2px solid var(--border-strong); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.notes { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.note { font-size: 11.5px; padding: 1px 7px; border-radius: 5px; background: var(--panel-2); color: var(--muted); }
.note.good { background: var(--green-bg); color: var(--green); }
.note.bad { background: var(--amber-bg); color: var(--amber); }
.steps { margin: 0; padding-left: 18px; color: var(--muted); }
.steps li { margin: 4px 0; }
.steps b { color: var(--text); font-weight: 560; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }

/* modal + toast */
.modal-bg { position: fixed; inset: 0; background: rgba(10,12,16,.5); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
.modal { background: var(--panel); border-radius: 14px; max-width: 460px; width: 100%; padding: 22px; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
.modal h3 { margin: 0 0 8px; font-size: 17px; }
.modal p, .modal li { color: var(--muted); }
.modal .row { justify-content: flex-end; margin-top: 18px; }
.toasts { position: fixed; bottom: 18px; right: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 60; }
.toast { background: var(--text); color: var(--bg); padding: 10px 14px; border-radius: 10px; max-width: 360px; box-shadow: 0 8px 24px rgba(0,0,0,.2); font-size: 13.5px; animation: up .2s ease-out; }
.toast.err { background: var(--red); color: #fff; }
@keyframes up { from { transform: translateY(8px); opacity: 0; } }

td.r { white-space: nowrap; }
@media (max-width: 1640px) {
  .two { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  .side { position: static; height: auto; flex-direction: row; overflow-x: auto; padding: 8px 12px; border-right: 0; border-bottom: 1px solid var(--border); gap: 2px; }
  .brand { padding: 0 8px 0 0; } .brand span { display: none; }
  .nav { width: auto; white-space: nowrap; } .nav .count, .side-foot { display: none; }
  .top { padding: 12px 16px; position: static; flex-wrap: wrap; }
  .content { padding: 16px 16px 60px; }
  .field { grid-template-columns: 1fr; gap: 8px; }
  .switch { justify-self: start; }
  th, td { padding: 9px 12px; }
}

/* =====================================================================
   RAINBOW LAYER: the modern base above, plus Remora's personality:
   rainbow edge lines and title, color-coded menu and panels, pixel leaf
   logo, hearts and coins. Works in light and dark.
   ===================================================================== */
@font-face { font-family: "Press Start 2P"; src: url("/fonts/press-start-2p.woff2") format("woff2"); font-display: swap; }
body { background-image: radial-gradient(circle at 0% 0%, var(--glow-a), transparent 40%), radial-gradient(circle at 100% 100%, var(--glow-b), transparent 45%); background-attachment: fixed; }
.ico { display: inline-block; width: 18px; height: 18px; vertical-align: -3px; margin-right: 8px; }
svg.ico, .ico svg, .hearts svg, .deco svg { shape-rendering: crispEdges; }

/* sidebar + top bar: thin rainbow edges */
.side { position: sticky; }
.side::after { content: ""; position: absolute; top: 0; right: -1px; bottom: 0; width: 3px; background: linear-gradient(180deg, var(--r-red), var(--r-orange), var(--r-yellow), var(--r-green), var(--r-cyan), var(--r-blue), var(--r-violet), var(--r-pink)); opacity: .9; }
.top { box-shadow: none; }
.top::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; background: var(--rainbow); opacity: .9; }
.top h1 { font-size: 22px; font-weight: 760; letter-spacing: -.02em; background: var(--rainbow); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* logo: pixel leaf + rainbow pixel wordmark */
.brand { gap: 10px; padding: 2px 10px 20px; }
.brand > svg:not(.ico) { display: none; }
.brand .ico { width: 26px; height: 26px; margin: 0; }
.brand .word { font-family: "Press Start 2P", var(--mono); font-size: 12px; letter-spacing: 1px; text-transform: uppercase; font-weight: 400; }
.brand .c1 { color: var(--r-red); } .brand .c2 { color: var(--r-orange); } .brand .c3 { color: var(--r-yellow); } .brand .c4 { color: var(--r-green); }
.brand .c5 { color: var(--r-cyan); } .brand .c6 { color: var(--r-blue); } .brand .c7 { color: var(--r-violet); }

/* menu: each item has its own rainbow color */
.nav { --c: var(--accent); font-weight: 520; color: var(--muted); }
.nav:nth-of-type(1) { --c: var(--r-red); } .nav:nth-of-type(2) { --c: var(--r-orange); } .nav:nth-of-type(3) { --c: var(--r-yellow); }
.nav:nth-of-type(4) { --c: var(--r-green); } .nav:nth-of-type(5) { --c: var(--r-cyan); } .nav:nth-of-type(6) { --c: var(--r-blue); }
.nav:nth-of-type(7) { --c: var(--r-violet); } .nav:nth-of-type(8) { --c: var(--r-pink); }
.nav svg { color: var(--c); padding: 5px; width: 28px; height: 28px; border-radius: 8px; background: color-mix(in srgb, var(--c) 14%, transparent); }
.nav:hover { background: var(--panel-2); color: var(--text); }
.nav.on { background: color-mix(in srgb, var(--c) 13%, transparent); color: var(--text); font-weight: 620; box-shadow: inset 3px 0 0 var(--c); }
.nav.on svg { background: var(--c); color: #fff; }

/* panels: a colored marker per panel, cycling through the rainbow */
.card-h h2 { display: flex; align-items: center; gap: 9px; }
.card-h h2::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--c, var(--accent)); flex: none; }
:is(.grid, .stack) > .card:nth-child(8n+1) { --c: var(--r-red); } :is(.grid, .stack) > .card:nth-child(8n+2) { --c: var(--r-orange); }
:is(.grid, .stack) > .card:nth-child(8n+3) { --c: var(--r-yellow); } :is(.grid, .stack) > .card:nth-child(8n+4) { --c: var(--r-green); }
:is(.grid, .stack) > .card:nth-child(8n+5) { --c: var(--r-cyan); } :is(.grid, .stack) > .card:nth-child(8n+6) { --c: var(--r-blue); }
:is(.grid, .stack) > .card:nth-child(8n+7) { --c: var(--r-violet); } :is(.grid, .stack) > .card:nth-child(8n+8) { --c: var(--r-pink); }
.content > .card { --c: var(--r-violet); }

/* stat cards: colored top edge, icons, bigger numbers */
.stat { position: relative; overflow: hidden; padding: 18px 20px; }
.stat::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--c); }
.stat .k { display: flex; align-items: center; font-weight: 560; }
.stat .v { font-size: 26px; font-weight: 760; }
.hearts { display: flex; gap: 3px; margin-top: 8px; flex-wrap: wrap; }
.hearts svg { width: 18px; height: 16px; }
.bar { height: 8px; border-radius: 99px; margin-top: 10px; }
.bar i { background: var(--rainbow); background-size: 300px 100%; border-radius: 99px; }

/* buttons */
.btn { border-radius: 10px; font-weight: 600; transition: transform .06s, filter .15s, background .15s; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn.primary { background: linear-gradient(135deg, var(--r-violet), var(--r-pink)); border-color: transparent; color: #fff; }
.btn.primary:hover { filter: brightness(1.08); background: linear-gradient(135deg, var(--r-violet), var(--r-pink)); }
.btn.go { background: var(--r-green); border-color: transparent; color: #fff; }
.btn.stop { background: var(--r-red); border-color: transparent; color: #fff; }
.btn.go:hover, .btn.stop:hover { filter: brightness(1.08); }

/* banners: colored edge */
.banner { border-left: 4px solid var(--c, var(--accent)); border-radius: 12px; background: var(--panel); box-shadow: var(--shadow); }
.banner.info { --c: var(--r-cyan); background: var(--panel); } .banner.warn { --c: var(--r-yellow); background: var(--panel); } .banner.danger { --c: var(--r-red); background: color-mix(in srgb, var(--r-red) 8%, var(--panel)); }

/* tables, chips */
th { text-transform: uppercase; font-size: 11px; letter-spacing: .05em; }
tr:hover td { background: color-mix(in srgb, var(--accent) 4%, transparent); }

/* empty states: pixel rainbow + PRESS START */
.deco { display: block; margin: 0 auto 14px; width: 80px; }
.deco svg { width: 80px; height: auto; display: block; margin: 0 auto; animation: hop 1.8s steps(4) infinite; }
@keyframes hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.press { display: block; font-family: "Press Start 2P", var(--mono); font-size: 11px; letter-spacing: 1px; margin-top: 16px; text-transform: uppercase; background: var(--rainbow); -webkit-background-clip: text; background-clip: text; color: transparent; animation: blink 1.2s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* markets */
.mk-top { display: grid; grid-template-columns: repeat(3, minmax(140px, 1fr)) minmax(280px, 2fr); gap: 16px; margin-bottom: 16px; }
.coin { padding: 14px 18px; display: flex; flex-direction: column; gap: 2px; }
.coin b { font-size: 20px; }
.mk-search { display: flex; gap: 8px; align-items: center; padding: 14px; }
.mk-main { grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr); align-items: start; }
.two-eq { grid-template-columns: minmax(0, 1.6fr) minmax(260px, 1fr); align-items: start; }
.clickrow { cursor: pointer; }
.tok { display: flex; align-items: center; gap: 10px; }
.small { font-size: 12px; }
.tthumb { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; flex: none; vertical-align: middle; margin-right: 8px; background: var(--panel-2); }
.tok .tthumb { margin-right: 0; }
.tthumb.ph { display: inline-flex; align-items: center; justify-content: center; font-weight: 700; color: var(--muted); }
.tthumb.lg { width: 52px; height: 52px; font-size: 20px; margin-right: 0; }
.bs { height: 8px; min-width: 80px; border-radius: 99px; background: color-mix(in srgb, var(--red) 55%, transparent); overflow: hidden; }
.bs i { display: block; height: 100%; background: var(--green); }
.bs.big { height: 12px; margin: 6px 0 4px; }
.news { max-height: 720px; overflow-y: auto; }
.news-item { display: flex; flex-direction: column; gap: 3px; padding: 12px 18px; border-bottom: 1px solid var(--border); color: var(--text); text-decoration: none; }
.news-item:hover { background: var(--panel-2); text-decoration: none; }
.news-item .nt { font-weight: 560; line-height: 1.35; }
.src { align-self: flex-start; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--r-violet); }
.src-coindesk { color: var(--r-blue); } .src-theblock { color: var(--r-pink); } .src-decrypt { color: var(--r-green); } .src-blockworks { color: var(--r-orange); }
.tok-h { padding: 20px 22px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; }
.verdict { flex-basis: 100%; padding: 10px 14px; border-radius: 10px; font-weight: 560; }
.verdict.yes { background: var(--green-bg); color: var(--green); } .verdict.no { background: var(--amber-bg); color: var(--amber); }
.chart { width: 100%; height: auto; display: block; }
.chart .gl { stroke: var(--border); stroke-dasharray: 3 4; }
.chart .ax { fill: var(--faint); font-size: 11px; }
.chart .cu { stroke: var(--green); fill: var(--green); } .chart .cd { stroke: var(--red); fill: var(--red); }
@media (max-width: 1500px) { .mk-main { grid-template-columns: 1fr; } .news { max-height: 420px; } }
@media (max-width: 1100px) { .mk-top { grid-template-columns: repeat(3, 1fr); } .mk-search { grid-column: 1 / -1; } .two-eq { grid-template-columns: 1fr; } }
@media (max-width: 760px) { .mk-top { grid-template-columns: 1fr 1fr; } .card-h { flex-wrap: wrap; } }

/* learn page */
.learn-hero { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 22px 24px; margin-bottom: 16px; background: linear-gradient(135deg, color-mix(in srgb, var(--r-violet) 10%, var(--panel)), color-mix(in srgb, var(--r-cyan) 8%, var(--panel))); }
.learn-hero h2 { margin: 0 0 4px; font-size: 20px; }
.learn-hero p { margin: 0; }
.learn-hero svg { width: 96px; height: auto; flex: none; shape-rendering: crispEdges; }
.chips-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.fchip { --c: var(--accent); border: 1px solid var(--border-strong); background: var(--panel); color: var(--text); border-radius: 999px; height: 32px; padding: 0 14px; cursor: pointer; font-weight: 560; display: inline-flex; align-items: center; gap: 7px; }
.fchip::before { content: ""; width: 8px; height: 8px; border-radius: 3px; background: var(--c); }
.fchip.on { background: color-mix(in srgb, var(--c) 14%, var(--panel)); border-color: var(--c); }
.guide-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.guide-card { --c: var(--accent); text-align: left; display: flex; flex-direction: column; gap: 6px; padding: 18px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--panel); box-shadow: var(--shadow); cursor: pointer; color: var(--text); position: relative; overflow: hidden; transition: transform .12s, box-shadow .12s; }
.guide-card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--c); }
.guide-card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(23, 20, 43, .1); }
.guide-card b { font-size: 15.5px; line-height: 1.3; }
.guide-card .muted { font-size: 13px; }
.gtag { align-self: flex-start; font-size: 11.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .04em; color: var(--c); }
.gmeta { margin-top: auto; padding-top: 6px; font-size: 12.5px; color: var(--c); font-weight: 600; }
.article { max-width: 760px; overflow: hidden; }
.article-h { padding: 26px 30px 18px; border-bottom: 1px solid var(--border); background: linear-gradient(180deg, color-mix(in srgb, var(--c) 9%, var(--panel)), var(--panel)); }
.article-h h2 { margin: 6px 0 4px; font-size: 24px; letter-spacing: -.01em; }
.article-b { padding: 8px 30px 26px; font-size: 15px; line-height: 1.65; }
.article-b h3 { font-size: 16.5px; margin: 22px 0 6px; }
.article-b ul, .article-b ol { padding-left: 22px; }
.article-b li { margin: 6px 0; }
.article-b ol.big li::marker { font-weight: 700; color: var(--c); }
.article-b code { font-family: var(--mono); font-size: 13px; background: var(--panel-2); padding: 1px 5px; border-radius: 5px; }
.article-b .tip { background: color-mix(in srgb, var(--c) 9%, var(--panel)); border-left: 4px solid var(--c); padding: 12px 14px; border-radius: 10px; }
.article-b .gloss { display: grid; grid-template-columns: 150px 1fr; gap: 10px 18px; }
.article-b .gloss dt { font-weight: 650; } .article-b .gloss dd { margin: 0; color: var(--muted); }
.more-h { margin: 24px 0 12px; font-size: 15px; }
@media (max-width: 760px) { .article-h, .article-b { padding-left: 18px; padding-right: 18px; } .article-b .gloss { grid-template-columns: 1fr; gap: 2px; } .article-b .gloss dd { margin-bottom: 8px; } .learn-hero svg { display: none; } }

/* appearance switch in the top bar */
.mode-btn { width: 34px; padding: 0; }
.mode-btn svg { width: 16px; height: 16px; }

@media (max-width: 760px) {
  .side { position: relative; }
  .side::after { top: auto; left: 0; right: 0; bottom: 0; width: auto; height: 3px; background: var(--rainbow); }
  .top { position: relative; }
  .brand .word { display: none; }
  .nav svg { width: 24px; height: 24px; padding: 4px; }
}
@media (prefers-reduced-motion: reduce) { .deco svg, .press, .pill.run .dot { animation: none !important; } }
</style>

<script src="/guides.js"></script>
<script>
// ---------------- state ----------------
const S = { ui: { mode: 'system' }, app: { version: null, update: { state: 'disabled' } }, page: 'dashboard', status: null, config: null, logs: [], trades: [], connection: null, jobs: [], dirty: false, tradeFilter: 'all', busy: false, connTest: null };
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const short = (a) => (a ? esc(`${String(a).slice(0, 4)}…${String(a).slice(-4)}`) : '');
const sol = (n, d = 4) => (n == null || isNaN(n) ? '—' : `${Number(n).toFixed(d)}`);
const signed = (n, d = 4) => {
  if (n == null || isNaN(n)) return '—';
  // Tiny amounts get more decimals instead of rounding to a meaningless "−0.000".
  const a = Math.abs(n);
  let dd = d;
  while (dd < 6 && a > 0 && Number(a.toFixed(dd)) === 0) dd++;
  const txt = a.toFixed(dd);
  return Number(txt) === 0 ? txt : `${n >= 0 ? '+' : '−'}${txt}`;
};
const cls = (n) => (n > 0 ? 'pos' : n < 0 ? 'neg' : '');
const pct = (n) => (n == null || isNaN(n) ? '—' : `${n >= 0 ? '+' : '−'}${Math.abs(n).toFixed(1)}%`);
const time = (t) => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
const dateTime = (t) => new Date(t).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
function ago(t) {
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 60) return `${Math.floor(s)}s`;
  if (s < 3600) return `${Math.floor(s / 60)}m`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ${Math.floor((s % 3600) / 60)}m`;
  return `${Math.floor(s / 86400)}d`;
}
const ICON_COPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
// ---------------- pixel icons (retro theme) ----------------
const PX = { K: '#07031a', R: '#e0413f', W: '#fff6dc', Y: '#f4c64e', O: '#b8801c', G: '#b4afcc', B: '#7fd8ff', E: '#5fae4e', L: '#a8e07a', C: '#f7e9c4', D: '#3f7a3a' };
function pixelSvg(rows, cls = 'ico') {
  let r = '';
  rows.forEach((row, y) => [...row].forEach((c, x) => { if (PX[c]) r += `<rect x="${x}" y="${y}" width="1" height="1" fill="${PX[c]}"/>`; }));
  return `<svg class="${cls}" viewBox="0 0 ${rows[0].length} ${rows.length}" aria-hidden="true">${r}</svg>`;
}
const HEART = ['.KK...KK.', 'KRWK.KRRK', 'KRRRKRRRK', 'KRRRRRRRK', '.KRRRRRK.', '..KRRRK..', '...KRK...', '....K....'];
const ICON = {
  heart: pixelSvg(HEART, ''),
  heartEmpty: pixelSvg(HEART.map((r) => r.replace(/[RW]/g, 'G')), ''),
  coin: pixelSvg(['..KKKK..', '.KYYYYK.', 'KYWYYOYK', 'KYWYYOYK', 'KYWYYOYK', 'KYYYYOYK', '.KYYOOK.', '..KKKK..']),
  star: pixelSvg(['....K....', '...KYK...', 'KKKKYKKKK', 'KYYYYYYYK', '.KYYWYYK.', '..KYYYK..', '.KYYKYYK.', '.KYK.KYK.', '.KK...KK.']),
  key: pixelSvg(['.KKK.......', 'KYYYK......', 'KYKYKKKKKKK', 'KYKYYYYYYYK', 'KYYYKKKYKYK', '.KKK...K.K.']),
  leaf: pixelSvg(['......KK', '....KKLK', '...KLEEK', '..KLEEDK', '.KLEDEK.', '.KEDEEK.', 'KEDKKK..', 'KK......']),
  mushroom: pixelSvg(['...KKKKK...', '..KRRWRRK..', '.KRWWRRRWK.', 'KRRRRRRWWRK', 'KRWRRRRRRRK', 'KKKKKKKKKKK', '...KCCCK...', '...KCCCK...', '...KCCCK...', '...KKKKK...'], ''),
};
function hearts(used, max) {
  const n = Math.min(max, 10);
  return `<div class="hearts" title="${used} of ${max} position slots used">${Array.from({ length: n }, (_, i) => (i < used ? ICON.heart : ICON.heartEmpty)).join('')}</div>`;
}
ICON.rainbow = (() => {
  const P = { K: '#07031a', R: '#ff2e55', O: '#ff8a14', Y: '#ffe014', G: '#1fe06a', C: '#12d2ff', B: '#3d6bff', V: '#a347ff', W: '#ffffff' };
  const rows = ['.....KKKKKK.....', '...KKRRRRRRKK...', '..KRROOOOOORRK..', '.KROOYYYYYYOORK.', '.KROYYGGGGYYORK.', 'KROYGGCCCCGGYORK', 'KROYGCBBBBCGYORK', 'KROYGCBVVBCGYORK', 'KROYGCBKKBCGYORK', 'KKKKKKK..KKKKKKK'];
  let r = '';
  rows.forEach((row, y) => [...row].forEach((c, x) => { if (P[c]) r += `<rect x="${x}" y="${y}" width="1" height="1" fill="${P[c]}"/>`; }));
  return `<svg viewBox="0 0 16 10" aria-hidden="true">${r}</svg>`;
})();
// Logo: pixel leaf + one block color per letter (styles only apply in the arcade theme).
(() => {
  const brand = document.querySelector('.brand'), word = brand.querySelector('span');
  word.className = 'word';
  word.innerHTML = [...word.textContent].map((ch, i) => `<span class="c${i + 1}">${esc(ch)}</span>`).join('');
  brand.insertAdjacentHTML('afterbegin', ICON.leaf);
})();
// Appearance: 'system' follows the computer's light/dark setting.
function applyMode(m) { document.documentElement.dataset.mode = ['light', 'dark'].includes(m) ? m : 'system'; }
const isDark = () => S.ui.mode === 'dark' || (S.ui.mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
async function setAppearance(mode) {
  S.ui = { ...S.ui, mode }; applyMode(mode); render();
  await act(() => api('PUT', '/api/ui', { mode }));
}

// ---------------- first-run setup ----------------
const WZ_STEPS = ['Welcome', 'Connection', 'Wallets', 'Running all day', 'Ready'];
function wizard(step = 0) {
  S.wz = step;
  const c = S.connection, mine = S.config.wallets.length;
  const dots = WZ_STEPS.map((l, i) => `<span class="wz-dot ${i === step ? 'on' : i < step ? 'done' : ''}" title="${l}"></span>`).join('');
  const body = [
    `<div class="wz-hero">${ICON.rainbow}</div><h2>Welcome to Remora</h2>
     <p>Remora follows wallets you choose, on <b>Solana</b> and <b>Base</b>, and copies their trades within seconds, with safety checks and limits you control.</p>
     <p class="muted">It starts in <b>paper mode</b>: every trade is simulated with real prices and nothing is spent. Setup takes about 3 minutes.</p>`,
    `<h2>Connect a fast RPC</h2>
     <p>The RPC is Remora's connection to Solana. The free public one is rate-limited and <b>misses trades</b>.</p>
     <ol class="steps"><li>Create a free account at <a href="https://www.helius.dev" target="_blank" rel="noopener">helius.dev</a>.</li><li>Copy your RPC link (<span class="mono">https://mainnet.helius-rpc.com/?api-key=…</span>) and paste it here.</li></ol>
     <input class="input mono" id="wz-rpc" placeholder="https://mainnet.helius-rpc.com/?api-key=…" value="${c.usingPublicRpc ? '' : esc(c.rpcUrl)}" spellcheck="false" style="width:100%">
     <div class="row" style="margin-top:10px"><button class="btn" id="wz-test">Save &amp; test</button><span class="muted" id="wz-rpc-msg" style="font-size:13px">${c.usingPublicRpc ? '' : '<span class="pos">✓ A private RPC is set.</span>'}</span></div>
     <details style="margin-top:14px" ${c.baseRpcUrl ? 'open' : ''}><summary style="cursor:pointer"><b>Base too?</b> <span class="muted">(optional)</span></summary>
       <p class="muted" style="margin:8px 0">Copying Base wallets works without this, but finding and checking Base wallets needs a free <b>Alchemy</b> link: sign up at <a href="https://www.alchemy.com" target="_blank" rel="noopener">alchemy.com</a>, create an app on <b>Base Mainnet</b>, and paste its HTTPS link.</p>
       <input class="input mono" id="wz-base" placeholder="https://base-mainnet.g.alchemy.com/v2/…" value="${esc(c.baseRpcUrl || '')}" spellcheck="false" style="width:100%">
       <div class="row" style="margin-top:8px"><button class="btn sm" id="wz-base-save">Save</button><span class="muted" id="wz-base-msg" style="font-size:13px">${c.baseRpcUrl ? '<span class="pos">✓ A Base link is set.</span>' : ''}</span></div></details>`,
    `<h2>Pick wallets to copy</h2>
     <p>Remora is only as good as the wallets it copies.${mine ? ` <b>You already copy ${mine}.</b>` : ''} New wallets start small (a trial size) and grow as they prove themselves.</p>
     <div class="wz-choices">
       <button class="wz-choice" id="wz-scout"><b>Find wallets for me</b><span>Scans tokens that pumped recently, checks who bought early and picks the best (5–15 min, runs in the background).${c.baseRpcUrl ? ' Searches Solana; Base is searched too, every other time.' : ''}</span></button>
       <div class="wz-choice"><b>I have a wallet address</b><span>Paste one or more, one per line. Solana addresses, or Base addresses starting with 0x.</span><textarea class="input mono" id="wz-addrs" rows="2" placeholder="Wallet address"></textarea><button class="btn sm" id="wz-add" style="margin-top:6px">Add</button></div>
     </div><div class="muted" id="wz-w-msg" style="font-size:13px;margin-top:8px"></div>`,
    `<h2>Running all day</h2>
     <p>Remora works best left on. It keeps the computer awake while the bot runs.</p>
     <label class="row" style="gap:10px;align-items:flex-start;justify-content:flex-start;text-align:left;margin:10px 0"><label class="switch"><input type="checkbox" id="wz-resume" ${S.ui.resumeBot !== false ? 'checked' : ''}><i></i></label><span><b>Start the bot again after a crash, restart or power cut</b><br><span class="muted" style="font-size:13px">Not after you stop it yourself.</span></span></label>
     ${S.app.desktop === false ? '' : `<label class="row" style="gap:10px;align-items:flex-start;justify-content:flex-start;text-align:left;margin:10px 0"><label class="switch"><input type="checkbox" id="wz-login" ${S.ui.startWithWindows ? 'checked' : ''}><i></i></label><span><b>Start Remora with Windows</b><br><span class="muted" style="font-size:13px">Opens minimized when you log in.</span></span></label>`}
     <p class="muted">Want to check on it from your phone? <b>Settings → Phone access</b> pairs your phone in a minute (works away from home with the free Tailscale app). A backup is saved every day automatically.</p>`,
    `<div class="wz-hero">${ICON.star}</div><h2>You're ready</h2>
     <ul class="wz-check"><li>${c.usingPublicRpc ? '⚠️ Still on the public RPC (you can add Helius later in Settings)' : '✅ Private RPC connected'}</li><li>${S.config.wallets.length ? `✅ Copying ${S.config.wallets.length} wallet${S.config.wallets.length > 1 ? 's' : ''}` : scoutJob() ? '⏳ The wallet scout is searching. Picks appear on Find wallets.' : '💡 No wallets yet: <b>Start a paper experiment</b> and Remora picks a few active traders for you'}</li><li>✅ Paper mode: nothing is spent</li></ul>
     <p class="muted">Everything starts in <b>paper mode</b> (no money). Give it a week or more. When the results are good, choose <b>Live</b> in Settings → Trading mode: a step-by-step assistant checks your results and wallet, makes a tiny test trade and starts you small.</p>
     <p class="muted">Optional: on the <b>Autopilot</b> page an AI can make the judgment calls, either Claude (paid) or a free AI running on your own PC. Read <a href="#" data-guide="getting-started" id="wz-guide">Getting started</a> for the rest.</p>`,
  ][step];
  $('#modal-root').innerHTML = `<div class="modal-bg"><div class="modal wizard" role="dialog" aria-modal="true" aria-label="Setup">
    <div class="wz-top"><div class="wz-dots">${dots}</div><button class="btn sm ghost" id="wz-skip">Skip setup</button></div>
    <div class="wz-body">${body}</div>
    <div class="row wz-nav">${step ? '<button class="btn" id="wz-back">Back</button>' : ''}<span class="spacer" style="flex:1"></span>
      ${step < WZ_STEPS.length - 1 ? `<button class="btn primary" id="wz-next">${step === 0 ? 'Let\'s go' : 'Next'}</button>` : `<button class="btn primary" id="wz-start">${S.config.wallets.some((w) => w.enabled !== false) ? 'Start in paper mode' : 'Start a paper experiment'}</button><button class="btn" id="wz-done">Finish</button>`}</div></div></div>`;
  const finish = async () => { $('#modal-root').innerHTML = ''; S.ui = { ...S.ui, setupDone: true }; await act(() => api('PUT', '/api/ui', { setupDone: true })); };
  $('#wz-skip').onclick = finish;
  const nx = $('#wz-next'); if (nx) nx.onclick = () => wizard(step + 1);
  const bk = $('#wz-back'); if (bk) bk.onclick = () => wizard(step - 1);
  const dn = $('#wz-done'); if (dn) dn.onclick = finish;
  const gd = $('#wz-guide'); if (gd) gd.addEventListener('click', finish);
  const st = $('#wz-start'); if (st) st.onclick = async () => {
    await finish(); go('dashboard');
    if (!S.config.wallets.some((w) => w.enabled !== false)) return quickStart();
    await act(() => api('POST', '/api/start'), 'Bot started in paper mode');
  };
  const t = $('#wz-test');
  if (t) t.onclick = async () => {
    const url = $('#wz-rpc').value.trim();
    if (!url) return toast('Paste your RPC link first', true);
    $('#wz-rpc-msg').innerHTML = '<span class="spinner" style="display:inline-block;vertical-align:middle"></span> Saving…';
    const r = await act(() => api('PUT', '/api/connection', { rpcUrl: url }));
    if (!r) return ($('#wz-rpc-msg').innerHTML = '');
    S.connection = r;
    const test = await act(() => api('POST', '/api/connection/test'));
    $('#wz-rpc-msg').innerHTML = test?.ok ? `<span class="pos">✓ Connected (${test.rpcMs} ms)</span>` : `<span class="neg">✕ ${esc(test?.error || 'Could not connect')}</span>`;
  };
  const sc = $('#wz-scout');
  if (sc) sc.onclick = async () => { const j = await act(() => api('POST', '/api/jobs/scout')); if (j) { upsertJob(j); $('#wz-w-msg').innerHTML = '<span class="pos">✓ The scout is searching in the background.</span>'; } };
  const ad = $('#wz-add');
  if (ad) ad.onclick = async () => {
    const addrs = $('#wz-addrs').value.split(/[\s,]+/).map((s) => s.trim()).filter(Boolean).filter((a) => !S.config.wallets.some((w) => w.address === a));
    if (!addrs.length) return toast('Paste a wallet address first', true);
    const r = await saveWallets([...S.config.wallets, ...addrs.map((address, i) => ({ address, label: `trader-${S.config.wallets.length + i + 1}`, enabled: true }))], `Added ${addrs.length} wallet${addrs.length > 1 ? 's' : ''}`);
    if (r) wizard(2);
  };
  const bs = $('#wz-base-save');
  if (bs) bs.onclick = async () => {
    const r = await act(() => api('PUT', '/api/connection', { baseRpcUrl: $('#wz-base').value.trim() }));
    if (r) { S.connection = r; $('#wz-base-msg').innerHTML = r.baseRpcUrl ? '<span class="pos">✓ Saved.</span>' : 'Cleared.'; }
  };
  const wr = $('#wz-resume');
  if (wr) wr.onchange = async () => { const r = await act(() => api('PUT', '/api/ui', { resumeBot: wr.checked })); if (r) S.ui = r; };
  const wl = $('#wz-login');
  if (wl) wl.onchange = async () => { const r = await act(() => api('PUT', '/api/ui', { startWithWindows: wl.checked })); if (r) S.ui = r; };
}

// ---------------- go-live assistant: a guided switch from paper to live ----------------
const GL_STEPS = ['Paper results', 'Safety', 'Trading wallets', 'Test trade', 'Start small'];
const GL = { plan: null, roles: {}, baseLive: false, starter: true, tests: {}, testing: null };
async function goLive(step = 0) {
  if (step === 0 || !GL.plan) {
    $('#modal-root').innerHTML = '<div class="modal-bg"><div class="modal wizard" role="dialog" aria-modal="true" aria-label="Go live"><div class="wz-body"><h2>Going live</h2><p class="muted"><span class="spinner" style="display:inline-block;vertical-align:middle"></span> Checking your paper results and trading wallets…</p></div></div></div>';
    const p = await act(() => api('GET', '/api/golive'));
    if (!p) { $('#modal-root').innerHTML = ''; return; }
    GL.plan = p; GL.roles = { ...p.roles }; GL.tests = {};
    GL.baseLive = p.wallets.base.hasKey && (p.wallets.base.liveOn || p.wallets.base.used);
    GL.starter = true;
  }
  const p = GL.plan, w = p.wallets;
  const dots = GL_STEPS.map((l, i) => `<span class="wz-dot ${i === step ? 'on' : i < step ? 'done' : ''}" title="${l}"></span>`).join('');
  const tag = { ready: ['buy', 'Proven'], risky: ['paper', 'Risky'], no: ['sell', 'Losing'], 'not-yet': ['paper', 'Needs more data'] };
  const sol = (x, d = 3) => x == null || !Number.isFinite(x) ? '—' : `${x >= 0 ? '+' : ''}${x.toFixed(d)} SOL`;
  const walletRows = S.config.wallets.filter((x) => GL.roles[x.address] !== undefined && (x.enabled !== false || x.shadow)).map((x) => {
    const src = p.sources.find((s) => s.source === x.address);
    const t = tag[src?.verdict] || tag['not-yet'];
    return `<tr><td><b>${esc(x.label)}</b>${chainOfW(x) === 'base' ? ' <span class="chip">Base</span>' : ''}<div class="muted" style="font-size:12px">${src ? `${src.closed} closed · ${src.days} days` : 'no paper trades'}</div></td>
      <td class="r num ${src && src.pnlSol >= 0 ? 'pos' : 'neg'}">${src ? sol(src.pnlSol) : '—'}</td><td><span class="tag ${t[0]}">${t[1]}</span></td>
      <td class="r"><select class="input" data-role="${esc(x.address)}" style="width:auto;height:30px">${[['live', 'Copy for real'], ['shadow', 'Shadow (no money)'], ['off', 'Off']].map(([v, l]) => `<option value="${v}" ${GL.roles[x.address] === v ? 'selected' : ''}>${l}</option>`).join('')}</select></td></tr>`;
  }).join('');
  const nLive = Object.values(GL.roles).filter((r) => r === 'live').length;
  const keyRow = (name, k, extra = '') => `<div class="row" style="gap:8px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--border)"><span class="${k.hasKey ? 'pos' : 'neg'}" style="font-weight:700;width:14px">${k.hasKey ? '✓' : '✕'}</span><div style="flex:1"><b>${name}</b> ${k.hasKey ? `<span class="mono muted" style="font-size:12.5px">${esc(short(k.address || ''))}</span> · balance <b>${k.balance == null ? '—' : k.balance.toFixed(name === 'Base' ? 5 : 4)} ${name === 'Base' ? 'ETH' : 'SOL'}</b>${k.balanceSol != null && name === 'Base' ? ` <span class="muted">(≈ ${k.balanceSol.toFixed(3)} SOL)</span>` : ''}` : `<span class="muted">no trading key saved${k.keyError ? ` (${esc(k.keyError)})` : ''}</span>`}${extra}</div></div>`;
  const testBox = (c, label) => {
    const r = GL.tests[c];
    const res = !r ? '' : r.ok ? `<span class="pos">✓ Worked in ${r.seconds}s, cost ${Number.isFinite(r.costNative) ? `${r.costNative.toFixed(6)} ${c === 'base' ? 'ETH' : 'SOL'}` : 'a few cents'}.${esc(r.note || '')}</span>` : `<span class="neg">✕ Failed at the ${esc(r.step)} step: ${esc(r.error)}</span>`;
    return `<div class="row" style="gap:10px;padding:6px 0"><button class="btn" data-gltest="${c}" ${GL.testing ? 'disabled' : ''}>${GL.testing === c ? '<span class="spinner" style="display:inline-block;vertical-align:middle"></span> Testing…' : label}</button><span style="font-size:13px">${res}</span></div>`;
  };
  const st = p.starter, cur = p.current;
  const cmp = (l, a, b, u = '') => `<tr><td>${l}</td><td class="r num muted">${a}${u}</td><td class="r num"><b>${b}${u}</b></td></tr>`;
  const body = [
    `<h2>Your paper results</h2>
     <div class="banner ${p.overall.level === 'ready' ? 'info' : 'warn'}" style="margin:0 0 10px"><div><b>${esc(p.overall.text)}</b></div></div>
     ${walletRows ? `<p class="muted" style="margin-top:0">Wallets that made money in paper are set to copy for real. The rest keep being copied in <b>shadow</b> (virtually, no money) and come over by themselves once they prove themselves.</p>

// The app opens this page as /?t=<session token>. Keep the token for this tab only and
// remove it from the address bar.
let TOKEN = null;
try {
  const u = new URL(location.href);
  TOKEN = u.searchParams.get('t');
  if (TOKEN) { sessionStorage.setItem('copybot-token', TOKEN); history.replaceState(null, '', u.pathname + u.hash); }
  else TOKEN = sessionStorage.getItem('copybot-token');
} catch { /* storage blocked: token stays in memory only */ }

function showLocked() {
  document.body.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px">
    <div class="card" style="max-width:440px;padding:28px;text-align:center"><h2 style="margin:0 0 8px;font-size:18px">Session expired</h2>
    <p class="muted" style="margin:0">For security, Remora only accepts the window it opened itself. Close this tab and start Remora again${location.port === '4777' ? ', or use the link shown in the Remora terminal window' : ''}.</p></div></div>`;
}

async function api(method, path, data) {
  const r = await fetch(path, { method, headers: { 'content-type': 'application/json', 'x-copybot-token': TOKEN || '' }, body: data ? JSON.stringify(data) : undefined });
  if (r.status === 401) { showLocked(); throw new Error('Session expired'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `Request failed (${r.status})`);
  return j;
}
function toast(msg, err = false) {
  const el = document.createElement('div');
  el.className = 'toast' + (err ? ' err' : '');
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), err ? 6000 : 3000);
}
async function act(fn, ok) {
  try { const r = await fn(); if (ok) toast(ok); return r; } catch (e) { toast(e.message, true); }
}
function confirmModal({ title, body, confirm = 'Confirm', danger = false }) {
  return new Promise((resolve) => {
    $('#modal-root').innerHTML = `<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true"><h3>${title}</h3><div>${body}</div>
      <div class="row"><button class="btn" data-a="no">Cancel</button><button class="btn ${danger ? 'stop' : 'primary'}" data-a="yes">${confirm}</button></div></div></div>`;
    const done = (v) => { $('#modal-root').innerHTML = ''; resolve(v); };
    $('#modal-root [data-a=yes]').onclick = () => done(true);
    $('#modal-root [data-a=no]').onclick = () => done(false);
    $('#modal-root .modal-bg').onclick = (e) => { if (e.target.classList.contains('modal-bg')) done(false); };
    $('#modal-root [data-a=yes]').focus();
  });
}

function paperAmount() {
  const cur = S.config.paper.startSol, usd = S.chain?.usd;
  const open = (S.status.positions || []).reduce((a, p) => a + p.costSol, 0);
  const presets = [1, 5, 10, 25, 100];

    <div style="display:flex;gap:10px;align-items:center"><div class="with-unit" style="width:200px"><input type="number" id="pa-sol" value="${cur}" min="0.1" step="any"><span>SOL</span></div><span class="muted" id="pa-usd"></span></div>

      <label class="pa-opt"><input type="radio" name="pa-mode" value="keep" checked><span><b>Keep my paper results</b><br><span class="muted" style="font-size:12.5px">Profit, open positions and trades stay; only the starting amount changes.</span></span></label>
      <label class="pa-opt"><input type="radio" name="pa-mode" value="fresh"><span><b>Start fresh with this amount</b><br><span class="muted" style="font-size:12.5px">Paper positions and trades are cleared (a copy is kept in the data folder).</span></span></label>
    </div>
    <div class="banner warn" id="pa-warn" hidden style="margin:0 0 12px"><div></div></div>
    <div class="row"><span class="spacer" style="flex:1"></span><button class="btn" id="pa-cancel">Cancel</button><button class="btn primary" id="pa-save">Save</button></div>
  </div></div>`;
  const input = $('#pa-sol');
  const refresh = () => {
    const v = Number(input.value);
    $('#pa-usd').textContent = usd && v > 0 ? `≈ $${Math.round(v * usd).toLocaleString()}` : '';
    document.querySelectorAll('#pa-presets button').forEach((b) => b.classList.toggle('on', Number(b.dataset.v) === v));
    const keep = document.querySelector('input[name="pa-mode"]:checked').value === 'keep';
    const w = $('#pa-warn');
    w.hidden = !(keep && v > 0 && v < open);
    w.firstElementChild.textContent = `You have ${open.toFixed(3)} SOL in open paper positions, more than ${v} SOL: new paper buys will wait until enough is sold. Or choose "Start fresh".`;
  };
  document.querySelectorAll('#pa-presets button').forEach((b) => (b.onclick = () => { input.value = b.dataset.v; refresh(); }));
  input.oninput = refresh;
  document.querySelectorAll('input[name="pa-mode"]').forEach((r) => (r.onchange = refresh));
  refresh();
  const close = () => ($('#modal-root').innerHTML = '');

  $('#modal-root .modal-bg').onclick = (e) => { if (e.target.classList.contains('modal-bg')) close(); };
  $('#pa-save').onclick = async () => {
    const sol = Number(input.value);
    if (!(sol >= 0.1)) return toast('Enter at least 0.1 SOL', true);
    const fresh = document.querySelector('input[name="pa-mode"]:checked').value === 'fresh';
    const r = await act(() => api('POST', '/api/paper/amount', { sol, fresh }), fresh ? `Fresh paper experiment with ${sol} SOL` : `Paper wallet amount: ${sol} SOL`);
    if (r) { close(); S.config = r.config; load(); }
  };
}

function banners() {
  const out = [];
  const c = S.connection, cfg = S.config;
  const g = S.status?.guard;
  if (g?.blocked) out.push(`<div class="banner danger"><div><b>New buys are paused.</b> ${esc(g.blocked)} Sells, stop-losses and take-profits keep running.</div><button class="btn sm" onclick="resumeBuying()">Resume buying</button></div>`);
  if (cfg.mode === 'paper') out.push(`<div class="banner info"><div><b>Paper trading.</b> The bot simulates every trade with real prices but never spends money. Run it like this for a few days before going live.</div></div>`);
  else if (!c.hasPrivateKey) out.push(`<div class="banner danger"><div><b>Live mode needs a trading wallet.</b> Add one in Settings → Connections.</div><button class="btn sm" onclick="openSettings('#wallet-card')">Open settings</button></div>`);
  const m = S.status?.mood;
  if (m && S.status.running && (m.level === 'bad' || m.level === 'cautious')) out.push(`<div class="banner ${m.level === 'bad' ? 'danger' : 'warn'}"><div><b>Market mood: ${m.level === 'bad' ? 'bad, so no new buys from signals' : 'cautious, so buying at half size'}.</b> ${esc(m.why)}. Sells, exits and your own orders keep running. Turn this off in Settings → Limits.</div></div>`);
  const ns = S.netstatus;
  if (ns && ns.summary.level === 'bad' && Date.now() - ns.at < 30 * 60_000) out.push(`<div class="banner danger"><div><b>Connection problem:</b> ${esc(ns.summary.text)}. Some trades may be missed.</div><button class="btn sm" onclick="openSettings('#netstatus-card')">See details</button></div>`);
  const t = S.tune;
  if (t && t.status === 'better' && !t.dismissed) out.push(`<div class="banner info"><div><b>Weekly settings check: better exit settings found.</b> ${esc(t.message)} Past results can be luck; you can always switch back in Settings.</div><button class="btn sm primary" onclick="applyTune()">Use these</button><button class="btn sm" onclick="dismissTune()">Dismiss</button></div>`);
  if (c.usingPublicRpc) {
    // The free public node refuses requests quickly: the more wallets, the more trades it misses.
    const nSol = S.config.wallets.filter((w) => w.enabled !== false && !/^0x/i.test(w.address)).length;
    out.push(nSol > 2
      ? `<div class="banner danger"><div><b>You copy ${nSol} wallets on the free public Solana node.</b> It refuses requests when asked too often ("429 Too Many Requests"), so wallets are checked less often and trades will be missed. A free Helius key (2 minutes to set up) fixes this.</div><button class="btn sm" onclick="openSettings('#conn')">Add RPC</button></div>`
      : `<div class="banner warn"><div><b>You're on the free public RPC.</b> It's rate-limited and will miss trades. Add a free Helius key for reliable copying.</div><button class="btn sm" onclick="openSettings('#conn')">Add RPC</button></div>`);
  }
  return out.join('');
}

// ---------------- live charts ----------------
// One line chart (with a hover crosshair and tooltip) and a tiny sparkline, used everywhere.
// Lines are drawn in a stretched SVG; dots, labels and the tooltip are HTML on top, so they stay round and crisp.
const CH = {}; let chSeq = 0;
function lineChart(pts, o = {}) {
  // Only the chosen time range: a point from before it starts the line at the left edge (never outside the chart).
  if (pts && o.from != null) {
    const before = pts.filter((p) => p[0] < o.from).pop();
    pts = [...(before ? [[o.from, before[1]]] : []), ...pts.filter((p) => p[0] >= o.from)];
  }
  if (pts && o.to != null) pts = pts.filter((p) => p[0] <= o.to);
  if (!pts || pts.length < 2) return `<div class="lc-empty muted">${o.empty || 'Collecting data… the line appears after a minute or two.'}</div>`;
  const id = 'lc' + ++chSeq, H = o.h || 180;
  const t0 = o.from ?? pts[0][0], t1 = Math.max(o.to ?? pts[pts.length - 1][0], t0 + 1);
  const base = o.base === 'first' ? pts[0][1] : o.base ?? null;
  const refs = (o.refs || []).filter((r) => Number.isFinite(r.v));
  const vals = pts.map((p) => p[1]).concat(refs.map((r) => r.v), base != null ? [base] : []);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi - lo < 1e-12) { const d = Math.abs(hi) * 0.01 || 0.01; lo -= d; hi += d; }
  const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
  const X = (t) => ((t - t0) / (t1 - t0)) * 100, Y = (v) => (1 - (v - lo) / (hi - lo)) * 100;
  const last = pts[pts.length - 1];
  const up = base == null ? true : last[1] >= base;
  const col = base == null ? 'var(--accent)' : up ? 'var(--green)' : 'var(--red)';
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${X(p[0]).toFixed(2)},${Y(p[1]).toFixed(2)}`).join('');
  const floor = base != null ? Y(base) : 100;
  const fmt = o.fmt || ((v) => v.toFixed(3));
  const tfmt = o.tfmt || ((t) => (t1 - t0 > 86400000 ? dateTime(t) : time(t).slice(0, 5)));
  CH[id] = { pts, t0, t1, lo, hi, fmt, tfmt, base, unit: o.unit || '', marks: o.marks || [] };
  const refHtml = refs.map((r) => `<div class="lc-ref ${r.tone || ''}" style="top:${Y(r.v).toFixed(2)}%"><span>${esc(r.label)}</span></div>`).join('');
  const markHtml = (o.marks || []).filter((m) => m.t >= t0 && m.t <= t1).map((m) => {
    const near = pts.reduce((a, p) => (Math.abs(p[0] - m.t) < Math.abs(a[0] - m.t) ? p : a), pts[0]);
    return `<i class="lc-mark ${m.kind}" style="left:${X(m.t).toFixed(2)}%;top:${Y(m.v ?? near[1]).toFixed(2)}%" title="${esc(m.label)}"></i>`;
  }).join('');
  return `<div class="lc" id="${id}" style="height:${H}px" tabindex="0" role="img" aria-label="${esc(o.label || 'Chart')}: ${esc(fmt(pts[0][1]))} to ${esc(fmt(last[1]))}">
    <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      ${base != null ? `<line x1="0" x2="100" y1="${floor.toFixed(2)}" y2="${floor.toFixed(2)}" class="lc-base"/>` : ''}
      <path d="${d}L${X(last[0]).toFixed(2)},${floor.toFixed(2)}L${X(pts[0][0]).toFixed(2)},${floor.toFixed(2)}Z" fill="${col}" opacity=".1"/>
      <path d="${d}" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>
    </svg>
    ${refHtml}${markHtml}
    <i class="lc-end" style="left:${X(last[0]).toFixed(2)}%;top:${Y(last[1]).toFixed(2)}%;background:${col}"></i>
    <span class="lc-y lc-yt">${esc(fmt(hi - pad))}</span><span class="lc-y lc-yb">${esc(fmt(lo + pad))}</span>
    <i class="lc-x" hidden></i><i class="lc-dot" hidden style="background:${col}"></i><div class="lc-tip" hidden></div>
  </div>
  <div class="lc-axis"><span>${esc(tfmt(t0))}</span><span>${esc(tfmt(t1))}</span></div>`;
}
function spark(pts, base, title = '') {
  if (!pts || pts.length < 2) return '<span class="spark muted">–</span>';
  const t0 = pts[0][0], t1 = Math.max(pts[pts.length - 1][0], t0 + 1);
  const vs = pts.map((p) => p[1]).concat(base != null ? [base] : []);
  let lo = Math.min(...vs), hi = Math.max(...vs); if (hi - lo < 1e-12) { hi += 1; lo -= 1; }
  const last = pts[pts.length - 1][1], b = base ?? pts[0][1];
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${(((p[0] - t0) / (t1 - t0)) * 100).toFixed(1)},${((1 - (p[1] - lo) / (hi - lo)) * 92 + 4).toFixed(1)}`).join('');
  const by = ((1 - (b - lo) / (hi - lo)) * 92 + 4).toFixed(1);
  return `<svg class="spark" viewBox="0 0 100 100" preserveAspectRatio="none" role="img" aria-label="${esc(title)}"><title>${esc(title)}</title><line x1="0" x2="100" y1="${by}" y2="${by}" class="lc-base"/><path d="${d}" fill="none" stroke="${last >= b ? 'var(--green)' : 'var(--red)'}" stroke-width="1.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}
// Hover: the crosshair snaps to the nearest point in time; the tooltip shows its value.
function chartHover(e) {
  const el = e.target.closest?.('.lc');
  document.querySelectorAll('.lc.hov').forEach((x) => { if (x !== el) { x.classList.remove('hov'); x.querySelectorAll('.lc-x,.lc-dot,.lc-tip').forEach((n) => (n.hidden = true)); } });
  if (!el || !CH[el.id]) return;
  const c = CH[el.id], r = el.getBoundingClientRect();
  const t = c.t0 + Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * (c.t1 - c.t0);
  let p = c.pts[0];
  for (const q of c.pts) if (Math.abs(q[0] - t) < Math.abs(p[0] - t)) p = q;
  const x = ((p[0] - c.t0) / (c.t1 - c.t0)) * 100, y = (1 - (p[1] - c.lo) / (c.hi - c.lo)) * 100;
  const [xl, dot, tip] = ['.lc-x', '.lc-dot', '.lc-tip'].map((s) => el.querySelector(s));
  el.classList.add('hov');
  xl.hidden = dot.hidden = tip.hidden = false;
  xl.style.left = dot.style.left = x + '%'; dot.style.top = y + '%';
  const mark = c.marks.find((m) => Math.abs(m.t - p[0]) <= (c.t1 - c.t0) / 60);
  tip.textContent = '';
  const v = document.createElement('b'); v.textContent = c.fmt(p[1]) + (c.unit ? ' ' + c.unit : ''); tip.appendChild(v);

async function openPositionChart(mint) {
  let stop = false;
  const draw = async () => {
    if (stop) return;
    let d;
    try { d = await api('GET', '/api/position-chart?mint=' + encodeURIComponent(mint)); } catch (e) { if (!$('#pc-body')) return; $('#pc-body').innerHTML = `<div class="muted">${esc(e.message)}</div>`; return; }
    const box = $('#pc-body'); if (!box) return;
    const x = d.exits, pts = d.trail.map(([t, m]) => [t, (m - 1) * 100]);
    const refs = [{ v: -x.stopLossPct, label: `stop-loss −${x.stopLossPct}%`, tone: 'neg' }];
    if (x.recoverCostAtPct > 0 && !d.steps.includes('recover')) refs.push({ v: x.recoverCostAtPct, label: `take back cost +${x.recoverCostAtPct}%`, tone: 'pos' });
    if (x.tp1AtPct > 0 && !d.steps.includes('tp1')) refs.push({ v: x.tp1AtPct, label: `take-profit 1 +${x.tp1AtPct}%`, tone: 'pos' });
    if (x.takeProfitPct > 0) refs.push({ v: x.takeProfitPct, label: `sell all +${x.takeProfitPct}%`, tone: 'pos' });
    const peakGain = (d.peakMultiple - 1) * 100;
    if (x.trailingStopPct > 0 && peakGain >= x.trailingAfterPct) refs.push({ v: (d.peakMultiple * (1 - x.trailingStopPct / 100) - 1) * 100, label: 'trailing stop', tone: 'warn' });
    const lockAt = x.lockAtPct ?? 20, lockFloor = x.lockFloorPct ?? 5;
    if (lockAt > 0 && peakGain >= lockAt) refs.push({ v: lockFloor, label: `profit lock +${lockFloor}%`, tone: 'pos' });
    // Keep far-off targets from squashing the line: show the ones within reach of what the price has done.
    const span = Math.max(30, ...pts.map((p) => Math.abs(p[1]))) * 2.2;
    const shown = refs.filter((r) => Math.abs(r.v) <= span);
    const marks = d.trades.map((t) => ({ t: t.t, kind: t.side, label: t.side === 'buy' ? `Bought ${sol(t.sol, 3)} SOL` : `Sold for ${sol(t.sol, 3)} SOL${t.pnl != null ? ` (${signed(t.pnl, 3)})` : ''}${t.reason ? ': ' + t.reason : ''}` }));
    const lastPct = pts.length ? pts[pts.length - 1][1] : null;
    box.innerHTML = `<div class="row" style="justify-content:space-between;margin-bottom:6px"><span class="muted" style="font-size:12.5px">Cost ${sol(d.costSol, 3)} SOL · held ${ago(d.openedAt)} · updates every ${S.config.monitor.exitCheckIntervalSec} s</span>${lastPct != null ? `<b class="num ${cls(lastPct)}">${pct(lastPct)}</b>` : ''}</div>
      ${lineChart(pts, { base: 0, h: 240, from: Math.min(d.openedAt, pts[0]?.[0] ?? d.openedAt), to: Date.now(), label: 'Gain or loss', fmt: (v) => `${v >= 0 ? '+' : '−'}${Math.abs(v).toFixed(1)}%`, refs: shown, marks, empty: 'Collecting data… the line appears after the next price check.' })}
      <div class="muted" style="font-size:12px;margin-top:8px">The line is this position's gain or loss since you bought (0% = break-even). Coloured lines are its exits${refs.length > shown.length ? '; targets far above are left off so the line stays readable' : ''}. Dots mark your buys and sells.</div>`;
  };
  $('#modal-root').innerHTML = `<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true" style="max-width:760px"><div class="row" style="justify-content:space-between"><h3 style="margin:0">${short(mint)} <span class="live-dot"></span></h3><button class="btn sm" data-a="close">Close</button></div><div id="pc-body" style="margin-top:12px"><div class="muted">Loading…</div></div></div></div>`;
  const timer = setInterval(draw, Math.max(10, S.config.monitor.exitCheckIntervalSec) * 1000);
  const close = () => { stop = true; clearInterval(timer); $('#modal-root').innerHTML = ''; };
  $('#modal-root [data-a=close]').onclick = close;
  $('#modal-root .modal-bg').onclick = (e) => { if (e.target.classList.contains('modal-bg')) close(); };
  draw();
}

/** What the staged exits have done for a position, and what happens next. */
function exitPlan(p) {
  if (p.sources?.length === 1 && p.sources[0] === 'scanner') {
    const sc = S.config.scanner, chips = [`<span class="chip">stop −${sc.stopLossPct}%</span>`];
    if (sc.takeProfitPct > 0) chips.push(`<span class="chip">sell all +${sc.takeProfitPct}%</span>`);
    const peakGain = ((p.peakMultiple || 1) - 1) * 100;
    if (sc.trailingStopPct > 0) chips.push(peakGain >= sc.trailingAfterPct
      ? `<span class="chip trail">trailing: sells below ${pct(((p.peakMultiple || 1) * (1 - sc.trailingStopPct / 100) - 1) * 100)}</span>`
      : `<span class="chip">trailing ${sc.trailingStopPct}% after +${sc.trailingAfterPct}%</span>`);
    if (sc.maxHoldHours > 0) chips.push(`<span class="chip" title="The scanner sells what's left after this long">sells in ${ago(Date.now() - (p.openedAt + sc.maxHoldHours * 3600000 - Date.now()))}</span>`);
    return chips.join(' ');
  }
  const ww = S.config.wallets.find((w) => w.address === p.sources?.[0]);
  const st = (S.strategies || []).find((x) => x.id === ww?.strategy);
  const { stopLossPct, ...ov } = ww?.exits || {};
  const x = { ...S.config.exits, ...(st?.patch.exits || {}), ...ov }, done = new Set(p.steps || []);
  const chips = [];
  const step = (id, on, label) => { if (on) chips.push(`<span class="chip ${done.has(id) ? 'done' : ''}">${done.has(id) ? '✓ ' : ''}${label}</span>`); };
  step('recover', x.recoverCostAtPct > 0, `cost back +${x.recoverCostAtPct}%`);
  step('tp1', x.tp1AtPct > 0, `TP1 +${x.tp1AtPct}%`);
  step('tp2', x.tp2AtPct > 0, `TP2 +${x.tp2AtPct}%`);
  const peakGain = ((p.peakMultiple || 1) - 1) * 100;
  const lockAt = x.lockAtPct ?? 20, lockFloor = x.lockFloorPct ?? 5;
  if (lockAt > 0 && peakGain >= lockAt) chips.push(`<span class="chip done" title="Rule #1: it has been up +${peakGain.toFixed(0)}%, so it won't be allowed to end as a loss.">🔒 profit locked: sells below +${lockFloor}%</span>`);
  if (x.trailingStopPct > 0 && peakGain >= x.trailingAfterPct) {
    const w = p.trailPct ?? x.trailingStopPct;
    const floor = ((p.peakMultiple || 1) * (1 - w / 100) - 1) * 100;
    chips.push(`<span class="chip trail" title="Peak +${peakGain.toFixed(0)}%. Sells everything if it falls to ${pct(floor)}.">trailing: sells below ${pct(floor)}</span>`);
  }
  if (st) chips.push(`<span class="chip" title="This wallet uses its own strategy (Wallets page)">${esc(st.name)}</span>`);
  else if (Object.keys(ov).length || stopLossPct !== undefined) chips.push('<span class="chip" title="This wallet has its own exit settings (Wallets page)">wallet\'s own exits</span>');
  return chips.join(' ') || '<span class="muted">stop-loss only</span>';
}

function walletStats() {
  const mode = S.config.mode, weekAgo = Date.now() - 7 * 86400_000;
  const out = {}, lastBuy = {};
  const get = (a) => (out[a] ??= { buys: 0, sells: 0, wins: 0, pnl: 0, week: 0, gaps: [], lags: [], curve: [] });
  for (const t of [...S.trades].reverse()) { // oldest first
    if (t.mode !== mode) continue;
    if (t.side === 'buy') {
      lastBuy[t.mint] = t.source;
      if (t.source) { const w = get(t.source); w.buys++; if (typeof t.gapPct === 'number') w.gaps.push(t.gapPct); if (typeof t.lagSec === 'number') w.lags.push(t.lagSec); }
      continue;
    }
    if (typeof t.gapPct === 'number' && t.sources?.length === 1) get(t.sources[0]).gaps.push(t.gapPct);
    const srcs = t.sources || (lastBuy[t.mint] ? [lastBuy[t.mint]] : []);
    for (const a of srcs) {

      w.sells++; w.pnl += share; if (share > 0) w.wins++; if (t.t >= weekAgo) w.week += share; w.curve.push([t.t, w.pnl]);
    }
  }
  return out;
}

const dateFmt = (t) => new Date(t).toLocaleDateString([], { month: 'short', day: 'numeric' });
const BT_PERIODS = [['1d', 'Last 24 hours'], ['3d', 'Last 3 days'], ['7d', 'Last 7 days'], ['30d', 'Last 30 days'], ['custom', 'Custom dates…'], ['txs', 'Last N transactions']];
const isoDay = (t) => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
/** The chosen period as request fields: { from, to } or { txs }. */
function btPeriodBody() {
  const p = S.btPeriod || '7d', now = Date.now();
  if (p === 'txs') return { txs: S.btTxs || 600 };
  if (p === 'custom') {
    const from = new Date(`${S.btFrom || isoDay(now - 7 * 864e5)}T00:00:00`).getTime();
    const to = Math.min(now, new Date(`${S.btTo || isoDay(now)}T23:59:59.999`).getTime());
    return { from, to };
  }
  return { from: now - { '1d': 1, '3d': 3, '7d': 7, '30d': 30 }[p] * 864e5, to: now };
