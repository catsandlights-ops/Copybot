<!doctype html>
<html lang="en" data-mode="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Copybot</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'><path fill='%2307031a' d='M6 0h2v1H6zM4 1h2v1H4zM7 1h1v3H7zM3 2h1v1H3zM2 3h1v1H2zM1 4h1v2H1zM6 4h1v2H6zM0 6h1v2H0zM3 6h3v1H3zM1 7h1v1H1z'/><path fill='%235fae4e' d='M6 1h1v3H6zM4 2h2v1H4zM3 3h3v1H3zM2 4h4v1H2zM2 5h4v1H2zM1 6h2v1H1z'/></svg>">
<style>
/* ---------- color tokens: light (default) and dark ----------
   Appearance setting sets <html data-mode="light|dark|system">. "system" follows the computer. */
:root {
  --bg: #f6f5fb; --panel: #ffffff; --panel-2: #f2f0f9; --border: #e7e4f1; --border-strong: #d5d1e4;
  --text: #17142b; --muted: #5f5a78; --faint: #8b86a3;
  --accent: #7c3aed; --accent-hover: #6d28d9; --accent-bg: #f1eaff; --on-accent: #ffffff;
  --green: #0b9a57; --green-bg: #e2f6ec; --red: #dc2645; --red-bg: #fde8ec; --amber: #a86a00; --amber-bg: #fff2d6;
  --r-red: #ff3b5c; --r-orange: #ff8a1f; --r-yellow: #f2b705; --r-green: #12b866; --r-cyan: #0fb2e6; --r-blue: #3d6bff; --r-violet: #8b45ff; --r-pink: #ee3fb8;
  --glow-a: rgba(139, 69, 255, .07); --glow-b: rgba(15, 178, 230, .06);
  --shadow: 0 1px 2px rgba(23, 20, 43, .05), 0 2px 8px rgba(23, 20, 43, .05);
  --radius: 14px;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-mode="light"]) {
    --bg: #0d0a1c; --panel: #161229; --panel-2: #1e1937; --border: #2a2448; --border-strong: #3b3462;
    --text: #f3f1ff; --muted: #aaa4c9; --faint: #7c769e;
    --accent: #a78bfa; --accent-hover: #b9a1fb; --accent-bg: #2a2152; --on-accent: #0d0a1c;
    --green: #34d399; --green-bg: #0f2e24; --red: #fb7185; --red-bg: #3a1424; --amber: #fbbf24; --amber-bg: #33270d;
    --r-yellow: #ffd60a; --r-green: #22e07a; --r-cyan: #22d3ff;
    --glow-a: rgba(139, 69, 255, .16); --glow-b: rgba(34, 211, 255, .09);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-mode="dark"] {
  --bg: #0d0a1c; --panel: #161229; --panel-2: #1e1937; --border: #2a2448; --border-strong: #3b3462;
  --text: #f3f1ff; --muted: #aaa4c9; --faint: #7c769e;
  --accent: #a78bfa; --accent-hover: #b9a1fb; --accent-bg: #2a2152; --on-accent: #0d0a1c;
  --green: #34d399; --green-bg: #0f2e24; --red: #fb7185; --red-bg: #3a1424; --amber: #fbbf24; --amber-bg: #33270d;
  --r-yellow: #ffd60a; --r-green: #22e07a; --r-cyan: #22d3ff;
  --glow-a: rgba(139, 69, 255, .16); --glow-b: rgba(34, 211, 255, .09);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  color-scheme: dark;
}
:root { --rainbow: linear-gradient(90deg, var(--r-red), var(--r-orange), var(--r-yellow), var(--r-green), var(--r-cyan), var(--r-blue), var(--r-violet), var(--r-pink)); }
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.muted { color: var(--muted); }
.pos { color: var(--green); } .neg { color: var(--red); }
.num { font-variant-numeric: tabular-nums; }

/* layout */
.app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
.side { min-width: 0; border-right: 1px solid var(--border); background: var(--panel); padding: 20px 12px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 16px; padding: 0 10px 18px; }
.brand svg { flex: none; }
.nav { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--muted); cursor: pointer; border: 0; background: none; text-align: left; width: 100%; }
.nav:hover { background: var(--panel-2); color: var(--text); }
.nav.on { background: var(--accent-bg); color: var(--accent); font-weight: 560; }
.nav svg { width: 18px; height: 18px; flex: none; }
.nav .count { margin-left: auto; font-size: 12px; background: var(--panel-2); color: var(--muted); border-radius: 999px; padding: 0 7px; }
.side-foot { margin-top: auto; padding: 10px; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--faint); flex: none; }
.dot.ok { background: var(--green); } .dot.bad { background: var(--red); } .dot.warn { background: var(--amber); }

main { min-width: 0; }
.top { display: flex; align-items: center; gap: 12px; padding: 18px 28px; border-bottom: 1px solid var(--border); background: var(--panel); position: sticky; top: 0; z-index: 5; }
.top h1 { font-size: 18px; margin: 0; font-weight: 650; }
.top .spacer { flex: 1; }
.content { padding: 24px 28px 60px; max-width: 1240px; }

/* components */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--panel); cursor: pointer; font-weight: 520; white-space: nowrap; }
.btn:hover { background: var(--panel-2); }
.btn:disabled { opacity: .55; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-hover); }
.btn.go { background: var(--green); border-color: var(--green); color: #fff; }
.btn.stop { background: var(--red); border-color: var(--red); color: #fff; }
.btn.danger { color: var(--red); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 13px; }
.btn.ghost { border-color: transparent; background: none; }
.btn.ghost:hover { background: var(--panel-2); }
.btn svg { width: 15px; height: 15px; }

.pill { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12.5px; font-weight: 560; background: var(--panel-2); color: var(--muted); white-space: nowrap; }
.pill.run { background: var(--green-bg); color: var(--green); }
.pill.paper { background: var(--accent-bg); color: var(--accent); }
.pill.live { background: var(--red-bg); color: var(--red); }
.pill.run .dot { background: var(--green); animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.tag { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 7px; border-radius: 5px; text-transform: uppercase; letter-spacing: .02em; }
.tag.buy { background: var(--green-bg); color: var(--green); }
.tag.sell { background: var(--red-bg); color: var(--red); }
.tag.paper { background: var(--panel-2); color: var(--muted); }
.tag.live { background: var(--amber-bg); color: var(--amber); }

.card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-h { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.card-h h2 { font-size: 14.5px; margin: 0; font-weight: 620; }
.card-h .spacer { flex: 1; }
.card-b { padding: 18px; }
.grid { display: grid; gap: 16px; }
.grid > * { min-width: 0; }
.stats { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); margin-bottom: 16px; }
.stat { padding: 16px 18px; }
.stat .k { color: var(--muted); font-size: 12.5px; }
.stat .v { font-size: 22px; font-weight: 650; margin-top: 4px; letter-spacing: -.01em; }
.stat .s { color: var(--faint); font-size: 12px; margin-top: 2px; }
.bar { height: 4px; background: var(--panel-2); border-radius: 4px; margin-top: 10px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.two { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); align-items: start; }

.banner { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-radius: 10px; margin-bottom: 16px; font-size: 13.5px; border: 1px solid transparent; }
.banner.info { background: var(--accent-bg); color: var(--text); }
.banner.warn { background: var(--amber-bg); }
.banner.danger { background: var(--red-bg); }
.banner b { font-weight: 620; }
.banner .btn { margin-left: auto; }

table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; font-weight: 560; color: var(--muted); padding: 10px 18px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 11px 18px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
.tbl-wrap { overflow-x: auto; }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); }
.empty h3 { color: var(--text); margin: 0 0 6px; font-size: 15px; font-weight: 600; }
.empty .btn { margin-top: 14px; }

.feed { max-height: 560px; overflow-y: auto; }
.feed-item { display: flex; gap: 10px; padding: 9px 18px; border-bottom: 1px solid var(--border); font-size: 13px; }
.feed-item:last-child { border-bottom: 0; }
.feed-item .t { color: var(--faint); font-family: var(--mono); font-size: 11.5px; padding-top: 2px; flex: none; }
.feed-item .dot { margin-top: 6px; }
.feed-item.skip { color: var(--muted); }
.feed-item > span:last-child { min-width: 0; overflow-wrap: anywhere; }
.lv-buy .dot { background: var(--green); } .lv-sell .dot { background: var(--red); } .lv-signal .dot { background: var(--accent); }
.lv-error .dot { background: var(--red); } .lv-warn .dot { background: var(--amber); } .lv-system .dot { background: var(--muted); }
.lv-error { color: var(--red); }
.lv-ai .dot { background: var(--r-violet); }
.ai-hero { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; padding: 20px 22px; }
.ai-hero .orb { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: var(--rainbow); color: #fff; flex: none; }
.ai-hero .orb svg { width: 28px; height: 28px; }
.ai-hero h2 { margin: 0 0 4px; font-size: 18px; }
.ai-list { list-style: none; margin: 0; padding: 0; }
.ai-item { display: grid; grid-template-columns: 74px 1fr auto; gap: 4px 14px; padding: 12px 18px; border-top: 1px solid var(--border); align-items: start; }
.ai-item:first-child { border-top: 0; }
.ai-item .t { color: var(--faint); font-size: 12px; padding-top: 2px; }
.ai-item .what { font-weight: 600; }
.ai-item .why { color: var(--muted); font-size: 13px; margin-top: 2px; grid-column: 2 / 4; }
.ai-item .why li { margin: 2px 0; }
.ai-item .meta { color: var(--faint); font-size: 12px; text-align: right; white-space: nowrap; }
.tag.ai { background: var(--panel-2); color: var(--accent); }
.tag.skip { background: var(--amber-bg); color: var(--amber); }
#ai-settings { scroll-margin-top: 110px; }
.modal .with-unit span { min-width: 86px; text-align: center; }
.modal.wizard { max-width: 620px; width: calc(100% - 32px); padding: 22px 26px; }
.wz-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.wz-dots { display: flex; gap: 6px; }
.wz-dot { width: 26px; height: 6px; border-radius: 6px; background: var(--panel-2); }
.wz-dot.done { background: var(--accent); opacity: .5; }
.wz-dot.on { background: var(--rainbow); }
.wz-body h2 { margin: 10px 0 8px; font-size: 20px; }
.wz-body p { line-height: 1.55; }
.wz-hero svg { width: 64px; height: 64px; }
.wz-nav { margin-top: 18px; }
.wz-choices { display: grid; gap: 10px; }
.wz-choice { display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--panel); color: var(--text); font: inherit; }
button.wz-choice { cursor: pointer; }
button.wz-choice:hover { border-color: var(--accent); }
.wz-choice span { color: var(--muted); font-size: 13px; }
.wz-check { list-style: none; padding: 0; line-height: 2; }
.scout-hero { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; padding: 20px 22px; }
.scout-steps { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.scout-steps span { font-size: 12px; padding: 3px 9px; border-radius: 99px; background: var(--panel-2); color: var(--muted); }
.picks { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; padding: 0 18px 16px; }
.pick { border: 1px solid var(--border); border-radius: 12px; padding: 14px; position: relative; overflow: hidden; }
.pick::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--rainbow); }
.pick .why { color: var(--muted); font-size: 13px; margin: 8px 0 10px; }
.pick .nums { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.pick .nums b { color: var(--text); }
.strat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.strat { display: flex; flex-direction: column; position: relative; overflow: hidden; padding: 18px 20px; }
.strat::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--c); }
.strat.on { box-shadow: 0 0 0 2px var(--c); }
.strat h3 { margin: 0; font-size: 17px; }
.strat .tag-risk { font-size: 11px; font-weight: 650; padding: 2px 8px; border-radius: 99px; background: var(--panel-2); color: var(--muted); }
.strat .tag-risk.Higher { background: var(--red-bg); color: var(--red); }
.strat .tag-risk.Lower { background: var(--green-bg); color: var(--green); }
.strat .tag-risk.Medium { background: var(--amber-bg); color: var(--amber); }
.strat dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; margin: 12px 0 16px; }
.strat dt { color: var(--muted); }
.strat dd { margin: 0; text-align: right; font-weight: 560; }
.strat .acts { margin-top: auto; display: flex; gap: 8px; }
.strat .acts .btn { flex: 1; }
.chg { width: 100%; border-collapse: collapse; font-size: 13px; }
.chg td { padding: 5px 4px; border-top: 1px solid var(--border); }
.chg td:nth-child(2), .chg td:nth-child(3) { text-align: right; white-space: nowrap; }
.bt-curve { padding: 8px 18px 16px; }
.bt-curve svg { width: 100%; height: 220px; display: block; }
.bt-axis { display: flex; justify-content: space-between; color: var(--faint); font-size: 12px; margin-top: 6px; }
.bt-form { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
@media (max-width: 900px) { .bt-form { grid-template-columns: 1fr; } }
.bt-hist { display: flex; gap: 6px; flex-wrap: wrap; }
.tokchips { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 18px 12px; }
.ai-actions { display: flex; gap: 8px; flex-wrap: wrap; }
@media (max-width: 640px) { .ai-item { grid-template-columns: 1fr; } .ai-item .why { grid-column: 1; } .ai-item .meta { text-align: left; } }

/* exit-plan chips */
.plan { white-space: normal; min-width: 170px; max-width: 300px; line-height: 1.9; }
.note.bad { white-space: nowrap; }
.chip { display: inline-block; white-space: nowrap; font-size: 11.5px; padding: 1px 7px; border-radius: 999px; background: var(--panel-2); color: var(--muted); margin: 1px 0; }
.chip.done { background: var(--green-bg); color: var(--green); }
.chip.trail { background: var(--amber-bg); color: var(--amber); }
.input.wallet-num { width: 84px; min-width: 76px; height: 30px; text-align: right; flex: none; }
.wallet-row .note { white-space: nowrap; }
.wallet-row .label-input { min-width: 120px; }

/* forms */
.field { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 16px; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.field:last-child { border-bottom: 0; }
.field .l { font-weight: 540; }
.field .h { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.input { height: 34px; padding: 0 10px; border: 1px solid var(--border-strong); background: var(--panel); border-radius: 8px; width: 100%; min-width: 0; }
textarea.input { height: auto; padding: 8px 10px; resize: vertical; font-family: var(--mono); font-size: 12.5px; }
.input:focus, .btn:focus-visible, .nav:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.with-unit { display: flex; align-items: center; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--panel); overflow: hidden; }
.with-unit:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
.with-unit input { border: 0; height: 32px; padding: 0 10px; background: none; width: 100%; min-width: 0; outline: none; text-align: right; }
.with-unit span { padding: 0 10px; color: var(--muted); font-size: 12.5px; background: var(--panel-2); align-self: stretch; display: flex; align-items: center; border-left: 1px solid var(--border); white-space: nowrap; }
.switch { display: inline-block; position: relative; width: 38px; height: 22px; flex: none; justify-self: end; }
.switch input { opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; position: absolute; z-index: 1; }
.switch i { position: absolute; inset: 0; background: var(--border-strong); border-radius: 999px; transition: .15s; }
.switch i::after { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.switch input:checked + i { background: var(--accent); }
.switch input:checked + i::after { transform: translateX(16px); }
.switch input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display: inline-flex; background: var(--panel-2); border-radius: 9px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; height: 30px; padding: 0 16px; border-radius: 7px; cursor: pointer; color: var(--muted); font-weight: 540; }
.seg button.on { background: var(--panel); color: var(--text); box-shadow: var(--shadow); }
.seg button.on.live { color: var(--red); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.savebar { position: sticky; bottom: 16px; display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--text); color: var(--bg); border-radius: 12px; margin-top: 16px; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
.savebar .spacer { flex: 1; }
.savebar .btn:not(.primary) { background: transparent; color: var(--bg); border-color: rgba(127,127,127,.5); }

.wallet-row td:first-child { width: 52px; }
.addr { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.copy { border: 0; background: none; padding: 2px; cursor: pointer; color: var(--faint); border-radius: 4px; display: inline-flex; }
.copy:hover { color: var(--text); background: var(--panel-2); }
.copy svg { width: 13px; height: 13px; }
.label-input { border: 1px solid transparent; background: none; padding: 3px 6px; margin-left: -7px; border-radius: 6px; font-weight: 560; width: 100%; max-width: 220px; }
.label-input:hover { border-color: var(--border); }
.label-input:focus { border-color: var(--accent); outline: none; background: var(--panel); }

.job { border-top: 1px solid var(--border); }
.job:first-child { border-top: 0; }
.job-h { display: flex; align-items: center; gap: 10px; padding: 12px 18px; }
.spinner { width: 14px; height: 14px; border: 2px solid var(--border-strong); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.notes { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.note { font-size: 11.5px; padding: 1px 7px; border-radius: 5px; background: var(--panel-2); color: var(--muted); }
.note.good { background: var(--green-bg); color: var(--green); }
.note.bad { background: var(--amber-bg); color: var(--amber); }
.steps { margin: 0; padding-left: 18px; color: var(--muted); }
.steps li { margin: 4px 0; }
.steps b { color: var(--text); font-weight: 560; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }

/* modal + toast */
.modal-bg { position: fixed; inset: 0; background: rgba(10,12,16,.5); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
.modal { background: var(--panel); border-radius: 14px; max-width: 460px; width: 100%; padding: 22px; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
.modal h3 { margin: 0 0 8px; font-size: 17px; }
.modal p, .modal li { color: var(--muted); }
.modal .row { justify-content: flex-end; margin-top: 18px; }
.toasts { position: fixed; bottom: 18px; right: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 60; }
.toast { background: var(--text); color: var(--bg); padding: 10px 14px; border-radius: 10px; max-width: 360px; box-shadow: 0 8px 24px rgba(0,0,0,.2); font-size: 13.5px; animation: up .2s ease-out; }
.toast.err { background: var(--red); color: #fff; }
@keyframes up { from { transform: translateY(8px); opacity: 0; } }

td.r { white-space: nowrap; }
@media (max-width: 1640px) {
  .two { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  .side { position: static; height: auto; flex-direction: row; overflow-x: auto; padding: 8px 12px; border-right: 0; border-bottom: 1px solid var(--border); gap: 2px; }
  .brand { padding: 0 8px 0 0; } .brand span { display: none; }
  .nav { width: auto; white-space: nowrap; } .nav .count, .side-foot { display: none; }
  .top { padding: 12px 16px; position: static; flex-wrap: wrap; }
  .content { padding: 16px 16px 60px; }
  .field { grid-template-columns: 1fr; gap: 8px; }
  .switch { justify-self: start; }
  th, td { padding: 9px 12px; }
}

/* =====================================================================
   RAINBOW LAYER: the modern base above, plus Copybot's personality:
   rainbow edge lines and title, color-coded menu and panels, pixel leaf
   logo, hearts and coins. Works in light and dark.
   ===================================================================== */
@font-face { font-family: "Press Start 2P"; src: url("/fonts/press-start-2p.woff2") format("woff2"); font-display: swap; }
body { background-image: radial-gradient(circle at 0% 0%, var(--glow-a), transparent 40%), radial-gradient(circle at 100% 100%, var(--glow-b), transparent 45%); background-attachment: fixed; }
.ico { display: inline-block; width: 18px; height: 18px; vertical-align: -3px; margin-right: 8px; }
svg.ico, .ico svg, .hearts svg, .deco svg { shape-rendering: crispEdges; }

/* sidebar + top bar: thin rainbow edges */
.side { position: sticky; }
.side::after { content: ""; position: absolute; top: 0; right: -1px; bottom: 0; width: 3px; background: linear-gradient(180deg, var(--r-red), var(--r-orange), var(--r-yellow), var(--r-green), var(--r-cyan), var(--r-blue), var(--r-violet), var(--r-pink)); opacity: .9; }
.top { box-shadow: none; }
.top::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; background: var(--rainbow); opacity: .9; }
.top h1 { font-size: 22px; font-weight: 760; letter-spacing: -.02em; background: var(--rainbow); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* logo: pixel leaf + rainbow pixel wordmark */
.brand { gap: 10px; padding: 2px 10px 20px; }
.brand > svg:not(.ico) { display: none; }
.brand .ico { width: 26px; height: 26px; margin: 0; }
.brand .word { font-family: "Press Start 2P", var(--mono); font-size: 12px; letter-spacing: 1px; text-transform: uppercase; font-weight: 400; }
.brand .c1 { color: var(--r-red); } .brand .c2 { color: var(--r-orange); } .brand .c3 { color: var(--r-yellow); } .brand .c4 { color: var(--r-green); }
.brand .c5 { color: var(--r-cyan); } .brand .c6 { color: var(--r-blue); } .brand .c7 { color: var(--r-violet); }

/* menu: each item has its own rainbow color */
.nav { --c: var(--accent); font-weight: 520; color: var(--muted); }
.nav:nth-of-type(1) { --c: var(--r-red); } .nav:nth-of-type(2) { --c: var(--r-orange); } .nav:nth-of-type(3) { --c: var(--r-yellow); }
.nav:nth-of-type(4) { --c: var(--r-green); } .nav:nth-of-type(5) { --c: var(--r-cyan); } .nav:nth-of-type(6) { --c: var(--r-blue); }
.nav:nth-of-type(7) { --c: var(--r-violet); } .nav:nth-of-type(8) { --c: var(--r-pink); }
.nav svg { color: var(--c); padding: 5px; width: 28px; height: 28px; border-radius: 8px; background: color-mix(in srgb, var(--c) 14%, transparent); }
.nav:hover { background: var(--panel-2); color: var(--text); }
.nav.on { background: color-mix(in srgb, var(--c) 13%, transparent); color: var(--text); font-weight: 620; box-shadow: inset 3px 0 0 var(--c); }
.nav.on svg { background: var(--c); color: #fff; }

/* panels: a colored marker per panel, cycling through the rainbow */
.card-h h2 { display: flex; align-items: center; gap: 9px; }
.card-h h2::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--c, var(--accent)); flex: none; }
:is(.grid, .stack) > .card:nth-child(8n+1) { --c: var(--r-red); } :is(.grid, .stack) > .card:nth-child(8n+2) { --c: var(--r-orange); }
:is(.grid, .stack) > .card:nth-child(8n+3) { --c: var(--r-yellow); } :is(.grid, .stack) > .card:nth-child(8n+4) { --c: var(--r-green); }
:is(.grid, .stack) > .card:nth-child(8n+5) { --c: var(--r-cyan); } :is(.grid, .stack) > .card:nth-child(8n+6) { --c: var(--r-blue); }
:is(.grid, .stack) > .card:nth-child(8n+7) { --c: var(--r-violet); } :is(.grid, .stack) > .card:nth-child(8n+8) { --c: var(--r-pink); }
.content > .card { --c: var(--r-violet); }

/* stat cards: colored top edge, icons, bigger numbers */
.stat { position: relative; overflow: hidden; padding: 18px 20px; }
.stat::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--c); }
.stat .k { display: flex; align-items: center; font-weight: 560; }
.stat .v { font-size: 26px; font-weight: 760; }
.hearts { display: flex; gap: 3px; margin-top: 8px; flex-wrap: wrap; }
.hearts svg { width: 18px; height: 16px; }
.bar { height: 8px; border-radius: 99px; margin-top: 10px; }
.bar i { background: var(--rainbow); background-size: 300px 100%; border-radius: 99px; }

/* buttons */
.btn { border-radius: 10px; font-weight: 600; transition: transform .06s, filter .15s, background .15s; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn.primary { background: linear-gradient(135deg, var(--r-violet), var(--r-pink)); border-color: transparent; color: #fff; }
.btn.primary:hover { filter: brightness(1.08); background: linear-gradient(135deg, var(--r-violet), var(--r-pink)); }
.btn.go { background: var(--r-green); border-color: transparent; color: #fff; }
.btn.stop { background: var(--r-red); border-color: transparent; color: #fff; }
.btn.go:hover, .btn.stop:hover { filter: brightness(1.08); }

/* banners: colored edge */
.banner { border-left: 4px solid var(--c, var(--accent)); border-radius: 12px; background: var(--panel); box-shadow: var(--shadow); }
.banner.info { --c: var(--r-cyan); background: var(--panel); } .banner.warn { --c: var(--r-yellow); background: var(--panel); } .banner.danger { --c: var(--r-red); background: color-mix(in srgb, var(--r-red) 8%, var(--panel)); }

/* tables, chips */
th { text-transform: uppercase; font-size: 11px; letter-spacing: .05em; }
tr:hover td { background: color-mix(in srgb, var(--accent) 4%, transparent); }

/* empty states: pixel rainbow + PRESS START */
.deco { display: block; margin: 0 auto 14px; width: 80px; }
.deco svg { width: 80px; height: auto; display: block; margin: 0 auto; animation: hop 1.8s steps(4) infinite; }
@keyframes hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.press { display: block; font-family: "Press Start 2P", var(--mono); font-size: 11px; letter-spacing: 1px; margin-top: 16px; text-transform: uppercase; background: var(--rainbow); -webkit-background-clip: text; background-clip: text; color: transparent; animation: blink 1.2s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* markets */
.mk-top { display: grid; grid-template-columns: repeat(3, minmax(140px, 1fr)) minmax(280px, 2fr); gap: 16px; margin-bottom: 16px; }
.coin { padding: 14px 18px; display: flex; flex-direction: column; gap: 2px; }
.coin b { font-size: 20px; }
.mk-search { display: flex; gap: 8px; align-items: center; padding: 14px; }
.mk-main { grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr); align-items: start; }
.two-eq { grid-template-columns: minmax(0, 1.6fr) minmax(260px, 1fr); align-items: start; }
.clickrow { cursor: pointer; }
.tok { display: flex; align-items: center; gap: 10px; }
.small { font-size: 12px; }
.tthumb { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; flex: none; vertical-align: middle; margin-right: 8px; background: var(--panel-2); }
.tok .tthumb { margin-right: 0; }
.tthumb.ph { display: inline-flex; align-items: center; justify-content: center; font-weight: 700; color: var(--muted); }
.tthumb.lg { width: 52px; height: 52px; font-size: 20px; margin-right: 0; }
.bs { height: 8px; min-width: 80px; border-radius: 99px; background: color-mix(in srgb, var(--red) 55%, transparent); overflow: hidden; }
.bs i { display: block; height: 100%; background: var(--green); }
.bs.big { height: 12px; margin: 6px 0 4px; }
.news { max-height: 720px; overflow-y: auto; }
.news-item { display: flex; flex-direction: column; gap: 3px; padding: 12px 18px; border-bottom: 1px solid var(--border); color: var(--text); text-decoration: none; }
.news-item:hover { background: var(--panel-2); text-decoration: none; }
.news-item .nt { font-weight: 560; line-height: 1.35; }
.src { align-self: flex-start; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--r-violet); }
.src-coindesk { color: var(--r-blue); } .src-theblock { color: var(--r-pink); } .src-decrypt { color: var(--r-green); } .src-blockworks { color: var(--r-orange); }
.tok-h { padding: 20px 22px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; }
.verdict { flex-basis: 100%; padding: 10px 14px; border-radius: 10px; font-weight: 560; }
.verdict.yes { background: var(--green-bg); color: var(--green); } .verdict.no { background: var(--amber-bg); color: var(--amber); }
.chart { width: 100%; height: auto; display: block; }
.chart .gl { stroke: var(--border); stroke-dasharray: 3 4; }
.chart .ax { fill: var(--faint); font-size: 11px; }
.chart .cu { stroke: var(--green); fill: var(--green); } .chart .cd { stroke: var(--red); fill: var(--red); }
@media (max-width: 1500px) { .mk-main { grid-template-columns: 1fr; } .news { max-height: 420px; } }
@media (max-width: 1100px) { .mk-top { grid-template-columns: repeat(3, 1fr); } .mk-search { grid-column: 1 / -1; } .two-eq { grid-template-columns: 1fr; } }
@media (max-width: 760px) { .mk-top { grid-template-columns: 1fr 1fr; } .card-h { flex-wrap: wrap; } }

/* learn page */
.learn-hero { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 22px 24px; margin-bottom: 16px; background: linear-gradient(135deg, color-mix(in srgb, var(--r-violet) 10%, var(--panel)), color-mix(in srgb, var(--r-cyan) 8%, var(--panel))); }
.learn-hero h2 { margin: 0 0 4px; font-size: 20px; }
.learn-hero p { margin: 0; }
.learn-hero svg { width: 96px; height: auto; flex: none; shape-rendering: crispEdges; }
.chips-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.fchip { --c: var(--accent); border: 1px solid var(--border-strong); background: var(--panel); color: var(--text); border-radius: 999px; height: 32px; padding: 0 14px; cursor: pointer; font-weight: 560; display: inline-flex; align-items: center; gap: 7px; }
.fchip::before { content: ""; width: 8px; height: 8px; border-radius: 3px; background: var(--c); }
.fchip.on { background: color-mix(in srgb, var(--c) 14%, var(--panel)); border-color: var(--c); }
.guide-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.guide-card { --c: var(--accent); text-align: left; display: flex; flex-direction: column; gap: 6px; padding: 18px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--panel); box-shadow: var(--shadow); cursor: pointer; color: var(--text); position: relative; overflow: hidden; transition: transform .12s, box-shadow .12s; }
.guide-card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--c); }
.guide-card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(23, 20, 43, .1); }
.guide-card b { font-size: 15.5px; line-height: 1.3; }
.guide-card .muted { font-size: 13px; }
.gtag { align-self: flex-start; font-size: 11.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .04em; color: var(--c); }
.gmeta { margin-top: auto; padding-top: 6px; font-size: 12.5px; color: var(--c); font-weight: 600; }
.article { max-width: 760px; overflow: hidden; }
.article-h { padding: 26px 30px 18px; border-bottom: 1px solid var(--border); background: linear-gradient(180deg, color-mix(in srgb, var(--c) 9%, var(--panel)), var(--panel)); }
.article-h h2 { margin: 6px 0 4px; font-size: 24px; letter-spacing: -.01em; }
.article-b { padding: 8px 30px 26px; font-size: 15px; line-height: 1.65; }
.article-b h3 { font-size: 16.5px; margin: 22px 0 6px; }
.article-b ul, .article-b ol { padding-left: 22px; }
.article-b li { margin: 6px 0; }
.article-b ol.big li::marker { font-weight: 700; color: var(--c); }
.article-b code { font-family: var(--mono); font-size: 13px; background: var(--panel-2); padding: 1px 5px; border-radius: 5px; }
.article-b .tip { background: color-mix(in srgb, var(--c) 9%, var(--panel)); border-left: 4px solid var(--c); padding: 12px 14px; border-radius: 10px; }
.article-b .gloss { display: grid; grid-template-columns: 150px 1fr; gap: 10px 18px; }
.article-b .gloss dt { font-weight: 650; } .article-b .gloss dd { margin: 0; color: var(--muted); }
.more-h { margin: 24px 0 12px; font-size: 15px; }
@media (max-width: 760px) { .article-h, .article-b { padding-left: 18px; padding-right: 18px; } .article-b .gloss { grid-template-columns: 1fr; gap: 2px; } .article-b .gloss dd { margin-bottom: 8px; } .learn-hero svg { display: none; } }

/* appearance switch in the top bar */
.mode-btn { width: 34px; padding: 0; }
.mode-btn svg { width: 16px; height: 16px; }

@media (max-width: 760px) {
  .side { position: relative; }
  .side::after { top: auto; left: 0; right: 0; bottom: 0; width: auto; height: 3px; background: var(--rainbow); }
  .top { position: relative; }
  .brand .word { display: none; }
  .nav svg { width: 24px; height: 24px; padding: 4px; }
}
@media (prefers-reduced-motion: reduce) { .deco svg, .press, .pill.run .dot { animation: none !important; } }
</style>

<script>
// ---------------- state ----------------
const S = { ui: { mode: 'system' }, app: { version: null, update: { state: 'disabled' } }, page: 'dashboard', status: null, config: null, logs: [], trades: [], connection: null, jobs: [], dirty: false, tradeFilter: 'all', busy: false, connTest: null };

}
const HEART = ['.KK...KK.', 'KRWK.KRRK', 'KRRRKRRRK', 'KRRRRRRRK', '.KRRRRRK.', '..KRRRK..', '...KRK...', '....K....'];

// The app opens this page as /?t=<session token>. Keep the token for this tab only and
// remove it from the address bar.
let TOKEN = null;
try {
  const u = new URL(location.href);
  TOKEN = u.searchParams.get('t');
  if (TOKEN) { sessionStorage.setItem('copybot-token', TOKEN); history.replaceState(null, '', u.pathname + u.hash); }
  else TOKEN = sessionStorage.getItem('copybot-token');
} catch { /* storage blocked: token stays in memory only */ }

function showLocked() {
  document.body.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px">
    <div class="card" style="max-width:440px;padding:28px;text-align:center"><h2 style="margin:0 0 8px;font-size:18px">Session expired</h2>
    <p class="muted" style="margin:0">For security, Copybot only accepts the window it opened itself. Close this tab and start Copybot again${location.port === '4777' ? ', or use the link shown in the Copybot terminal window' : ''}.</p></div></div>`;
}

async function api(method, path, data) {
  const r = await fetch(path, { method, headers: { 'content-type': 'application/json', 'x-copybot-token': TOKEN || '' }, body: data ? JSON.stringify(data) : undefined });
  if (r.status === 401) { showLocked(); throw new Error('Session expired'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `Request failed (${r.status})`);
  return j;
}
function toast(msg, err = false) {
  const el = document.createElement('div');
  el.className = 'toast' + (err ? ' err' : '');
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), err ? 6000 : 3000);
}
async function act(fn, ok) {
  try { const r = await fn(); if (ok) toast(ok); return r; } catch (e) { toast(e.message, true); }
}
function confirmModal({ title, body, confirm = 'Confirm', danger = false }) {
  return new Promise((resolve) => {
    $('#modal-root').innerHTML = `<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true"><h3>${title}</h3><div>${body}</div>
      <div class="row"><button class="btn" data-a="no">Cancel</button><button class="btn ${danger ? 'stop' : 'primary'}" data-a="yes">${confirm}</button></div></div></div>`;
    const done = (v) => { $('#modal-root').innerHTML = ''; resolve(v); };
    $('#modal-root [data-a=yes]').onclick = () => done(true);
    $('#modal-root [data-a=no]').onclick = () => done(false);
    $('#modal-root .modal-bg').onclick = (e) => { if (e.target.classList.contains('modal-bg')) done(false); };
    $('#modal-root [data-a=yes]').focus();
  });
}

function updateShort() {

function updateText() {
  const u = S.app.update;
  switch (u.state) {
    case 'disabled': return u.message || 'Updates are only available in the installed desktop app.';
    case 'checking': return 'Checking for updates…';
    case 'up-to-date': return `You're on the latest version${u.checkedAt ? ` (checked ${time(u.checkedAt)})` : ''}.`;
    case 'downloading': return `Downloading version ${esc(u.version)}… ${u.percent ?? 0}%`;
    case 'verifying': return `Checking the security signature of version ${esc(u.version)}…`;
    case 'ready': return `Version ${esc(u.version)} is downloaded and verified. Restart to install.`;
    case 'installing': return 'Installing…';

/** Realized profit over time from your own sells (current mode), as a chart card on the Dashboard. */
function pnlChart() {
  const range = S.pnlRange || '7d', now = Date.now();
  const from = range === 'all' ? 0 : now - { '1d': 1, '7d': 7, '30d': 30 }[range] * 864e5;
  const sells = S.trades.filter((t) => t.mode === S.config.mode && t.side === 'sell' && typeof t.pnl === 'number' && t.t >= from).sort((a, b) => a.t - b.t);
  let run = 0;
  const curve = sells.map((t) => [t.t, (run += t.pnl)]);
  const start = range === 'all' ? sells[0]?.t ?? now : from;
  const wins = sells.filter((t) => t.pnl > 0).length;
  const seg = [['1d', '24h'], ['7d', '7 days'], ['30d', '30 days'], ['all', 'All']].map(([v, l]) => `<button data-pnl-range="${v}" class="${range === v ? 'on' : ''}">${l}</button>`).join('');
  return `<div class="card" style="margin-bottom:16px"><div class="card-h"><h2>Your profit over time</h2>
      <span class="muted" style="font-size:12.5px;margin-left:8px">${sells.length ? `${signed(run, 3)} SOL from ${sells.length} sell${sells.length > 1 ? 's' : ''} · ${Math.round((wins / sells.length) * 100)}% in profit` : ''}</span>
      <span class="spacer"></span><div class="seg">${seg}</div></div>
    <div class="bt-curve">${curve.length >= 2 ? curveSvg(curve, start, now) : `<div class="muted" style="padding:28px 0;text-align:center">${sells.length ? 'One sell so far: the chart starts after the second.' : `No sells in ${range === 'all' ? S.config.mode + ' mode yet' : 'this period'}. Your profit shows here as positions close.`}</div>`}</div></div>`;
}

/** What the staged exits have done for a position, and what happens next. */
function exitPlan(p) {
  const ww = S.config.wallets.find((w) => w.address === p.sources?.[0]);
  const st = (S.strategies || []).find((x) => x.id === ww?.strategy);
  const { stopLossPct, ...ov } = ww?.exits || {};
  const x = { ...S.config.exits, ...(st?.patch.exits || {}), ...ov }, done = new Set(p.steps || []);
  const chips = [];
  const step = (id, on, label) => { if (on) chips.push(`<span class="chip ${done.has(id) ? 'done' : ''}">${done.has(id) ? '✓ ' : ''}${label}</span>`); };
  step('recover', x.recoverCostAtPct > 0, `cost back +${x.recoverCostAtPct}%`);
  step('tp1', x.tp1AtPct > 0, `TP1 +${x.tp1AtPct}%`);
  step('tp2', x.tp2AtPct > 0, `TP2 +${x.tp2AtPct}%`);
  const peakGain = ((p.peakMultiple || 1) - 1) * 100;
  if (x.trailingStopPct > 0 && peakGain >= x.trailingAfterPct) {
    const floor = ((p.peakMultiple || 1) * (1 - x.trailingStopPct / 100) - 1) * 100;
    chips.push(`<span class="chip trail" title="Peak +${peakGain.toFixed(0)}%. Sells everything if it falls to ${pct(floor)}.">trailing: sells below ${pct(floor)}</span>`);
  }
  if (st) chips.push(`<span class="chip" title="This wallet uses its own strategy (Wallets page)">${esc(st.name)}</span>`);
  else if (Object.keys(ov).length || stopLossPct !== undefined) chips.push('<span class="chip" title="This wallet has its own exit settings (Wallets page)">wallet\'s own exits</span>');
  return chips.join(' ') || '<span class="muted">stop-loss only</span>';
}

const medianOf = (xs) => { if (!xs.length) return null; const s = [...xs].sort((a, b) => a - b), m = Math.floor(s.length / 2); return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
/** Your measured copy gap across all copied trades in this mode: { median, n }. */
function measuredGap() {
  const g = S.trades.filter((t) => t.mode === S.config.mode && typeof t.gapPct === 'number').map((t) => t.gapPct);
  return { median: medianOf(g), n: g.length };
}

function walletStats() {
  const mode = S.config.mode, weekAgo = Date.now() - 7 * 86400_000;
  const out = {}, lastBuy = {};
  const get = (a) => (out[a] ??= { buys: 0, sells: 0, wins: 0, pnl: 0, week: 0, gaps: [], lags: [] });
  for (const t of [...S.trades].reverse()) { // oldest first
    if (t.mode !== mode) continue;
    if (t.side === 'buy') {
      lastBuy[t.mint] = t.source;
      if (t.source) { const w = get(t.source); w.buys++; if (typeof t.gapPct === 'number') w.gaps.push(t.gapPct); if (typeof t.lagSec === 'number') w.lags.push(t.lagSec); }
      continue;
    }
    if (typeof t.gapPct === 'number' && t.sources?.length === 1) get(t.sources[0]).gaps.push(t.gapPct);
    const srcs = t.sources || (lastBuy[t.mint] ? [lastBuy[t.mint]] : []);
    for (const a of srcs) {
      const share = (t.pnl || 0) / srcs.length, w = get(a);
      w.sells++; w.pnl += share; if (share > 0) w.wins++; if (t.t >= weekAgo) w.week += share;
    }
  }
  return out;
}

function btPeriodBody() {

const usdC = (n) => n == null ? '—' : n >= 1e9 ? `$${(n / 1e9).toFixed(2)}B` : n >= 1e6 ? `$${(n / 1e6).toFixed(2)}M` : n >= 1e3 ? `$${(n / 1e3).toFixed(1)}K` : `$${n.toFixed(0)}`;
function priceFmt(n) {
  if (n == null) return '—';
  if (n >= 1000) return '$' + n.toLocaleString(undefined, { maximumFractionDigits: 0 });
  if (n >= 1) return '$' + n.toFixed(2);
  if (n >= 0.001) return '$' + n.toPrecision(3);
  // Tiny prices: $0.0₅277 means four… five zeros after the point, then 277.
  const zeros = Math.floor(-Math.log10(n)) - 1;
  const sig = Math.round(n * 10 ** (zeros + 4)).toString().slice(0, 4).replace(/0+$/, '');
  return `$0.0${String(zeros).split('').map((d) => '₀₁₂₃₄₅₆₇₈₉'[d]).join('')}${sig}`;
}
const chg = (n) => n == null ? '<span class="muted">—</span>' : `<span class="${n >= 0 ? 'pos' : 'neg'}">${n >= 0 ? '▲' : '▼'} ${Math.abs(n).toFixed(1)}%</span>`;

/** Load a market resource once, then refresh it in the background. */
async function mload(key, path, ttl = 60_000) {
  const m = S.m, cur = m.data[key];
  if (m.loading[key] || (cur && Date.now() - cur.at < ttl)) return;
  m.loading[key] = true;
  try {
    const r = await fetch(path, { headers: { 'x-copybot-token': TOKEN || '' } });
    if (r.status === 401) return showLocked();
    const j = await r.json().catch(() => ({ error: 'Bad response' }));
    m.data[key] = { at: Date.now(), ...j };
  } catch (e) {
    m.data[key] = { at: Date.now(), error: 'Could not reach market data.' };
  } finally {
    m.loading[key] = false;
    if (S.page === 'markets') render();
  }
}

function candleChart(c) {
  if (!c.length) return '<div class="empty">No chart data for this pool yet.</div>';
  const W = 900, H = 300, pad = 74;
  const lo = Math.min(...c.map((k) => k.l)), hi = Math.max(...c.map((k) => k.h)), span = hi - lo || hi || 1;
  const y = (v) => 10 + (H - 40) * (1 - (v - lo) / span), step = (W - pad - 10) / c.length, bw = Math.max(2, step * 0.62);
  const grid = [0, 0.5, 1].map((f) => { const v = lo + span * f; return `<line x1="0" x2="${W - pad}" y1="${y(v)}" y2="${y(v)}" class="gl"/><text x="${W - pad + 6}" y="${y(v) + 4}" class="ax">${priceFmt(v)}</text>`; }).join('');
  const bars = c.map((k, i) => {
    const x = 5 + i * step + step / 2, up = k.c >= k.o, top = y(Math.max(k.o, k.c)), h = Math.max(1, Math.abs(y(k.o) - y(k.c)));
    return `<line x1="${x}" x2="${x}" y1="${y(k.h)}" y2="${y(k.l)}" class="${up ? 'cu' : 'cd'}"/><rect x="${x - bw / 2}" y="${top}" width="${bw}" height="${h}" rx="1" class="${up ? 'cu' : 'cd'}"/>`;
  }).join('');
  const lbl = [[0, 'start'], [Math.floor(c.length / 2), 'middle'], [c.length - 1, 'end']].map(([i, anchor]) => `<text x="${5 + i * step + step / 2}" y="${H - 8}" text-anchor="${anchor}" class="ax">${new Date(c[i].t).toLocaleString([], S.m.tf === '1d' ? { month: 'short', day: 'numeric' } : { hour: '2-digit', minute: '2-digit' })}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Price chart">${grid}${bars}${lbl}</svg>`;
}

}
const usd = (v) => (v < 0.01 && v > 0 ? '<$0.01' : '$' + v.toFixed(2));
function aiItem(d) {
  const kind = { buy: d.verdict === 'skip' ? ['skip', 'Skipped buy'] : ['buy', 'Bought'], review: ['ai', 'Position review'], wallets: ['ai', 'Wallet review'], scout: ['ai', 'Wallet scout'], test: ['ai', 'Test'] }[d.kind] || ['ai', d.kind];
  const token = d.mint ? ` ${tokenLink(d.mint)}${d.symbol ? ` <span class="muted">${esc(d.symbol)}</span>` : ''}` : '';
  let outcome = '';
  if (d.kind === 'buy' && d.verdict === 'skip') {
    outcome = d.outcomePct === undefined ? '<div>1h result: waiting…</div>'
      : d.outcomePct === null ? '<div>1h result: no price</div>'
      : `<div>1h later: <b class="${d.outcomePct < 0 ? 'pos' : 'neg'}">${d.outcomePct > 0 ? '+' : ''}${d.outcomePct.toFixed(0)}%</b> ${d.outcomePct < 0 ? '(good skip)' : '(missed gain)'}</div>`;
  }
  const applied = d.applied?.length ? `<ul style="margin:6px 0 0;padding-left:18px">${d.applied.map((a) => `<li>${esc(a)}</li>`).join('')}</ul>` : '';
  return `<li class="ai-item"><span class="t">${time(d.t)}</span>
    <div><span class="tag ${kind[0]}">${kind[1]}</span>${token} <span class="what">${d.kind === 'buy' ? '' : esc(d.verdict)}</span></div>
    <div class="meta">${usd(d.costUsd)}${outcome}</div>
    <div class="why">${esc(d.reason)}${applied}</div></li>`;
}

const getP = (o, p) => p.split('.').reduce((a, k) => a?.[k], o);
const setP = (o, p, v) => { const ks = p.split('.'); const last = ks.pop(); ks.reduce((a, k) => (a[k] ??= {}), o)[last] = v; };

function fieldHtml(f) {
  let v = getP(S.config, f.k);
  if (f.toView) v = f.toView(v);
  const id = 'f-' + f.k.replace(/\./g, '-');
  let ctl;
  if (f.type === 'toggle') ctl = `<label class="switch"><input type="checkbox" id="${id}" data-k="${f.k}" ${v ? 'checked' : ''}><i></i></label>`;
  else if (f.type === 'select') ctl = `<select class="input" id="${id}" data-k="${f.k}">${f.options.map(([val, l]) => `<option value="${val}" ${val === v ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
  else if (f.type === 'text') ctl = `<textarea class="input" id="${id}" data-k="${f.k}" rows="3" maxlength="1000" placeholder="none">${esc(v || '')}</textarea>`;
  else if (f.type === 'list') ctl = `<textarea class="input" id="${id}" data-k="${f.k}" rows="3" placeholder="none">${esc((v || []).join('\n'))}</textarea>`;
  else ctl = `<div class="with-unit"><input type="number" inputmode="decimal" id="${id}" data-k="${f.k}" value="${esc(+Number(v).toFixed(9))}" step="${f.step || 'any'}" min="0"><span>${f.unit}</span></div>`;
  return `<div class="field"><div><label class="l" for="${id}">${f.label}</label>${f.help ? `<div class="h">${typeof f.help === 'function' ? f.help() : f.help}</div>` : ''}</div>${ctl}</div>`;
}

function bindAlerts() {

    msg('<span class="spinner" style="display:inline-block;vertical-align:middle"></span> Looking…');
    const r = await act(() => api('POST', '/api/alerts/detect-telegram', { telegramToken: $('#al-tg').value }));
    if (r) { $('#al-chat').value = r.chatId; msg(`<span class="pos">✓ Found ${esc(r.name)}. Press Save alerts.</span>`); } else msg('');
  };
  $('#al-save').onclick = async () => {
    const body = { telegramChatId: $('#al-chat').value };
    if ($('#al-tg').value) body.telegramToken = $('#al-tg').value;
    if ($('#al-dc').value) body.discordWebhook = $('#al-dc').value;
    const r = await act(() => api('PUT', '/api/alerts', body), 'Alerts saved');
    if (r) { S.connection = r; render(); }
  };
  $('#al-test').onclick = async () => {
    msg('<span class="spinner" style="display:inline-block;vertical-align:middle"></span> Sending…');
    const r = await act(() => api('POST', '/api/alerts/test'));
    msg(r ? '<span class="pos">✓ Sent. Check your phone.</span>' : '');
  };
  const cl = $('#al-clear');
  if (cl) cl.onclick = async () => {
    if (!(await confirmModal({ title: 'Turn off phone alerts?', body: '<p>Your Telegram token and Discord webhook are removed from this computer.</p>', confirm: 'Turn off' }))) return;
    const r = await act(() => api('PUT', '/api/alerts', { telegramToken: '', telegramChatId: '', discordWebhook: '' }), 'Alerts turned off');
    if (r) { S.connection = r; render(); }
  };
}

  if (!t) return '';
  if (!t.ok) return `<span class="neg">✕ ${esc(t.error)}</span>`;
  return `<span class="${t.rpcMs < 800 ? 'pos' : ''}">✓ RPC ${t.rpcMs} ms</span> · ${t.jupiterOk ? `<span class="pos">✓ Jupiter ${t.jupMs} ms</span>` : '<span class="neg">✕ Jupiter unreachable</span>'}${t.backup ? (t.backup.ok ? ` · <span class="pos">✓ Backup RPC ${t.backup.ms} ms</span>` : ` · <span class="neg">✕ Backup RPC: ${esc(t.backup.error)}</span>`) : ''}${t.solscan ? (t.solscan.ok ? ' · <span class="pos">✓ Solscan</span>' : ` · <span class="neg">✕ Solscan: ${esc(t.solscan.error)}</span>`) : ''}${t.solPrice ? ` · SOL ≈ $${t.solPrice.toFixed(2)}` : ''}`;
}
async function saveSettings() {
  const cfg = structuredClone(S.config);
  const all = FIELDS.flatMap((s) => s.fields);
  for (const f of all) {
    const el = document.querySelector(`[data-k="${f.k}"]`);
    let v;
    if (f.type === 'toggle') v = el.checked;
    else if (f.type === 'select') v = el.value;
    else if (f.type === 'text') v = el.value;
    else if (f.type === 'list') v = el.value.split(/[\s,]+/).map((s) => s.trim()).filter(Boolean);
    else {
      v = Number(el.value);
      if (el.value === '' || isNaN(v) || v < 0) return toast(`"${f.label}" needs a positive number`, true);
      if (f.fromView) v = f.fromView(v);
    }
    setP(cfg, f.k, v);
  }
  const r = await act(() => api('PUT', '/api/config', cfg), 'Settings saved');
  if (r) { S.config = r.config; S.dirty = false; if (r.restarted) toast('Bot restarted with new settings'); render(); }
}
async function setMode(mode) {
  if (mode === S.config.mode) return;
  if (S.dirty) return toast('Save or discard your other changes first', true);
  if (mode === 'live') {
    const ok = await confirmModal({ title: 'Switch to live trading?', danger: true, confirm: 'Switch to live',
      body: `<p>From now on the bot spends <b>real SOL</b>. Before you switch:</p><ul><li>You've run paper mode for a few days and like the results</li><li>You're using a separate wallet with only money you can lose</li><li>You're on a private RPC (Helius), not the public one</li></ul>` });
    if (!ok) return;
  }
  const r = await act(() => api('PUT', '/api/config', { ...S.config, mode }), mode === 'live' ? 'Live mode on' : 'Paper mode on');
  if (r) { S.config = r.config; render(); }
}

// ---------------- live updates ----------------
function connectEvents() {
  if (!TOKEN) return showLocked();
  const es = new EventSource('/api/events?token=' + encodeURIComponent(TOKEN));
  es.addEventListener('log', (e) => {
    const l = JSON.parse(e.data);
    S.logs.push(l); if (S.logs.length > 500) S.logs.shift();
    const feed = $('#feed');
    if (feed) { if (S.logs.length === 1) feed.innerHTML = ''; feed.insertAdjacentHTML('afterbegin', feedItem(l)); while (feed.children.length > 150) feed.lastChild.remove(); }
  });
  es.addEventListener('trade', (e) => {
    const t = JSON.parse(e.data);
    S.trades.unshift(t);
    if (S.page === 'trades') render();
  });
  es.addEventListener('status', (e) => {
    S.status = JSON.parse(e.data);
    renderChrome();
    if (S.page === 'dashboard') render();
  });
  es.addEventListener('config', (e) => {
    if (S.page === 'settings' && S.dirty) return;
    S.config = JSON.parse(e.data);
    render();
  });
  es.addEventListener('ui', (e) => {
    S.ui = JSON.parse(e.data); applyMode(S.ui.mode);
    if (!(S.page === 'settings' && S.dirty)) render();
  });
  es.addEventListener('update', (e) => {
    S.app.update = JSON.parse(e.data);
    renderChrome();
    const t = $('#upd-text');
    // Re-render for state changes that add/remove buttons or banners; otherwise just update the text.
    if (['ready', 'rejected', 'installing'].includes(S.app.update.state) || !t) { if (!(S.page === 'settings' && S.dirty)) render(); }
    else t.innerHTML = updateText();
  });
  es.addEventListener('connection', (e) => { S.connection = JSON.parse(e.data); renderChrome(); });
  es.addEventListener('scout', (e) => { S.scout = JSON.parse(e.data); });
  es.addEventListener('health', (e) => { S.health = JSON.parse(e.data); if (S.page === 'wallets') render(); });
  es.addEventListener('ai', (e) => {
    const d = JSON.parse(e.data);
    if (!S.ai) return;
    const i = S.ai.decisions.findIndex((x) => x.id === d.id);
    if (i >= 0) S.ai.decisions[i] = d; else S.ai.decisions.unshift(d);
    if (S.page === 'autopilot') loadAi();
  });
  es.addEventListener('job', (e) => {
    const j = JSON.parse(e.data);
    upsertJob(j);
    if (S.page === 'research') { if (j.kind === 'scout') render(); else renderJobs(); }
    if (S.page === 'backtest' && (j.kind === 'backtest' || j.kind === 'optimize' || j.kind === 'compare')) render();
    if (S.page === 'wallets' && j.kind === 'health') render();
    if (S.page === 'autopilot' && j.kind === 'scout') renderAutopilot($('#content'), true);
  });
  es.onerror = () => { $('#run-pill').innerHTML = '<span class="pill"><span class="dot bad"></span>Disconnected</span>'; };
  es.onopen = () => load();
}
async function load() {
  try {
    const d = await api('GET', '/api/state');
    if (d.ui) { S.ui = d.ui; applyMode(d.ui.mode); }
    const firstLoad = !S.loadedOnce; S.loadedOnce = true;
    Object.assign(S, { app: d.app, status: d.status, config: S.dirty ? S.config : d.config, logs: d.logs, trades: d.trades, connection: d.connection, jobs: d.jobs, scout: d.scout, strategies: d.strategies || [], health: d.health || null });
    render();
    if (firstLoad && d.ui && !d.ui.setupDone) wizard(0);
  } catch (e) { toast('Could not reach the bot. Is it still running?', true); }
}
const h = location.hash.slice(1);
if (TITLES[h]) S.page = h;
connectEvents();
setInterval(() => { if (S.status?.running) renderChrome(); }, 15000);
</script>
