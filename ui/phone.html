<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Remora">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<title>Remora</title>
<style>
:root { --bg: #f6f4fb; --panel: #fff; --panel-2: #f0edf8; --text: #1b1530; --muted: #6d6787; --border: #e6e1f2; --accent: #7c3aed; --green: #15803d; --green-bg: #dcfce7; --red: #dc2626; --red-bg: #fee2e2; --amber: #b45309; --amber-bg: #fef3c7; }
@media (prefers-color-scheme: dark) { :root { --bg: #0f0b1e; --panel: #1a1530; --panel-2: #241d40; --text: #f2eefc; --muted: #a39cc0; --border: #2f2752; --accent: #a78bfa; --green: #4ade80; --green-bg: #14532d55; --red: #f87171; --red-bg: #7f1d1d55; --amber: #fbbf24; --amber-bg: #78350f55; } }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
main { max-width: 560px; margin: 0 auto; padding: max(14px, env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom)); }
header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
header h1 { font-size: 20px; margin: 0; flex: 1; }
.badge { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--panel-2); color: var(--muted); }
.badge.live { background: var(--red-bg); color: var(--red); }
.badge.on { background: var(--green-bg); color: var(--green); }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
.card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat .k { font-size: 12.5px; color: var(--muted); }
.stat .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.pos { color: var(--green); } .neg { color: var(--red); } .muted { color: var(--muted); }
button { font: inherit; border: 0; border-radius: 12px; padding: 12px 14px; background: var(--panel-2); color: var(--text); font-weight: 600; cursor: pointer; min-height: 44px; }
button:disabled { opacity: .5; }
button.primary { background: var(--accent); color: #fff; }
button.stop { background: var(--red); color: #fff; }
button.sm { padding: 8px 12px; min-height: 36px; font-size: 14px; }
button.wide { width: 100%; font-size: 17px; }
.row { display: flex; align-items: center; gap: 8px; }
.between { justify-content: space-between; }
.pos-item { padding: 10px 0; border-top: 1px solid var(--border); }
.pos-item:first-of-type { border-top: 0; padding-top: 0; }
.mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
.log { font-size: 13px; padding: 6px 0; border-top: 1px solid var(--border); overflow-wrap: anywhere; }
.log:first-of-type { border-top: 0; }
.log time { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 6px; }
.log.warn, .log.error { color: var(--amber); }
.banner { border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; font-size: 14px; background: var(--amber-bg); color: var(--amber); }
.banner.err { background: var(--red-bg); color: var(--red); }
.switch { position: relative; width: 50px; height: 30px; flex: none; }
.switch input { opacity: 0; width: 100%; height: 100%; position: absolute; margin: 0; cursor: pointer; z-index: 1; }
.switch i { position: absolute; inset: 0; border-radius: 999px; background: var(--border); transition: .15s; }
.switch i::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: .15s; }
.switch input:checked + i { background: var(--accent); }
.switch input:checked + i::after { transform: translateX(20px); }
.center { text-align: center; padding: 30px 10px; }
input[type=text] { font: inherit; width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); margin: 8px 0 12px; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: calc(100% - 32px); z-index: 9; }
.toast.err { background: var(--red); color: #fff; }
.chart { width: 100%; height: 110px; display: block; overflow: visible; }
.spark { width: 72px; height: 22px; vertical-align: middle; overflow: visible; }
.tabs { display: flex; gap: 6px; margin-bottom: 10px; }
.tabs button { flex: 1; min-height: 36px; padding: 6px; font-size: 14px; }
.tabs button.on { background: var(--accent); color: #fff; }
.chip { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--panel-2); color: var(--muted); vertical-align: middle; }
.chip.base { background: #1d4ed822; color: #3b82f6; }
.chip.copying { background: var(--green-bg); color: var(--green); }
.chip.shadow, .chip.trial { background: var(--panel-2); color: var(--accent); }
.chip.paused { background: var(--amber-bg); color: var(--amber); }
.banner.info { background: var(--panel-2); color: var(--text); }
a.coin { color: var(--text); text-decoration: none; font-weight: 600; }
.bar { height: 6px; border-radius: 6px; background: var(--panel-2); overflow: hidden; margin: 4px 0 2px; }
.bar i { display: block; height: 100%; background: var(--accent); }
</style>
</head>
<body>
<main id="app"><div class="center muted">Loading…</div></main>
<div id="toast"></div>
<script>
'use strict';
const KEY = 'copybot-device-key';
const store = {
  get() { try { return localStorage.getItem(KEY); } catch { return null; } },
  set(v) { try { localStorage.setItem(KEY, v); } catch {} },
  clear() { try { localStorage.removeItem(KEY); } catch {} },
};
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const short = (a) => esc(`${String(a).slice(0, 4)}…${String(a).slice(-4)}`);
const sol = (n, d = 3) => (n == null || isNaN(n) ? '—' : `${n >= 0 ? '+' : '−'}${Math.abs(n).toFixed(d)}`);
const pct = (n) => (n == null || isNaN(n) ? '—' : `${n >= 0 ? '+' : '−'}${Math.abs(n).toFixed(1)}%`);
const cls = (n) => (n > 0 ? 'pos' : n < 0 ? 'neg' : '');
const hhmm = (t) => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
function ago(t) { const s = Math.max(0, (Date.now() - t) / 1000); return s < 60 ? `${Math.floor(s)}s` : s < 3600 ? `${Math.floor(s / 60)}m` : s < 86400 ? `${Math.floor(s / 3600)}h ${Math.floor((s % 3600) / 60)}m` : `${Math.floor(s / 86400)}d`; }
const $ = (s) => document.querySelector(s);
const isBase = (x) => x && (x.chain === 'base' || /^0x/.test(x.mint || ''));
const coin = (x) => `<a class="coin" href="https://dexscreener.com/${isBase(x) ? 'base' : 'solana'}/${esc(x.mint)}" target="_blank" rel="noopener">${x.symbol ? esc(x.symbol) : `<span class="mono">${short(x.mint)}</span>`}</a>${isBase(x) ? ' <span class="chip base">Base</span>' : ''}`;
let S = null, tab = 'positions', busy = false, offline = false, timer = null;

function toast(msg, err) {
  const el = $('#toast');
  el.innerHTML = `<div class="toast ${err ? 'err' : ''}">${esc(msg)}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(() => (el.innerHTML = ''), 3500);
}

async function call(method, path, body) {
  const r = await fetch(path, { method, headers: { 'content-type': 'application/json', 'x-copybot-device': store.get() || '' }, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { store.clear(); S = null; showUnpaired(j.error); throw new Error(j.error || 'Not paired'); }
  if (!r.ok) throw new Error(j.error || `Error ${r.status}`);
  return j;
}

// ---------------- charts ----------------
// A simple line: above the starting value in green, below in red, with a faint break-even line.
function line(pts, cls2, base) {
  if (!pts || pts.length < 2) return '';
  const t0 = pts[0][0], t1 = Math.max(pts[pts.length - 1][0], t0 + 1);
  const b = base ?? pts[0][1];
  const vs = pts.map((p) => p[1]).concat([b]);
  let lo = Math.min(...vs), hi = Math.max(...vs); if (hi - lo < 1e-12) { hi += 1; lo -= 1; }
  const Y = (v) => ((1 - (v - lo) / (hi - lo)) * 90 + 5).toFixed(1);
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${(((p[0] - t0) / (t1 - t0)) * 100).toFixed(1)},${Y(p[1])}`).join('');
  const col = pts[pts.length - 1][1] >= b ? 'var(--green)' : 'var(--red)';
  return `<svg class="${cls2}" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><line x1="0" x2="100" y1="${Y(b)}" y2="${Y(b)}" stroke="var(--border)" stroke-width="1" vector-effect="non-scaling-stroke"/><path d="${d}L100,${Y(b)}L0,${Y(b)}Z" fill="${col}" opacity=".1"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}

// ---------------- pairing ----------------
function showUnpaired(why) {
  stopPolling();
  $('#app').innerHTML = `<header><h1>Remora</h1></header><div class="card center">
    <h2 style="text-transform:none;font-size:18px;color:var(--text)">This phone isn't paired</h2>
    <p class="muted">${esc(why || '')}</p>
    <p>On your computer, open Remora → <b>Settings → Phone access</b>, press <b>Pair a phone</b>, and scan the QR code with this phone's camera.</p></div>`;
}

function showPair(code) {
  $('#app').innerHTML = `<header><h1>Pair with Remora</h1></header><div class="card">
    <p>Give this phone a name so you can recognise it on your computer:</p>
    <input type="text" id="pname" maxlength="40" value="My phone" autocomplete="off">
    <button class="primary wide" id="pgo">Pair this phone</button>
    <p class="muted" style="font-size:13px;margin-bottom:0">This phone will be able to see your profit, positions and wallets, start and stop the bot, sell positions, pause a wallet and switch the market scanner. It can't change settings or keys, or add wallets.</p></div>`;
  $('#pgo').onclick = async () => {
    $('#pgo').disabled = true;
    try {
      const r = await fetch('/r/pair', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ code, name: $('#pname').value }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || `Error ${r.status}`);
      store.set(j.key);
      if (store.get() !== j.key) throw new Error("This browser won't save the pairing (private browsing?). Open the link in your normal browser.");
      toast(`Paired as ${j.name}`);
      start();
    } catch (e) { toast(e.message, true); $('#pgo').disabled = false; }
  };
}

// ---------------- main screen ----------------
function render() {
  if (!S) return;
  const live = S.mode === 'live';
  const g = S.guard || {};
  const sc = S.scanner;
  const posHtml = S.positions.length ? S.positions.map((p) => `<div class="pos-item">
      <div class="row between"><span>${coin(p)}</span><span class="row" style="gap:10px">${line(p.trail, 'spark', 1)}<b class="${cls(p.pnlPct)}">${pct(p.pnlPct)}</b></span></div>
      <div class="row between muted" style="font-size:13px"><span>${esc((p.from || []).join(', '))} · ${ago(p.openedAt)}</span><span>${p.costSol.toFixed(3)} → ${p.valueSol == null ? '—' : p.valueSol.toFixed(3)} SOL</span></div>
      <div class="row" style="margin-top:8px"><button class="sm" data-sell="${esc(p.mint)}" data-f="0.5">Sell 50%</button><button class="sm stop" data-sell="${esc(p.mint)}" data-f="1">Sell all</button>${p.valueSol == null || (p.pnlPct != null && p.pnlPct <= -80) ? `<button class="sm" data-writeoff="${esc(p.mint)}" data-cost="${p.costSol}">Write off</button>` : ''}</div></div>`).join('')
    : '<div class="muted">No open positions.</div>';
  const tradesHtml = S.trades.length ? S.trades.map((t) => `<div class="log"><time>${hhmm(t.t)}</time><b class="${t.side === 'buy' ? '' : cls(t.pnl)}">${t.side === 'buy' ? 'BUY' : 'SELL'}</b> ${coin(t)} ${t.sol.toFixed(3)} SOL${t.side === 'sell' && t.pnl != null ? ` · <span class="${cls(t.pnl)}">${sol(t.pnl, 4)}</span>` : ''}${t.reason ? `<div class="muted">${esc(t.reason)}</div>` : ''}</div>`).join('') : '<div class="muted">No trades yet.</div>';
  const wl = S.walletList || [];
  const walletsHtml = wl.length ? wl.map((w) => `<div class="pos-item">
      <div class="row between"><span><b>${esc(w.label)}</b>${w.chain === 'base' ? ' <span class="chip base">Base</span>' : ''} <span class="chip ${w.state}">${{ copying: 'Copying', trial: 'Trial', shadow: 'Shadow', paused: 'Paused', off: 'Off' }[w.state]}</span></span><b class="${cls(w.pnlSol)}">${w.closed ? sol(w.pnlSol) : '—'}</b></div>
      <div class="row between muted" style="font-size:13px"><span>${esc(w.state === 'copying' ? `${w.closed} closed · ${w.wins} won` : w.note)}</span>${w.state === 'copying' || w.state === 'trial' ? `<button class="sm" data-pause="${esc(w.id)}" data-name="${esc(w.label)}">Pause</button>` : ''}</div></div>`).join('')
    + '<div class="muted" style="font-size:12.5px;margin-top:10px">Turning wallets back on, and promoting shadow wallets, is done on the computer.</div>'
    : '<div class="muted">No wallets yet.</div>';
  const a = S.activity;
  const actHtml = a ? `<div style="font-size:14px;margin-bottom:8px"><b>Last hour:</b> ${a.seen} buy signal${a.seen === 1 ? '' : 's'} seen, ${a.copied} copied.${a.skips && a.skips.length ? `<div class="muted" style="font-size:13px;margin-top:4px">Skipped because ${a.skips.slice(0, 3).map((x) => `${esc(x.group)} (${x.n})`).join(', ')}.</div>` : ''}</div>` : '';
  const logHtml = actHtml + S.logs.slice().reverse().map((l) => `<div class="log ${esc(l.level)}"><time>${hhmm(l.t)}</time>${esc(l.msg)}</div>`).join('') || '<div class="muted">Nothing yet.</div>';
  $('#app').innerHTML = `
    <header><h1>Remora</h1><span class="badge ${live ? 'live' : ''}">${live ? 'LIVE' : 'Paper'}</span><span class="badge ${S.running ? 'on' : ''}">${S.running ? `Running · ${ago(S.startedAt)}` : 'Stopped'}</span></header>
    ${offline ? '<div class="banner err">Can\'t reach Remora. Is your computer on, Remora open, and (away from home) Tailscale on, on both devices?</div>' : ''}
    ${S.connection ? `<div class="banner ${S.connection.level === 'bad' ? 'err' : ''}">${esc(S.connection.text)}. Check Settings → Connections on the computer.</div>` : ''}
    ${S.paperLive ? `<div class="banner info"><b>Paper vs live:</b> ${esc(S.paperLive)}</div>` : ''}
    ${S.ramp ? `<div class="banner ${S.ramp.due ? '' : 'info'}">${esc(S.ramp.text)}${S.ramp.due ? ' Bring them back on the computer (Settings → Trading mode).' : ''}</div>` : ''}
    ${g.blocked ? `<div class="banner">New buys paused: ${esc(g.blocked)} <button class="sm" id="resume" style="margin-top:6px">Resume buying today</button></div>` : ''}
    <button class="wide ${S.running ? 'stop' : 'primary'}" id="runbtn" ${busy ? 'disabled' : ''}>${S.running ? 'Stop bot' : `Start bot${live ? ' (LIVE)' : ''}`}</button>
    ${S.positions.length || S.running ? `<button class="wide" id="panic" style="margin-top:8px;background:var(--red-bg);color:var(--red)" ${busy || S.panicking ? 'disabled' : ''}>${S.panicking ? 'Selling everything…' : 'Sell everything &amp; stop'}</button>` : ''}
    ${S.series && S.series.length > 1 ? (() => { const a = S.series[0][1], b = S.series[S.series.length - 1][1]; return `<div class="card" style="margin-top:12px"><div class="row between"><h2 style="margin:0">${S.paper ? 'Paper wallet' : 'Wallet'} value · 24 h</h2><span class="${cls(b - a)}" style="font-size:13px;font-weight:600">${sol(b - a)} SOL</span></div><div style="margin-top:8px">${line(S.series, 'chart')}</div><div class="row between muted" style="font-size:12px"><span>${hhmm(S.series[0][0])}</span><span>${b.toFixed(3)} SOL now</span></div></div>`; })() : ''}
    <div class="card stats" style="margin-top:12px">
      <div class="stat"><div class="k">Realized profit</div><div class="v ${cls(S.realizedPnlSol)}">${sol(S.realizedPnlSol)}</div><div class="k">SOL, closed trades</div></div>
      <div class="stat"><div class="k">Open profit</div><div class="v ${cls(S.unrealizedPnlSol)}">${sol(S.unrealizedPnlSol)}</div><div class="k">SOL if sold now</div></div>
      <div class="stat"><div class="k">In positions</div><div class="v">${S.exposureSol.toFixed(2)}</div><div class="k">of ${S.maxExposureSol} SOL · ${S.positions.length} open</div></div>
      <div class="stat"><div class="k">${S.paper ? 'Paper wallet' : 'Wallet'}</div><div class="v">${S.paper ? (S.paper.startSol + S.realizedPnlSol + S.unrealizedPnlSol).toFixed(2) : S.balance == null ? '—' : S.balance.toFixed(3)}</div><div class="k">SOL${S.baseBalance != null ? ` · ${S.baseBalance.toFixed(4)} ETH on Base` : ''} · copying ${S.wallets} wallet${S.wallets === 1 ? '' : 's'}</div></div>
    </div>
    ${(() => { const d = S.today; if (!d) return ''; const both = d.base.closed || (S.walletList || []).some((w) => w.chain === 'base');
      return `<div class="card"><div class="row between"><h2 style="margin:0">Today</h2><b class="${cls(d.pnlSol)}" style="font-size:18px">${d.closed ? sol(d.pnlSol) + ' SOL' : '—'}</b></div>
        <div class="muted" style="font-size:13px;margin-top:4px">${d.closed ? `${d.closed} closed · ${d.wins} won` : 'No closed trades yet today'}${both && d.closed ? ` · Solana <span class="${cls(d.solana.pnlSol)}">${sol(d.solana.pnlSol)}</span> · Base <span class="${cls(d.base.pnlSol)}">${sol(d.base.pnlSol)}</span>` : ''}</div></div>`; })()}
    <div class="card"><h2>Market scanner</h2>
      <div class="row between" style="margin-bottom:10px"><span>Find traders</span><label class="switch"><input type="checkbox" id="sc-t" ${sc.findTraders ? 'checked' : ''} ${busy ? 'disabled' : ''}><i></i></label></div>
      <div class="row between"><span>Trade coins</span><label class="switch"><input type="checkbox" id="sc-c" ${sc.tradeCoins ? 'checked' : ''} ${busy ? 'disabled' : ''}><i></i></label></div>
      ${sc.record.trades ? `<div class="muted" style="font-size:13px;margin-top:8px">Scanner: <span class="${cls(sc.record.pnlSol)}">${sol(sc.record.pnlSol)} SOL</span> · ${sc.record.wins} of ${sc.record.closed} sells in profit</div>` : ''}
      ${sc.tradeCoins && sc.signals.length ? `<div class="muted" style="font-size:13px;margin-top:6px">Rising now: ${sc.signals.map((x) => `<b>${esc(x.symbol)}</b>`).join(', ')}</div>` : ''}
    </div>
    ${S.orders && S.orders.length ? `<div class="card"><h2>Open orders</h2>${S.orders.map((o) => `<div class="pos-item"><div style="font-size:14px">${esc(o.text)}</div>${o.note ? `<div class="muted" style="font-size:12.5px">${esc(o.note)}</div>` : ''}<button class="sm" data-cancel="${esc(o.id)}" style="margin-top:6px">Cancel</button></div>`).join('')}</div>` : ''}
    <div class="tabs">${[['positions', `Positions (${S.positions.length})`], ['wallets', 'Wallets'], ['trades', 'Trades'], ['activity', 'Activity']].map(([k, l]) => `<button data-tab="${k}" class="${tab === k ? 'on' : ''}">${l}</button>`).join('')}</div>
    <div class="card">${tab === 'positions' ? posHtml : tab === 'wallets' ? walletsHtml : tab === 'trades' ? tradesHtml : logHtml}</div>
    <div class="row between muted" style="font-size:12.5px;margin-top:18px"><span>Remora${S.version ? ' v' + esc(S.version) : ''} · updates every few seconds</span><button class="sm" id="unpair">Unpair</button></div>`;
  bind();
}

function bind() {
  document.querySelectorAll('[data-tab]').forEach((b) => (b.onclick = () => { tab = b.dataset.tab; render(); }));
  $('#runbtn').onclick = async () => {
    if (!S.running && S.mode === 'live' && !confirm('Start in LIVE mode? The bot will spend real SOL.')) return;
    if (S.running && !confirm('Stop the bot? Open positions stay open, but stop-losses and take-profits stop running until you start it again.')) return;
    await action(() => call('POST', S.running ? '/r/stop' : '/r/start'), S.running ? 'Bot stopped' : 'Bot started');
  };
  const pn = $('#panic'); if (pn) pn.onclick = () => {
    const n = S.positions.length;
    if (!confirm(n ? `Sell ALL ${n} open position${n === 1 ? '' : 's'}${S.mode === 'live' ? ' (LIVE, real sells)' : ''} and stop the bot?` : 'Stop the bot?')) return;
    action(() => call('POST', '/r/panic'), (r) => (r.panic?.failed?.length ? [`Sold ${r.panic.sold}; ${r.panic.failed.length} couldn't be sold. Check the computer.`, true] : ['Sold everything. The bot is stopped.']));
  };
  document.querySelectorAll('[data-cancel]').forEach((b) => (b.onclick = () => confirm('Cancel this order?') && action(() => call('POST', '/r/orders/cancel', { id: b.dataset.cancel }), 'Order cancelled')));
  const res = $('#resume'); if (res) res.onclick = () => confirm('Let the bot buy again today despite the loss limit?') && action(() => call('POST', '/r/resume'), 'Buying resumed');
  document.querySelectorAll('[data-writeoff]').forEach((b) => (b.onclick = () => confirm(`Write off ${b.dataset.writeoff.slice(0, 4)}…${b.dataset.writeoff.slice(-4)}? For a dead coin nobody will buy: it's removed from your positions as a loss of ${Number(b.dataset.cost).toFixed(4)} SOL, without selling, so its slot is free.${S.mode === 'live' ? ' The coins stay in your wallet.' : ''}`) && action(() => call('POST', '/r/writeoff', { mint: b.dataset.writeoff }), 'Written off')));
  document.querySelectorAll('[data-pause]').forEach((b) => (b.onclick = () => confirm(`Pause ${b.dataset.name}? Its open positions still follow its sells. Turn it back on from the computer.`) && action(() => call('POST', '/r/wallet/pause', { id: b.dataset.pause }), 'Wallet paused')));
  document.querySelectorAll('[data-sell]').forEach((b) => (b.onclick = () => {
    const f = Number(b.dataset.f);
    if (!confirm(`Sell ${f === 1 ? 'ALL' : 'half'} of ${b.dataset.sell.slice(0, 4)}…${b.dataset.sell.slice(-4)}${S.mode === 'live' ? ' (LIVE)' : ''}?`)) return;
    action(() => call('POST', '/r/sell', { mint: b.dataset.sell, fraction: f }), 'Sell sent');
  }));
  const sw = (id, key) => ($(id).onchange = (e) => {
    const v = e.target.checked;
    if (v && key === 'tradeCoins' && !confirm(`Let the scanner buy rising coins on its own${S.mode === 'live' ? ' with REAL SOL' : ''}? It uses its own budget and stop-loss.`)) { e.target.checked = false; return; }
    action(() => call('POST', '/r/scanner', { [key]: v }), 'Scanner updated');
  });
  sw('#sc-t', 'findTraders'); sw('#sc-c', 'tradeCoins');
  $('#unpair').onclick = async () => {
    if (!confirm('Unpair this phone? You can pair it again from your computer.')) return;
    try { await call('POST', '/r/unpair'); } catch {}
    store.clear(); showUnpaired('You unpaired this phone.');
  };
}

async function action(fn, ok) {
  busy = true; render();
  try { S = await fn(); const m = typeof ok === 'function' ? ok(S) : [ok]; toast(m[0], m[1]); } catch (e) { if (store.get()) toast(e.message, true); }
  busy = false; if (S) render();
}

async function refresh() {
  try { S = await call('GET', '/r/state'); offline = false; render(); }
  catch (e) { if (!store.get()) return; offline = true; if (S) render(); else $('#app').innerHTML = `<header><h1>Remora</h1></header><div class="banner err">Can't reach Remora. Is your computer on, Remora open, and (away from home) Tailscale on, on both devices?</div>`; }
}
function stopPolling() { clearInterval(timer); timer = null; }
function start() {
  stopPolling(); refresh();
  timer = setInterval(() => { if (document.visibilityState === 'visible' && !busy) refresh(); }, 4000);
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && timer) refresh(); });

const m = /[#&]pair=([A-Za-z0-9_-]{10,100})/.exec(location.hash);
if (m) { history.replaceState(null, '', '/'); showPair(m[1]); }
else if (store.get()) start();
else showUnpaired('');
</script>
</body>
</html>
