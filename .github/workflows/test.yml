name: Tests

# Type-check, run the unit tests, then the end-to-end checks against a made-up market:
# junk sent to every endpoint, and 3 minutes of trading with random crashes.
on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run test:fuzz
      - run: npm run test:stress
