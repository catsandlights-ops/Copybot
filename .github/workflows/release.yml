name: Release update

# Publishes a signed Windows installer as a GitHub release whenever the version in
# package.json changes on main (e.g. after `npm version patch`), or when run by hand
# from the Actions tab. Installed copies of Copybot pick it up automatically.
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Check what's already released
        id: check
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          API="repos/$GITHUB_REPOSITORY/releases"
          # Remove unpublished leftovers (e.g. from an interrupted run). Apps never see drafts.
          for id in $(gh api "$API?per_page=100" --jq '.[] | select(.draft) | .id'); do
            gh api -X DELETE "$API/$id"
          done
          # Already published with everything the app needs? Then there's nothing to do.
          ASSETS=$(gh api "$API?per_page=100" --jq ".[] | select(.tag_name == \"v$VERSION\") | .assets[].name")
          if grep -qx "Copybot-Setup-$VERSION.exe" <<<"$ASSETS" && grep -qx "Copybot-Setup-$VERSION.exe.sig" <<<"$ASSETS" && grep -qx "latest.yml" <<<"$ASSETS"; then
            echo "v$VERSION is already published, nothing to do."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            # An incomplete release for this version would break updates; remove it and rebuild.
            for id in $(gh api "$API?per_page=100" --jq ".[] | select(.tag_name == \"v$VERSION\") | .id"); do
              echo "Removing incomplete release v$VERSION ($id)"
              gh api -X DELETE "$API/$id"
            done
          fi

      - name: Check the signing key is configured
        if: steps.check.outputs.skip != 'true'
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::error::Add the UPDATE_SIGNING_KEY repository secret (contents of update-signing-key.pem) first."
            exit 1
          fi

      - uses: actions/setup-node@v5
        if: steps.check.outputs.skip != 'true'
        with: { node-version: 22 }
      - if: steps.check.outputs.skip != 'true'
        run: npm ci

      # Never publish an update that fails its checks: installed apps would install it automatically.
      - name: Type-check
        if: steps.check.outputs.skip != 'true'
        run: npx tsc --noEmit
      - name: Run tests
        if: steps.check.outputs.skip != 'true'
        run: npm test
      - if: steps.check.outputs.skip != 'true'
        run: npm run bundle

      # 1. Build the installer locally on the runner (no upload yet).
      - if: steps.check.outputs.skip != 'true'
        run: npx electron-builder --win --publish never

      # 2. Sign the installer with the Copybot update key.
      - name: Sign update
        if: steps.check.outputs.skip != 'true'
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: node scripts/sign-update.mjs "release/Copybot-Setup-$VERSION.exe"

      # 3. Create ONE draft release with every file, then publish it so installed apps see it.
      - name: Publish release
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          F="release/Copybot-Setup-$VERSION.exe"
          gh release create "v$VERSION" "$F" "$F.blockmap" "$F.sig" release/latest.yml \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
            --title "Copybot $VERSION" --notes "Signed Copybot update. Installed copies update automatically (Settings → App updates)."
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
