name: Release update

# Publishes a signed Windows installer as a GitHub release whenever the version in
# package.json changes on main (e.g. after `npm version patch`), or when run by hand
# from the Actions tab. Installed copies of Copybot pick it up automatically.
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Skip if this version is already released
        id: check
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft -q '.isDraft' 2>/dev/null | grep -q false; then
            echo "v$VERSION is already published, nothing to do."
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: Check the signing key is configured
        if: steps.check.outputs.skip != 'true'
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::error::Add the UPDATE_SIGNING_KEY repository secret (contents of update-signing-key.pem) first."
            exit 1
          fi

      - uses: actions/setup-node@v5
        if: steps.check.outputs.skip != 'true'
        with: { node-version: 22 }
      - if: steps.check.outputs.skip != 'true'
        run: npm ci
      - if: steps.check.outputs.skip != 'true'
        run: npm run bundle

      # 1. Build and upload as a DRAFT release (installed apps ignore drafts).
      - if: steps.check.outputs.skip != 'true'
        run: npx electron-builder --win --publish always

      # 2. Sign the installer with the Copybot update key.
      - name: Sign update
        if: steps.check.outputs.skip != 'true'
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: node scripts/sign-update.mjs "release/Copybot-Setup-$VERSION.exe"

      # 3. Attach the signature, then publish so installed apps can see it.
      - name: Publish release
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          gh release upload "v$VERSION" "release/Copybot-Setup-$VERSION.exe.sig" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "v$VERSION" --draft=false --latest --repo "$GITHUB_REPOSITORY"
